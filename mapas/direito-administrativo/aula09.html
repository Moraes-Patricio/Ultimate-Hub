# 📚 Direito Administrativo: Aula 09 - Responsabilidade Civil do Estado

## ⏳ Eixo 1: Evolução Histórica e Teorias Doutrinárias
### 1. Teoria da Irresponsabilidade (*The King Can Do No Wrong*)
- Fase do Estado Absolutista: O monarca personificava o próprio Direito e não causava danos indenizáveis aos súditos
- Superada no Direito moderno a partir do caso *Blanco* (França, 1873)

### 2. Teorias Civilistas (Subjetivas)
- **Culpa Comum do Direito Civil**: Exigia que o particular provasse a culpa individual do agente público (ônus probatório impossível)
- Distinção teórica obsoleta entre *atos de império* (irresponsabilidade) e *atos de gestão* (responsabilidade civil comum)

### 3. Teorias Publicistas Modernas
- **Culpa do Serviço / Falta do Serviço (*Faute du Service*)**:
  - Teoria subjetiva anônima (independe de identificar o funcionário culpado)
  - Configura-se quando o serviço: *Não funcionou*, *Funcionou atrasado* ou *Funcionou mal/defeituoso*
  - Regra geral aplicada aos atos **OMISSIVOS GENÉRICOS** da Administração Pública
- **Teoria do Risco Administrativo**:
  - Responsabilidade **OBJETIVA**: Independe de dolo ou culpa do funcionário público
  - Requisitos: Conduta administrativa + Dano material/moral + Nexo de causalidade
  - **Admite Excludentes e Atenuantes**: Culpa exclusiva da vítima, caso fortuito, força maior e fato exclusivo de terceiro
  - **REGRA GERAL CONSTITUCIONAL DO BRASIL** (CF, art. 37, §6º)
- **Teoria do Risco Integral**:
  - Modalidade extremada de responsabilidade objetiva que **NÃO admite qualquer causa excludente ou atenuante**
  - Casos taxativos no Direito Brasileiro:
    - ☢️ Danos nucleares (CF, art. 21, XXIII, 'd')
    - 💥 Atos terroristas ou de guerra contra aeronaves brasileiras (Lei 10.744/2003)
    - 🌳 Danos ambientais (Tema 225 STJ / REsp 1.374.284)

---

## 📜 Eixo 2: O Artigo 37, §6º da CF/88 e a Matriz Constitucional
### 1. Pessoas Sujeitas à Responsabilidade Objetiva
- **Pessoas Jurídicas de Direito Público**: União, Estados, DF, Municípios, Autarquias e Fundações Públicas de Direito Público
- **Pessoas Jurídicas de Direito Privado Prestadoras de Serviços Públicos**:
  - Empresas Públicas e Sociedades de Economia Mista (quando prestam serviço público delegado)
  - Concessionárias, permissionárias e autorizatárias de serviços públicos
  - *Atenção*: Empresas estatais que exploram atividade econômica em concorrência respondem pelas regras do Direito Privado Comum!

### 2. Terceiros Usuários e Terceiros NÃO-Usuários (Tema 130 STF)
- A responsabilidade civil das concessionárias de serviço público é **OBJETIVA perante TODA a sociedade**
- Protege tanto os usuários diretos quanto terceiros não-usuários atingidos pelo evento lesivo (ex: pedestre atropelado por ônibus de concessionária)

---

## ⚡ Eixo 3: Conduta Comissiva (Ação) vs. Conduta Omissiva (Omissão)
### 1. Conduta Comissiva (Ação Positiva do Estado)
- Aplicação direta da **Teoria do Risco Administrativo (Responsabilidade Objetiva)**
- A vítima demonstra o fato administrativo, o dano e o nexo de causalidade

### 2. Conduta Omissiva (Inação Estatal)
- **Omissão Genérica do Estado**:
  - O Estado descumpre um dever geral de polícia, segurança ou conservação
  - Aplica-se a **Teoria da Culpa do Serviço (Responsabilidade SUBJETIVA)**
  - A vítima deve provar a ineficiência estatal (*faute du service*), a previsibilidade e a evitabilidade do evento danoso
- **Omissão Específica (Posição de Garante / Custódia)**:
  - O Estado tem o dever legal e individualizado de guarda, vigilância e custódia da pessoa ou coisa
  - Aplica-se a **Responsabilidade OBJETIVA (Teoria do Risco Administrativo)**
  - Casos típicos:
    - Morte ou lesão de detentos sob custódia em estabelecimentos prisionais (Tema 592 STF)
    - Alunos feridos no interior de escolas públicas em horário de aula
    - Pacientes internados em hospitais públicos ou conveniados do SUS

---

## 🔗 Eixo 4: Nexo de Causalidade, Causas Excludentes e Atenuantes
### 1. Teoria do Nexo Adotada no Brasil
- **Teoria do Dano Direto e Imediato (Interrupção do Nexo Causal)**:
  - O Estado só responde pelos danos que foram consequência direta e imediata de sua conduta (art. 403 do Código Civil)

### 2. Causas Excludentes da Responsabilidade (Rompimento Total do Nexo)
- **Culpa Exclusiva da Vítima**: A atuação negligente ou imprudente da própria vítima é a causa única e determinante do dano
- **Fato Exclusivo de Terceiro**: Evento danoso praticado por terceiro sem qualquer concurso de falha do serviço estatal
- **Caso Fortuito / Força Maior**: Fatos imprevisíveis e irresistíveis da natureza ou da autoridade

### 3. Causas Atenuantes (Culpa Concorrente)
- Quando vítima e Estado contribuem conjuntamente para a produção do resultado danoso
- Não exclui a obrigação estatal: enseja a **redução proporcional** do montante indenizatório

---

## 🔄 Eixo 5: A Teoria da Dupla Garantia e a Ação Regressiva (Tema 940 STF)
### 1. A Teoria da Dupla Garantia Constitucional
- O art. 37, §6º institui uma dupla salvaguarda no Estado de Direito:
  - 1. *Garantia ao Administrado*: Ação indenizatória movida diretamente contra a pessoa jurídica solvente
  - 2. *Garantia ao Agente Público*: Não ser acionado judicialmente em nome próprio pelo administrado lesado
- **Regra Jurisprudencial Absoluta**: Ação proposta **EXCLUSIVAMENTE em face da Pessoa Jurídica**!
- É expressamente VEDADO:
  - ❌ Ajuizar ação diretamente contra o funcionário causador do dano
  - ❌ Litisconsórcio passivo facultativo entre o Estado e o funcionário

### 2. Ação Regressiva do Estado contra o Servidor
- Movida após o trânsito em julgado da condenação indenizatória contra o Estado
- Requisito cumulativo obrigatório: Demonstração de **DOLO ou CULPA** do agente (Responsabilidade Subjetiva)
- Obrigação de reparar transmite-se aos herdeiros até o limite do patrimônio transferido na herança (CF art. 5º, XLV)

### 3. Prazos Prescricionais
- **Particular contra o Estado**: Prazo quinquenal (5 anos - Decreto 20.910/1932)
- **Estado contra o Agente (Ilícito Civil Comum)**: Prazo quinquenal de 5 anos (Tema 666 STF)
- **Ressarcimento por Improbidade Dolosa**: **IMPRESCRITÍVEL** (Tema 897 STF / CF art. 37, §5º)

---

## ⚖️ Eixo 6: Responsabilidade por Atos Legislativos e Jurisdicionais
### 1. Atos Legislativos
- **Regra Geral**: Irresponsabilidade pelos atos normativos gerais e abstratos
- **Exceções Indenizáveis**:
  - Leis declaradas inconstitucionais pelo STF
  - Leis de efeitos concretos (atingem destinatários certos e causam dano individualizado)
  - Omissão legislativa inconstitucional com mora deliberada do Parlamento

### 2. Atos Jurisdicionais
- **Regra Geral**: Irresponsabilidade pela atividade jurisdicional típica
- **Exceções Constitucionais Indenizáveis**:
  - *Erro Judiciário Penal*: Condenado por erro judicial ou preso além do tempo sentenciado (CF art. 5º, LXXV)
  - *Dolo ou Fraude do Magistrado*: Juiz agindo com dolo, fraude ou recusa injustificada de providência (art. 143 CPC)

---

## 🎯 Eixo 7: Arsenal de Jurisprudência Vinculante e Temas Paradigmáticos
### 1. Teses de Repercussão Geral do STF
- **Tema 592 STF**: No suicídio de preso, o Estado só responde se demonstrada a inobservância do dever específico de proteção
- **Tema 366 STF**: Responde objetivamente pelos danos decorrentes de disparos de arma de fogo em operações policiais ("bala perdida")
- **Tema 940 STF**: Ação indenizatória exclusivamente contra a Fazenda Pública, sem litisconsórcio passivo com o servidor

### 2. Súmulas Estratégicas do STJ
- **Súmula 647 STJ**: A pretensão de indenização decorrente de perseguição política durante o regime militar é **IMPRESCRITÍVEL**
- **Súmula 387 STJ**: É lícita a cumulação de indenização por dano estético e dano moral decorrentes do mesmo fato lesivo

---

## 🚨 Eixo 8: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Denunciação da Lide pelo Estado
- 🚨 **Pegadinha Clássica**: Dizer que o Estado é obrigado a denunciar a lide ao servidor para não perder o regresso.
- ✅ **Regra**: O STF e STJ pacificaram que a denunciação da lide pelo Estado é facultativa ou até vedada para não tumultuar o processo com a discussão de culpa!

### 2. Fuga de Preso e Danos a Terceiros
- 🚨 **Pegadinha Clássica**: Responsabilizar o Estado por crime praticado por foragido meses após a fuga.
- ✅ **Regra**: O Estado só responde se o crime for cometido durante a fuga imediata; inexistência de nexo causal em crimes cometidos meses após a evasão!
  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
