# 🛡️ Responsabilidade Civil do Estado (Aula 09)

## ⏳ 1. Evolução Histórica & Teorias Doutrinárias
### 👑 1.1 Teoria da Irresponsabilidade (*The King Can Do No Wrong*)
- Estado absolutista feudal: O soberano não erra e não responde civilmente perante os súditos
- Superada no Direito Ocidental desde o caso *Blanco* (França, 1873)
### ⚖️ 1.2 Teorias Civilistas (Subjetivas)
- **Culpa Comum**: Exigia prova de culpa individual do agente público (ônus da vítima inviabilizava a reparação)
- Distinção obsoleta entre *atos de império* (irresponsáveis) e *atos de gestão* (responsabilidade civilista)
### 🏛️ 1.3 Teorias Publicistas
- **Culpa do Serviço / Falta do Serviço (*Faute du Service*)**:
  - Responsabilidade subjetiva anônima (não precisa identificar o agente específico)
  - Configura-se quando o serviço: *Não funcionou*, *Funcionou atrasado* ou *Funcionou mal/defeituoso*
  - Regra geral aplicada aos atos **OMISSIVOS GENÉRICOS** da Administração
- **Teoria do Risco Administrativo**:
  - Responsabilidade **OBJETIVA** (independe de dolo ou culpa do agente público)
  - Elementos: Conduta administrativa + Dano material/moral + Nexo causal
  - **Admite Excludentes**: Culpa exclusiva da vítima, caso fortuito/força maior e fato exclusivo de terceiro
  - **REGRA GERAL ADOTADA NO BRASIL** (CF, art. 37, §6º)
- **Teoria do Risco Integral**:
  - Modalidade extremada de responsabilidade objetiva que **NÃO admite excludentes nem atenuantes**
  - Casos taxativos no Brasil:
    - ☢️ Danos nucleares (art. 21, XXIII, 'd', CF)
    - 💥 Atos terroristas ou de guerra contra aeronaves de matrícula brasileira (Lei 10.744/03)
    - 🌳 Danos ambientais (STJ Tema 225 / Resp 1.374.284)

## 📜 2. O Artigo 37, §6º da CF/88 & Matriz Constitucional
### 🏛️ 2.1 Pessoas Sujeitas à Responsabilidade Objetiva
- **Pessoas Jurídicas de Direito Público**: União, Estados, DF, Municípios, Autarquias e Fundações Públicas de Direito Público
- **Pessoas Jurídicas de Direito Privado Prestadoras de Serviços Públicos**:
  - Empresas Públicas e Sociedades de Economia Mista (quando prestam serviço público)
  - Concessionárias, permissionárias e delegatárias de serviços públicos
  - *Atenção*: Empresas estatais exploradoras de atividade econômica respondem pelo Direito Privado Comum!
### 👥 2.2 Terceiros Usuários e Terceiros NÃO-Usuários (Tema 130 STF)
- A responsabilidade civil das concessionárias e permissionárias é **OBJETIVA perante TODA a coletividade**
- Aplica-se tanto aos usuários do serviço quanto a terceiros NÃO-usuários atingidos pelo evento lesivo

## ⚡ 3. Conduta Comissiva (Ação) vs. Conduta Omissiva (Omissão)
### 🏃 3.1 Conduta Comissiva (Ação Positiva do Estado)
- Aplicação pura da **Teoria do Risco Administrativo (Responsabilidade Objetiva)**
- Basta demonstrar o fato administrativo, o dano e o nexo de causalidade direto
### 🛑 3.2 Conduta Omissiva (Inação Estatal)
- **Omissão Genérica**:
  - O Estado descumpre um dever genérico de segurança, fiscalização ou asseio
  - Aplica-se a **Teoria da Culpa do Serviço (Responsabilidade SUBJETIVA)**
  - Vítima deve provar a falha do serviço (*faute du service*), a previsibilidade e a evitabilidade do dano
- **Omissão Específica (Posição de Garante / Custódia Estatal)**:
  - O Estado tem o dever legal e individualizado de custódia e proteção imediata
  - Aplica-se a **Responsabilidade OBJETIVA (Teoria do Risco Administrativo)**
  - Casos típicos:
    - Morte ou agressão de detentos sob custódia em estabelecimentos prisionais (Tema 592 STF)
    - Alunos feridos dentro de escolas públicas durante o horário escolar
    - Pacientes internados em hospitais públicos ou conveniados do SUS

## 🔗 4. Nexo Causal & Causas Excludentes/Atenuantes
### 🎯 4.1 Teoria do Nexo Adotada no Brasil
- **Teoria do Dano Direto e Imediato (Interrupção do Nexo)**:
  - Adotada pelo STF (art. 403 do CC)
  - O Estado só responde se a sua conduta foi a causa necessária, direta e determinante do prejuízo
### 🛡️ 4.2 Causas Excludentes do Nexo (Rompimento Total)
- **Culpa Exclusiva da Vítima**: A própria vítima provoca o evento danoso por sua conduta negligente/imprudente
- **Fato Exclusivo de Terceiro**: Ato lesivo imprevisível e inevitável praticado por outrem sem falha do serviço
- **Caso Fortuito / Força Maior**: Eventos extraordinários da natureza ou atos inevitáveis da autoridade
### ⚖️ 4.3 Causas Atenuantes (Concorrentes)
- **Culpa Concorrente**: Vítima e Estado contribuem concomitantemente para o resultado danoso
- Não exclui a responsabilidade estatal: apenas **reduz proporcionalmente** a indenização devida

## 🔄 5. Teoria da Dupla Garantia & Ação Regressiva
### 🛡️ 5.1 A Teoria da Dupla Garantia (Tema 940 STF - RE 1.027.633)
- O art. 37, §6º institui uma **dupla garantia constitucional**:
  - 1. *Garantia ao Administrado lesado*: Ação indenizatória movida diretamente contra o Estado (pessoa jurídica solvente)
  - 2. *Garantia ao Servidor Público*: Não ser acionado judicialmente diretamente pelo particular prejudicado
- **Regra Absoluta**: Ação indenizatória deve ser proposta **EXCLUSIVAMENTE em face da Pessoa Jurídica**!
- É VEDADO:
  - ❌ Ajuizar ação diretamente contra o agente público causador do dano
  - ❌ Litisconsórcio passivo entre o Estado e o agente público
### 🔙 5.2 Ação Regressiva do Estado contra o Agente
- Competência do Estado após o trânsito em julgado da condenação indenizatória
- Requisitos:
  - **DOLO ou CULPA** do servidor (Responsabilidade SUBJETIVA do agente)
  - É vedada a regressiva objetiva contra o funcionário público!
  - Sucessores do servidor respondem até o limite da herança transferida (art. 5º, XLV, CF)
### ⏱️ 5.3 Prazos Prescricionais
- **Particular contra o Estado**: Prazo quinquenal (5 anos - Decreto 20.910/32)
- **Estado contra o Agente (Regresso por Ilícito Civil Comum)**: 5 anos (Tema 666 STF)
- **Ressarcimento por Improbidade Dolosa**: **IMPRESCRITÍVEL** (Tema 897 STF / CF art. 37 §5º)

## ⚖️ 6. Responsabilidade por Atos Legislativos & Judiciais
### 🏛️ 6.1 Responsabilidade por Atos Legislativos
- **Regra Geral**: Não gera indenização (atos soberanos, gerais e abstratos)
- **Exceções Admitidas**:
  - 1. *Leis Inconstitucionais*: Declaradas inconstitucionais pelo STF em controle concentrado ou difuso
  - 2. *Leis de Efeitos Concretos*: Leis que atingem diretamente destinatários certos como verdadeiros atos administrativos
  - 3. *Omissão Legislativa Inconstitucional*: Mora injustificada do Poder Legislativo em regulamentar direito fundamental
### 👨‍⚖️ 6.2 Responsabilidade por Atos Jurisdicionais
- **Regra Geral**: Irresponsabilidade pelos atos normais de prestação da justiça
- **Exceções Constitucionais e Legais (Indenizáveis pelo Estado)**:
  - 1. *Erro Judiciário Penal*: Condenado por erro ou preso além do tempo fixado na sentença (CF art. 5º, LXXV)
  - 2. *Dolo ou Fraude do Magistrado*: Juiz agindo com dolo, fraude ou recusa injustificada de despacho (art. 143 CPC)
  - O Estado indeniza a vítima e exerce direito de regresso contra o magistrado culpado

## 🎯 7. Arsenal Jurisprudencial de Alto Rendimento (STF / STJ)
### 📌 7.1 Teses de Repercussão Geral do STF
- **Tema 592 STF**: Em caso de suicídio de preso, o Estado só responde se demonstrada a omissão quanto ao dever específico de vigilância
- **Tema 366 STF**: O Estado responde objetivamente pelos danos decorrentes de disparos de arma de fogo em operações de segurança pública, mesmo com perícia inconclusiva quanto à origem do projétil ("bala perdida")
- **Tema 940 STF**: Ação indenizatória exclusivamente contra o Estado; vedado acionar o agente público na mesma lide
- **Tema 130 STF**: Concessionárias respondem objetivamente tanto perante usuários quanto perante terceiros não-usuários
### 📌 7.2 Súmulas Estratégicas do STJ
- **Súmula 647 STJ**: A pretensão de reparação decorrente de condutas de perseguição política durante o regime militar é **IMPRESCRITÍVEL**
- **Súmula 387 STJ**: É lícita a cumulação das indenizações de dano estético e dano moral decorrentes do mesmo fato
- **Súmula 130 STJ**: A empresa responde perante o cliente pela reparação de dano ou furto de veículo ocorridos em seu estacionamento

## 🚨 8. Radar de Pegadinhas Frequentes (Cebraspe / FGV)
### ⚠️ 8.1 Denunciação da Lide ao Servidor
- 🚨 **Pegadinha Clássica**: Afirmar que o Estado é obrigado a denunciar a lide ao agente público para assegurar o regresso.
- ✅ **Regra**: O STF e STJ entendem que a denunciação da lide pelo Estado é facultativa ou até vedada para não retardar o processo com a discussão de dolo/culpa.
### ⚠️ 8.2 Risco Administrativo vs. Risco Integral
- 🚨 **Pegadinha Clássica**: Dizer que danos ambientais ou nucleares admitem excludente por culpa da vítima.
- ✅ **Regra**: Danos nucleares e ambientais adotam a Teoria do Risco Integral (NÃO admitem excludente de caso fortuito ou terceiro!).
### ⚠️ 8.3 Fuga de Preso e Crimes Posteriores
- 🚨 **Pegadinha Clássica**: Responsabilizar o Estado por assalto cometido por preso fugitivo meses após a evasão.
- ✅ **Regra**: Inexiste nexo de causalidade direto e imediato. O Estado só responde se o crime ocorrer em fuga imediata e contínua!

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
