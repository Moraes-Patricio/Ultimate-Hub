# 📚 Direito Administrativo: Aula 08 - Controle da Administração Pública

## ⚖️ Eixo 1: Teoria Geral e Classificação Ontológica do Controle
### 1. Visão Geral e Fundamento Ontológico
- **Conceito Dogmático**:
  - Conjunto de mecanismos jurídicos e institucionais de fiscalização, orientação, correção e revisão da atuação estatal
  - Assegura a conformidade estrita com a Constituição, leis e princípios da moralidade e eficiência
- **Analogia Didática (Sistema de Arbitragem e VAR)**:
  - *Autotutela (Controle Interno)*: Árbitro de campo corrige sua própria marcação equivocada antes de reiniciar o jogo
  - *Controle Legislativo (Congresso + TCU)*: Comissão organizadora que fiscaliza contas e anula atos que transgridem o regulamento
  - *Controle Judicial*: Tribunal desportivo ou Justiça Comum que anula decisão manifestamente ilegal provocada pela parte lesada

### 2. Matriz Classificatória Quádrupla do Controle
- **1. Quanto à Origem do Órgão Controlador**:
  - **Controle Interno**: Exercido pelo próprio Poder sobre seus próprios órgãos (ex: CGU, chefia anulando ato de subordinado)
  - **Controle Externo**: Exercido por um Poder sobre a atividade funcional de outro Poder (ex: Congresso com auxílio do TCU fiscalizando Executivo; Judiciário anulando ato ilegal)
  - **Controle Social / Popular**: Exercido diretamente pelos cidadãos e sociedade (Ação Popular, denúncia com base no art. 74, §2º da CF)
- **2. Quanto ao Momento de Exercício**:
  - **Prévio (Preventivo / A priori)**: Realizado antes da prática, conclusão ou eficácia do ato (ex: sabatina de autoridades pelo Senado - art. 52, III; autorização legislativa para empréstimo)
  - **Concomitante (Pari passu)**: Realizado contemporaneamente à realização da atividade (ex: auditoria em tempo real de licitações pelo TCU; fiscalização de obra pública em curso)
  - **Posterior (Corretivo / A posteriori)**: Realizado após a conclusão do ato para convalidar, anular ou revogar (ex: homologação de concurso público, julgamento anual de contas)
- **3. Quanto ao Aspecto Controlado**:
  - **Controle de Legalidade (Juridicidade)**: Conformidade do ato com o bloco de legalidade (leis, constituição, proporcionalidade, moralidade). *Realizável por TODOS os Poderes*!
  - **Controle de Mérito (Oportunidade e Conveniência)**: Avaliação da justiça, conveniência e oportunidade da escolha discricionária. *PRIVATIVO DA ADMINISTRAÇÃO PÚBLICA* (vedado ao Judiciário invadir)!
- **4. Quanto à Amplitude Institucional**:
  - **Controle Hierárquico (Subordinação)**: Órgão superior sobre inferior dentro da mesma pessoa jurídica. Pleno, irrestrito, de ofício e independe de previsão legal expressa.
  - **Controle Finalístico (Tutela / Vinculação)**: Administração Direta sobre entidades da Administração Indireta. *EXIGE EXPRESSA PREVISÃO EM LEI*; inexistência de subordinação hierárquica!

---

## 🔄 Eixo 2: Controle Administrativo e o Regime da Autotutela
### 1. O Princípio da Autotutela e Súmulas do STF
- **Súmula 346 do STF**: A Administração Pública pode declarar a nulidade dos seus próprios atos
- **Súmula 473 do STF**:
  - A Administração pode **anular** seus próprios atos quando eivados de vícios que os tornam ilegais (porque deles não se originam direitos)
  - Pode **revogá-los** por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos e ressalvada a apreciação judicial

### 2. Oposição Binária: Anulação vs. Revogação
- **Anulação de Ato Administrativo**:
  - *Fundamento*: Ilegalidade ou ilegitimidade originária
  - *Atos Objeto*: Atos vinculados ou discricionários com vício insanável
  - *Quem Pratica*: A **Administração Pública** (autotutela) OU o **Poder Judiciário** (mediante provocação)
  - *Efeitos*: Retroativos (*Ex Tunc* - fulmina o ato desde a origem)
  - *Prazo Decadencial*: **5 (cinco) anos** para anular atos favoráveis ao destinatário de boa-fé (art. 54 da Lei 9.784/99)
  - *Exceção à Decadência*: Se comprovada **má-fé**, a anulação pode ocorrer a qualquer tempo!
- **Revogação de Ato Administrativo**:
  - *Fundamento*: Inconveniência ou inoportunidade superveniente (mérito administrativo)
  - *Atos Objeto*: Apenas atos discricionários válidos e vigentes
  - *Quem Pratica*: **EXCLUSIVAMENTE A ADMINISTRAÇÃO PÚBLICA** que editou o ato (Judiciário JAMAIS revoga ato do Executivo!)
  - *Efeitos*: Prospectivos (*Ex Nunc* - respeita efeitos pretéritos e direito adquirido)
  - *Atos Irrevogáveis*: Atos vinculados, consumados, direitos adquiridos e atos integrantes de procedimento

### 3. Instrumentos de Provocação Administrativa
- **Direito de Petição**: CF art. 5º, XXXIV, 'a' - defesa de direitos ou contra ilegalidade, independente de taxa
- **Recursos Administrativos**: Dirigidos à autoridade superior hierárquica
  - *Súmula Vinculante 21*: É inconstitucional a exigência de depósito ou arrolamento prévio de dinheiro para recurso administrativo

## 🏛️ Eixo 3: Controle Legislativo Político e Parlamentar Direto
### 1. Competências Exclusivas do Congresso Nacional (CF art. 49)
- **Inciso V**: Sustar os atos normativos do Poder Executivo que exorbitem do poder regulamentar ou dos limites de delegação legislativa
- **Inciso IX**: Julgar anualmente as contas prestadas pelo Presidente da República e apreciar relatórios de planos de governo
- **Inciso X**: Fiscalizar e controlar diretamente os atos do Poder Executivo, incluídos os da Administração Indireta

### 2. Comissões Parlamentares de Inquérito (CPIs - CF art. 58 §3º)
- **Poderes Próprios de Autoridades Judiciais (Pode Praticar)**:
  - Quebra de sigilo bancário, fiscal e telefônico (registros de chamadas)
  - Convocação e oitiva de investigados e testemunhas (sob condução coercitiva)
  - Requisição de perícias, documentos e informações a órgãos públicos
- **Reserva Constitucional de Jurisdição (NÃO Pode Praticar)**:
  - ❌ Decretar prisão preventiva ou temporária (salvo flagrante delito)
  - ❌ Interceptação telefônica (gravação e escuta de conversas)
  - ❌ Busca e apreensão domiciliar (cláusula de inviolabilidade de domicílio)
  - ❌ Decretar indisponibilidade de bens ou arresto cautelar

### 3. Aprovação Prévia de Autoridades pelo Senado Federal (CF art. 52, III)
- Sabatina e aprovação de: Ministros do TCU, Magistrados (STF e Tribunais Superiores), Procurador-Geral da República, Diretores do Banco Central e Diretores de Agências Reguladoras

---

## 💰 Eixo 4: Controle Externo Financeiro e o TCU (Arts. 70 a 75)
### 1. Abrangência e Fiscalização Contábil, Financeira e Orçamentária
- Aspectos fiscalizados: Legalidade, Legitimidade, Economicidade, Aplicação de subvenções e Renúncia de receitas
- Jurisdição sobre qualquer pessoa física ou jurídica que utilize, guarde ou gerencie bens públicos

### 2. Composição e Natureza do TCU (CF art. 73)
- Órgão técnico autônomo, não subordinado ao Poder Legislativo
- 9 Ministros: 3 nomeados pelo Presidente da República (1 auditor, 1 MP junto ao TCU, 1 livre) com aval do Senado; 6 pelo Congresso Nacional

### 3. Competências Constitucionais Centrais do TCU (Art. 71)
- **Parecer Prévio**: Sobre as contas anuais do Presidente da República (prazo de 60 dias) - Julgamento é do Congresso!
- **Julgamento de Contas**: Dos administradores e demais responsáveis por recursos públicos (julgamento técnico definitivo)
- **Apreciação da Legalidade para Registro**: Admissão de pessoal e concessão de aposentadorias/pensões (atos complexos)

### 4. A Regra de Ouro: Sustação de Atos vs. Sustação de Contratos
- **Ato Administrativo Ilegal**:
  - TCU assina prazo para correção; não atendido: **O próprio TCU susta diretamente a execução do ato** e avisa o Congresso!
- **Contrato Administrativo Ilegal**:
  - TCU assina prazo para correção; não atendido: **A sustação do contrato é competência EXCLUSIVA DO CONGRESSO NACIONAL**!
  - Se o Congresso não se manifestar em 90 dias: O Poder Executivo decide; se omisso, o TCU pode então decidir a sustação!

### 5. Eficácia Executiva das Decisões (CF art. 71 §3º)
- Decisões do TCU que imputam débito ou multa **constituem TÍTULO EXECUTIVO EXTRAJUDICIAL**
- A execução judicial é proposta pela Fazenda Pública credora (União/AGU) e NÃO pelo TCU!

---

## ⚖️ Eixo 5: Controle Judicial da Administração Pública e o Limite do Mérito
### 1. O Princípio da Inafastabilidade da Jurisdição (CF art. 5º, XXXV)
- A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito (Sistema de Jurisdição Una)
- **Exceções Relativas (Exigência de Prévio Requerimento Administrativo)**:
  - *Justiça Desportiva*: Aguardar prazo de até 60 dias (art. 217 §1º CF)
  - *Habeas Data*: Prova de recusa administrativa da autoridade (Súmula 2 STJ)
  - *Benefício Previdenciário*: Prévio requerimento ao INSS (Tema 350 STF)
  - *Reclamação Constitucional*: Esgotamento das instâncias administrativas contra ato que descumpre Súmula Vinculante

### 2. O Limite Insuperável do Controle Judicial
- **O que o Judiciário Controla**: Legalidade, Juridicidade, Moralidade, Razoabilidade, Proporcionalidade e Desvio de Finalidade
- **O que é Vedado ao Judiciário**: Substituir a conveniência e oportunidade do administrador (Incursão no mérito)
- **Teoria dos Motivos Determinantes**: A validade do ato vincula-se aos motivos invocados pelo administrador; motivos falsos geram nulidade!

---

## 📜 Eixo 6: Instrumentos Processuais Constitucionais de Controle
### 1. Mandado de Segurança (Lei 12.016/09 / CF art. 5º, LXIX)
- Protege direito líquido e certo, não amparado por HC ou HD, contra ilegalidade ou abuso de autoridade pública
- Exige prova documental pré-constituída (sem dilação probatória)
- Prazo decadencial improrrogável: **120 dias** a contar da ciência do ato

### 2. Ação Popular (Lei 4.717/65 / CF art. 5º, LXXIII)
- Legitimidade ativa: **EXCLUSIVAMENTE O CIDADÃO** (eleitor em dia com direitos políticos)
- Finalidade: Anular ato lesivo ao patrimônio público, moralidade, meio ambiente e patrimônio histórico/cultural
- Isenção de custas judiciais e sucumbência, salvo comprovada má-fé

### 3. Ação Civil Pública (Lei 7.347/85)
- Proteção do patrimônio público e social, meio ambiente e outros interesses difusos e coletivos
- Legitimados: Ministério Público, Defensoria Pública, Entes Federativos e Associações civis

---

## ⚖️ Eixo 7: Arsenal de Jurisprudência Vinculante e Temas Paradigmáticos
### 1. Súmulas Vinculantes do STF
- **SV 3**: Assegura contraditório e ampla defesa no TCU, EXCETO na apreciação inicial para concessão de aposentadoria/pensão
- **SV 21**: Veda exigência de depósito prévio de dinheiro para recurso administrativo

### 2. Temas de Repercussão Geral do STF
- **Tema 899 STF**: É prescritível a pretensão de ressarcimento ao erário fundada em decisão de Tribunal de Contas (5 anos)
- **Tema 445 STF**: TCU tem prazo de 5 anos para registrar aposentadoria inicial; decorrido o prazo, há registro tácito e exige-se contraditório
- **Julgamento de Contas de Prefeito (RE 848.826)**: A Câmara Municipal tem competência exclusiva para julgar todas as contas do prefeito

---

## 🚨 Eixo 8: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Sustação de Contratos Administrativos
- 🚨 **Pegadinha Clássica**: Afirmar que o TCU pode sustar diretamente um contrato administrativo irregular.
- ✅ **Regra**: O TCU susta atos diretamente, mas contrato administrativo é de competência EXCLUSIVA do Congresso Nacional!

### 2. Julgamento das Contas do Presidente da República
- 🚨 **Pegadinha Clássica**: Dizer que o TCU julga as contas prestadas pelo Presidente.
- ✅ **Regra**: Sobre contas do Presidente o TCU emite parecer prévio; quem julga privativamente é o Congresso Nacional!

### 3. Titularidade da Execução de Título do TCU
- 🚨 **Pegadinha Clássica**: Afirmar que o Ministério Público junto ao TCU executa judicialmente as multas aplicadas.
- ✅ **Regra**: A execução das multas do TCU compete à AGU perante a Justiça Federal em favor da União!
  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
