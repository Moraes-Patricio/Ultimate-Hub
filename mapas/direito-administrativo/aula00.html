<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 00 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA E ALTO CONTRASTE (Adequação total ao fundo escuro) */
    .markmap-foreign {
      color: #f8fafc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
    }
    .markmap-foreign div {
      color: #f8fafc !important;
    }
    .markmap-foreign h1 {
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 16px !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.01em;
    }
    .markmap-foreign h2 {
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 14.5px !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    }
    .markmap-foreign h3 {
      color: #a5b4fc !important;
      font-weight: 600 !important;
      font-size: 13.5px !important;
    }
    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }
    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal;
    }
    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 00 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 00 - Antigravity)
## 🏛️ Eixo 1: Fundamentos Ontológicos
### 1. Bipé do Regime Jurídico-Administrativo (Celso Antônio Bandeira de Mello)
- **Supremacia do Interesse Público sobre o Particular**
  - Vertente de **Prerrogativas** e privilégios estatais
  - Presunção de Legitimidade e Veracidade
  - Autoexecutoriedade dos atos administrativos
  - Posição de verticalidade (Estado > Particular)
- **Indisponibilidade do Interesse Público pela Administração**
  - Vertente de **Sujeições**, limitações e deveres
  - O administrador é mero gestor do bem público (não é proprietário)
  - Veda renúncia arbitrária de direitos e receitas
  - Exige concurso público, licitação, motivação e prestação de contas

### 2. Sentidos de Administração Pública
- **Sentido Subjetivo / Formal / Orgânico**
  - **Quem executa**: Conjunto de órgãos, agentes e pessoas jurídicas estatais
  - Critério adotado pelo Brasil: Só integra a Adm. Pública quem a lei formal define
- **Sentido Objetivo / Material / Funcional**
  - **O que é executado**: A própria atividade administrativa (4 pilares)
  - *Serviço Público* (prestação direta aos cidadãos)
  - *Polícia Administrativa* (restrição de liberdades e direitos individuais)
  - *Fomento* (incentivo à iniciativa privada de interesse social)
  - *Intervenção* (atuação direta ou regulatória na ordem econômica)

### 3. Interesse Público Primário vs. Secundário
- **Primário (Genuíno)**
  - Interesse direto da **coletividade** (justiça, saúde, segurança, bem-estar)
  - Prevalece SEMPRE sobre interesses particulares
- **Secundário (Patrimonial)**
  - Interesse do Estado como **pessoa jurídica de direito patrimonial** (arrecadar mais, gastar menos)
  - Só é legítimo quando coincide estritamente com o interesse primário!
  - Vedado sobrepor o interesse secundário aos direitos fundamentais

---

## 📜 Eixo 2: Princípios Constitucionais Expressos (CF, Art. 37 - LIMPE)
### 1. Legalidade
- **Particular (Art. 5º, II)**: Autonomia da vontade (faz tudo que a lei não proíbe)
- **Administração Pública**: Vinculação positiva estrita (só pode agir onde, quando e como a lei autoriza)
- *Princípio da Juridicidade*: Submissão à lei formal + a todo o bloco de constitucionalidade e princípios

### 2. Impessoalidade (Quádrupla Dimensão)
- **Finalidade Pública**: O ato deve visar o interesse geral; vedado favorecer amigos ou perseguir desafetos
- **Igualdade / Isonomia**: Tratamento uniforme e sem privilégios (base dos concursos e licitações)
- **Vedação à Promoção Pessoal (Art. 37, §1º)**: Proibido constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades em obras e publicidades públicas
- **Teoria da Imputação Volitiva (Otto Mayer)**: Os atos praticados pelos agentes são imputados ao órgão/Estado, e não à pessoa física do servidor

### 3. Moralidade
- **Probidade, Honestidade, Lealdade e Boa-Fé Objetiva**
- **Autonomia da Moralidade**: O ato pode ser formalmente legal, mas NULO por violar a moralidade administrativa
- **Súmula Vinculante 13 (Nepotismo)**:
  - Proíbe nomeação de cônjuge, companheiro ou parente até 3º grau para cargos comissionados/funções de confiança
  - Abrange a Administração Direta e Indireta de todos os Poderes da União, Estados e Municípios
  - Veda o *Nepotismo Cruzado* (designações recíprocas entre órgãos)
  - *Exceção Canônica*: Cargos de natureza política (Ministros de Estado e Secretários), salvo comprovada inaptidão técnica ou dolo manifesto

### 4. Publicidade
- **Regra Geral de Eficácia**: A publicação oficial é requisito para que o ato produza **efeitos externos** (não é requisito de validade intrínseca!)
- **Transparência Ativa** (publicação de ofício na internet) vs. **Passiva** (resposta sob demanda — LAI)
- **Exceções Estritas de Sigilo**:
  - Segurança da Sociedade e do Estado (defesa nacional, relações internacionais)
  - Defesa da Intimidade, Vida Privada, Honra e Imagem (Art. 5º, X da CF)

### 5. Eficiência (EC nº 19/1998)
- **Reforma Gerencial**: Superação do modelo burocrático rígido
- **Pilares**: Produtividade, economicidade, rendimento funcional e celeridade
- **Instrumentos Práticos**:
  - Avaliação Periódica de Desempenho (possibilidade de perda de cargo do servidor estável — Art. 41, §1º, III)
  - Contratos de Gestão com fixação de metas e ampliação de autonomia

---

## ⚖️ Eixo 3: Princípios Constitucionais Implícitos / Reconhecidos
### 1. Autotutela (Poder-Dever de Correção)
- **Súmula 346/STF**: A Administração pode declarar a nulidade de seus próprios atos
- **Súmula 473/STF**:
  - **Anulação**: Incide sobre atos *ilegais* • Efeitos *ex tunc* (retroativos) • Vinculada
  - **Revogação**: Incide sobre atos *legais*, mas *inconvenientes/inoportunos* • Efeitos *ex nunc* (prospectivos) • Juízo de mérito discricionário
- **Prazo Decadencial de 5 Anos (Art. 54 da Lei 9.784/99)**:
  - Salvo comprovada má-fé, decai em 5 anos o direito da Administração de anular atos que gerem efeitos favoráveis aos destinatários

### 2. Razoabilidade e Proporcionalidade
- **Razoabilidade**: Bom senso, congruência lógica entre motivos e decisão, proibição de excessos
- **Proporcionalidade (Tríplice Teste Alemão)**:
  - *Adequação*: O meio escolhido é apto a alcançar o fim visado?
  - *Necessidade (Exigibilidade)*: É o meio menos gravoso disponível?
  - *Proporcionalidade em Sentido Estrito*: As vantagens superam os encargos impostos?

### 3. Continuidade dos Serviços Públicos
- Os serviços públicos essenciais não podem sofrer interrupção arbitrária
- **Corte por Inadimplemento do Usuário (Lei 8.987/95, Art. 6º, §3º)**:
  - É lícito após **aviso prévio formal**
  - Não pode ser feito em sextas-feiras, vésperas de feriados ou fins de semana
  - Inaplicável a unidades de saúde essenciais (UTIs, hospitais públicos)

### 4. Segurança Jurídica e Proteção da Confiança Legítima
- **Vertente Objetiva**: Estabilidade das relações jurídicas, irretroatividade das leis e proteção do direito adquirido
- **Vertente Subjetiva (Confiança Legítima)**: Proteção do cidadão de boa-fé diante de atos contraditórios do Estado
- **Art. 2º, Parágrafo Único, XIII da Lei 9.784/99**:
  - Proibição absoluta de aplicação retroativa de nova interpretação jurídica pela Administração!

### 5. Motivação e Teoria dos Motivos Determinantes
- **Dever de Motivar**: Explicitação formal dos pressupostos de fato e fundamentos de direito
- **Teoria dos Motivos Determinantes**:
  - A validade do ato fica indissociavelmente vinculada à veracidade dos motivos declarados
  - Se o motivo declarado for falso ou inexistente, o ato é **NULO**, mesmo que se trate de ato originalmente discricionário (ex: exoneração de cargo em comissão)

---

## 📑 Eixo 4: Princípios Infraconstitucionais Expressos
### 1. Nova Lei de Licitações (Lei nº 14.133/2021, Art. 5º)
- **22 Princípios Expressos**: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência, Interesse Público, Probidade, Igualdade, Planejamento, Transparência, Eficácia, Segregação de Funções, Motivação, Vinculação ao Edital, Julgamento Objetivo, Segurança Jurídica, Razoabilidade, Competitividade, Proporcionalidade, Celeridade, Economicidade e Desenvolvimento Nacional Sustentável
- **Segregação de Funções**: Veda que o mesmo agente exerça fases críticas sucessivas (planejar edital, licitar, fiscalizar e atestar pagamento)
- **Planejamento Obrigatório**: Alinhamento das compras com o Plano de Contratações Anual (PCA)

### 2. Lei do Processo Administrativo Federal (Lei nº 9.784/1999, Art. 2º)
- **11 Princípios Expressos**: Legalidade, Finalidade, Motivação, Razoabilidade, Proporcionalidade, Moralidade, Ampla Defesa, Contraditório, Segurança Jurídica, Interesse Público e Eficiência
- *Pegadinha*: Ampla Defesa e Contraditório são **expressos** na Lei 9.784/99, mas **implícitos** no Art. 37, caput da CF!

---

## ⚖️ Eixo 5: Jurisprudência Vinculante e Temática
### 1. Súmulas Vinculantes do STF
- **SV nº 5**: A falta de defesa técnica por advogado no PAD não ofende a Constituição
- **SV nº 13**: Vedação do nepotismo até o 3º grau (não se aplica a cargos políticos, salvo desvio comprovado)
- **SV nº 21**: É inconstitucional exigir depósito ou arrolamento prévio de dinheiro/bens para recurso administrativo
- **SV nº 44**: Só por LEI FORMAL em sentido estrito pode-se exigir exame psicotécnico em concurso público

### 2. Súmulas Relevantes do STJ
- **Súmula 611/STJ**: O PAD pode ser instaurado com base em denúncia anônima motivada por prévia investigação
- **Súmula 633/STJ**: A Lei 9.784/99 aplica-se subsidiariamente aos Estados e Municípios sem lei própria

---

## 🎯 Eixo 6: Radar de Pegadinhas Cebraspe / FGV
### 1. Distinções Binárias Decisivas
- **Publicidade vs. Validade**: Publicidade gera EFICÁCIA (efeito externo); não interfere na validade intrínseca do ato
- **Revogação vs. Anulação**:
  - Judiciário **JAMAIS** revoga ato administrativo de outro Poder (revogação é privativa da Administração autora)
  - Judiciário apenas **ANULA** atos ilegais!
- **Supremacia vs. Indisponibilidade**:
  - Supremacia confere **Poderes e Prerrogativas**
  - Indisponibilidade impõe **Restrições, Deveres e Sujeições**
- **Moralidade vs. Legalidade**: Moralidade é autônoma; ato estritamente legal pode ser nulo por imoralidade
`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 550,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
