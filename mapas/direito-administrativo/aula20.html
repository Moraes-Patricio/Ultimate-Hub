<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 20 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA POR NÍVEL HIERÁRQUICO (Alto contraste definitivo) */
    .markmap-node text {
      fill: #f8fafc !important;
    }
    .markmap-foreign {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
      color: #f1f5f9 !important;
    }
    .markmap-foreign div,
    .markmap-foreign span,
    .markmap-foreign p {
      color: inherit;
    }
    
    /* Nível 0: Título Raiz */
    .markmap-node[data-depth="0"] .markmap-foreign div {
      font-size: 16px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8) !important;
    }

    /* Nível 1: Eixos Temáticos */
    .markmap-node[data-depth="1"] .markmap-foreign div {
      font-size: 14.5px !important;
      font-weight: 700 !important;
      color: #38bdf8 !important;
      white-space: nowrap !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7) !important;
    }

    /* Nível 2: Subtópicos */
    .markmap-node[data-depth="2"] .markmap-foreign div {
      font-size: 13.5px !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
    }

    /* Nível 3+: Bullets e Detalhes */
    .markmap-node[data-depth="3"] .markmap-foreign div,
    .markmap-node[data-depth="4"] .markmap-foreign div,
    .markmap-node[data-depth="5"] .markmap-foreign div {
      font-size: 12.5px !important;
      font-weight: 400 !important;
      color: #e2e8f0 !important;
      line-height: 1.55 !important;
    }

    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }

    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal !important;
    }

    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 20 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 20 - Antigravity)

## 🏛️ Eixo 1: O Regime Constitucional da Informação Pública na CF/88
### 1. Princípios Constitucionais Fundamentais
- **Princípio da Publicidade como Regra Geral (CF art. 5º, XXXIII e art. 37)**: Todos têm direito a receber dos órgãos públicos informações de seu interesse particular ou de interesse coletivo
- **O Sigilo como Exceção Rígida**: O sigilo somente é admitido em hipóteses constitucionais estritas, quando imprescindível à **segurança da sociedade e do Estado** ou para proteger a **intimidade e a vida privada**

### 2. Âmbito Subjetivo de Aplicação da LAI (Lei 12.527/2011, Art. 1º)
- **Obrigados Diretos**: União, Estados, Distrito Federal e Municípios (todos os Poderes Executivo, Legislativo e Judiciário, Cortes de Contas e Ministério Público)
- **Administração Indireta**: Autarquias, fundações públicas, empresas públicas e sociedades de economia mista
- **Entidades Privadas sem Fins Lucrativos**: Entidades que recebam recursos públicos mediante convênios, contratos de gestão ou termos de parceria (obrigadas a prestar contas da parcela pública recebida)

---

## 🌐 Eixo 2: Transparência Ativa vs. Transparência Passiva (Lei 12.527/2011)
### 1. Transparência Ativa (Art. 8º)
- Divulgação espontânea, proativa e periódica de informações públicas pela própria Administração, independentemente de qualquer requerimento prévio
- **Obrigatoriedade de Sítios Oficiais na Internet**:
  - Dados sobre estrutura organizacional, competências e endereços
  - Registros de repasses ou transferências de recursos financeiros
  - Execução orçamentária e financeira detalhada
  - Informações de licitações (editais, resultados, contratos)
  - Remuneração detalhada dos agentes públicos por cargo
  - *Exceção a Municípios Pequenos*: Municípios com até 10.000 habitantes são dispensados de manter site na internet, mantendo a obrigação de transparência passiva

### 2. Transparência Passiva (Art. 10)
- Disponibilização de informações específicas mediante **requerimento formal** formulado por qualquer interessado
- **Direito à Informação sem Motivação**: É expressamente **VEDADA a exigência de justificação ou motivo** para o pedido de acesso à informação pública (art. 10 §3º)!

---

## 🔒 Eixo 3: Classificação e Regimes de Sigilo: Informações Sigilosas vs. Pessoais
### 1. Graus de Sigilo e Prazos Máximos de Classificação (Art. 24)
- **1. Ultrassecreta**: Prazo máximo de **25 (vinte e cinco) anos** (prorrogável uma única vez por igual período)
- **2. Secreta**: Prazo máximo de **15 (quinze) anos**
- **3. Reservada**: Prazo máximo de **5 (cinco) anos**
- *Vedação Absoluta de Sigilo*: Informações necessárias à tutela judicial de direitos fundamentais ou que versem sobre **violações de direitos humanos praticadas por agentes públicos** NUNCA poderão ser objeto de restrição de acesso!

### 2. Tratamento das Informações Pessoais (Art. 31)
- Informações relativas à intimidade, vida privada, honra e imagem de pessoas físicas
- Prazo de restrição de acesso a terceiros: Até **100 (cem) anos** a contar da data de sua produção
- Exceções ao sigilo pessoal: Consentimento expresso da pessoa, necessidade de tutela médica de urgência ou apuração judicial

---

## 📬 Eixo 4: Procedimento de Acesso, Prazos e Mecanismos Recursais
### 1. Prazos de Resposta ao Requerimento (Arts. 11 e 12)
- Regra Geral: Resposta e acesso **IMEDIATO** se a informação estiver disponível
- Se não for possível o acesso imediato, o órgão tem prazo de **até 20 (vinte) dias** para:
  - Disponibilizar a informação
  - Indicar data, local e modo para consulta
  - Comunicar a recusa fundamentada de acesso
- **Prorrogação Justificada**: O prazo de 20 dias pode ser prorrogado por mais **10 (dez) dias** mediante justificativa expressa enviada ao solicitante

### 2. Gratuidade e Custos de Reprodução
- O serviço de busca e fornecimento da informação pública é **GRATUITO**
- A Administração só pode cobrar o valor estrito referente aos **custos de reprodução gráfica/digital** dos documentos

### 3. Mecanismos Recursais da LAI (Arts. 15 a 17)
- Em caso de negativa de acesso ou não fornecimento das razões da negativa:
  - Recurso à autoridade hierarquicamente superior no prazo de **10 (dez) dias** (decisão em 5 dias)
  - No âmbito federal: Persistindo a negativa, recurso à **Controladoria-Geral da União (CGU)** e, por fim, à **Comissão Mista de Reavaliação de Informações (CMRI)**

---

## 🤝 Eixo 5: Interface com a Lei nº 13.460/2017 e Ouvidorias Públicas
### 1. O Código de Defesa dos Usuários de Serviços Públicos
- Estabelece normas sobre participação, proteção e defesa dos direitos dos usuários de serviços públicos
- Fixa prazo geral de resposta a manifestações em ouvidorias de até **30 dias**, prorrogável por igual período

### 2. Funções Essenciais da Ouvidoria
- Recebimento, análise e encaminhamento de reclamações, denúncias, sugestões e elogios
- Produção de relatórios periódicos de governança e melhoria contínua dos serviços

---

## ⚖️ Eixo 6: Síntese Jurisprudencial Vinculante (STF, STJ e TCU)
### 1. Divulgação da Remuneração dos Servidores Públicos (Tema 483 STF)
- É **legítima e constitucional** a divulgação dos nomes dos servidores públicos e dos valores correspondentes às suas respectivas remunerações brutas e líquidas em portais de transparência, sem violação ao direito de intimidade

### 2. Acesso a Gastos de Cartões Corporativos pelo TCU
- As despesas realizadas com cartões corporativos de autoridades públicas sujeitam-se ao escrutínio público e transparência, ressalvadas apenas despesas operacionais da segurança pessoal do Presidente

---

## 🚨 Eixo 7: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Justificativa para Pedido de Informação
- 🚨 **Pegadinha Clássica**: Afirmar que o cidadão deve justificar o motivo ou finalidade para solicitar informação de transparência passiva.
- ✅ **Regra**: A LAI proíbe terminantemente exigir do solicitante os motivos do pedido de informação!

### 2. Prazos de Classificação de Sigilo
- 🚨 **Pegadinha Clássica**: Inverter os prazos das informações sigilosas.
- ✅ **Regra**: Ultrassecreta = **25 anos**; Secreta = **15 anos**; Reservada = **5 anos**; Informações Pessoais = **100 anos**!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 650,
        spacingVertical: 20,
        spacingHorizontal: 120,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
