  <style>

    #mindmap {
      width: 100%;

    /* ==========================================================================
       OBSIDIAN CANVAS CARDS & NODES
       ========================================================================== */
    .markmap-node line {
      display: none !important; /* Remove o sublinhado arcaico tradicional */
    }

    .markmap-foreign {
      overflow: visible !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    .markmap-foreign > div {
      display: inline-flex;
      align-items: center;
      position: relative;
      border-radius: 10px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      line-height: 1.45;
    }

    /* CARD NÍVEL 0: EPICENTRO / ROOT */

      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.92));
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 14px;
      padding: 10px 22px;
      font-size: 15.5px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 0.3px;
      box-shadow: 
        0 0 25px rgba(56, 189, 248, 0.22),
        0 12px 30px -5px rgba(0, 0, 0, 0.7);
    }

    /* CARD NÍVEL 1: EIXOS TEMÁTICOS (OBSIDIAN BOARD CARDS) */
    .markmap-node[data-depth="1"] .markmap-foreign > div {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      box-shadow: 
        0 4px 18px -2px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      gap: 8px;
    }
    .markmap-node[data-depth="1"]:hover .markmap-foreign > div {
      border-color: rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
      box-shadow: 
        0 0 20px rgba(56, 189, 248, 0.28),
        0 10px 25px -4px rgba(0, 0, 0, 0.7);
    }

    /* Cores das tarjas de eixos */
    .markmap-node[data-depth="1"]:nth-of-type(6n+1) .markmap-foreign > div { border-left-color: #38bdf8; }
    .markmap-node[data-depth="1"]:nth-of-type(6n+2) .markmap-foreign > div { border-left-color: #818cf8; }
    .markmap-node[data-depth="1"]:nth-of-type(6n+3) .markmap-foreign > div { border-left-color: #c084fc; }

    .markmap-node[data-depth="1"]:nth-of-type(6n+5) .markmap-foreign > div { border-left-color: #fbbf24; }
    .markmap-node[data-depth="1"]:nth-of-type(6n+6) .markmap-foreign > div { border-left-color: #fb7185; }

    /* CARD NÍVEL 2: SUBTÓPICOS (SECONDARY CARDS) */
    .markmap-node[data-depth="2"] .markmap-foreign > div {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;

    let rawMarkdown = `# Mapa (Dir. Adm. Aula 10 - Antigravity)

## 🏛️ Eixo 1: Ontologia, Conceito e Titularidade dos Bens Públicos
### 1. Visão Geral e Critério Subjetivo do Código Civil
- **Bens Públicos (CC art. 98)**: Bens do domínio nacional pertencentes às pessoas jurídicas de direito público interno
  - União, Estados, Distrito Federal, Municípios, Autarquias e Fundações Públicas de Direito Público
- **Bens Privados**: Todos os demais bens, pertençam a particulares ou a estatais exploradoras de atividade econômica

### 2. Os Bens das Empresas Estatais (EP e SEM)
- **Regra Geral**: Os bens das empresas estatais são bens de direito privado
- **Exceção Constitucional do STF**:
  - Bens das estatais **prestadoras de serviços públicos próprios do Estado** que estejam diretamente afetados à prestação do serviço
  - Gozam de prerrogativas de bens públicos: **Impenhorabilidade e regime de precatórios** (ex: bens dos Correios / ECT)!

---

## 🗂️ Eixo 2: Classificação Tripartite do Código Civil (Art. 99) e Afetação
### 1. As Três Classes de Bens Públicos
- **1. Bens de Uso Comum do Povo (Domínio Público Geral)**:
  - Destinados à fruição coletiva geral da sociedade (mares, praias, rios, estradas, ruas e praças)
  - Podem ser de uso gratuito ou remunerado (ex: pedágio não retira a natureza de bem comum)
- **2. Bens de Uso Especial (Patrimônio Administrativo Indisponível)**:
  - Destinados à execução dos serviços públicos e instalação de órgãos e repartições públicas
  - Prédios de ministérios, escolas públicas, hospitais do SUS, viaturas, quartéis e cemitérios públicos
- **3. Bens Dominicais / Patrimoniais Disponíveis**:
  - Constituem o patrimônio disponível do Estado sem destinação pública específica
  - Prédios públicos desativados, terras devolutas, dívida ativa inscrita e títulos da dívida
  - *Única categoria de bens públicos que pode ser alienada ordinariamente*!

### 2. Regime de Afetação e Desafetação
- **Afetação**: Atribuição formal ou fática de destinação pública a um bem (torna o bem inalienável)
- **Desafetação**: Retirada da destinação pública do bem, convertendo-o em bem dominical
- **Regra de Ouro**: A desafetação prévia é **condição indispensável** para alienação de qualquer bem de uso comum ou especial!

---

## 🛡️ Eixo 3: Regime Jurídico e Prerrogativas dos Bens Públicos
### 1. Matriz de Prerrogativas Protetivas
- **1. Inalienabilidade Relativa**: Bens de uso comum e especial são inalienáveis enquanto mantiverem sua afetação (art. 100 CC); dominicais podem ser alienados cumpridos os requisitos
- **2. Impenhorabilidade**: Bens públicos não sofrem penhora judicial; cobrança de créditos contra a Fazenda segue o regime de **Precatórios** (CF art. 100)
- **3. Imprescritibilidade**: **NENHUM bem público sofre USUCAPIÃO** (Súmula 340 STF / CF arts. 183 §3º e 191)
- **4. Não-Onerabilidade**: Bens públicos não podem ser gravados com direitos reais de garantia (penhor, hipoteca)

### 2. Ocupação Irregular: Posse vs. Detenção (Súmula 619 STJ)
- A ocupação não autorizada de bem público configura **MERA DETENÇÃO** precária
- Efeitos: Não induz posse jurídica, não gera direito à retenção nem a indenização por benfeitorias úteis ou necessárias

---

## 🏷️ Eixo 4: Regime de Alienação de Bens Públicos (Lei 14.133/2021)
### 1. Requisitos Cumulativos Obrigatórios (Art. 76)
- **Para Bens Imóveis**:
  - 1. Demonstração de *Interesse Público justificado*
  - 2. *Avaliação prévia* de mercado
  - 3. *Autorização legislativa* (indispensável para órgãos diretos e autarquias)
  - 4. *Licitação prévia*
- **Para Bens Móveis**: Interesse público + Avaliação prévia + Licitação (dispensada autorização legislativa)

### 2. Modalidade Licitatória na Lei 14.133/2021: LEILÃO Obrigatório!
- Na Nova Lei de Licitações, a alienação de bens móveis e imóveis deve ser realizada pela modalidade **LEILÃO**!

### 3. Hipóteses de Licitação Dispensada para Imóveis (Art. 76, I)
- Dação em pagamento, Doação a outro ente público, Permuta, Investidura e Legitimação Fundiária (REURB)

---

## 🗺️ Eixo 5: Espécies Constitucionais Especiais de Bens Públicos
### 1. Terras Devolutas (CF art. 20, II e art. 26, IV)
- Terras públicas sem destinação pública que nunca ingressaram no patrimônio privado
- **Regra**: Pertencem aos **ESTADOS** (competência residual)
- **Exceção (Bens da União)**: Faixa de fronteira (150 km), preservação ambiental e defesa militar

### 2. Terrenos de Marinha e Recursos Hídricos
- **Terrenos de Marinha (CF art. 20, VII)**: Bens exclusivos da **UNIÃO** (faixa de 33 metros a partir da preamar média de 1831)
- **Águas Públicas**:
  - União: Rios interestaduais, fronteiriços ou que banhem mais de um Estado
  - Estados: Rios que nascem e deságuam no seu próprio território e **águas subterrâneas**
  - 🚨 *Atenção*: Os **MUNICÍPIOS NÃO POSSUEM** águas públicas nem terras devolutas!

---

## 🤝 Eixo 6: Instrumentos de Outorga de Uso a Particulares
### 1. Matriz Comparativa dos 4 Instrumentos
- **Autorização de Uso**: Ato unilateral, discricionário e **precário**; atende ao interesse do particular; sem licitação
- **Permissão de Uso**: Ato unilateral, discricionário e **precário**; atende interesse recíproco; exige licitação (regra)
- **Concessão de Uso**: **Contrato Administrativo bilateral** e estável; prazo determinado; licitação obrigatória
- **Concessão de Direito Real de Uso (CDRU)**: Contrato com **direito real resolúvel**; averbação no Registro de Imóveis

---

## 🚨 Eixo 7: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Usucapião de Bem Dominical
- 🚨 **Pegadinha Clássica**: Afirmar que bem dominical pode ser adquirido por usucapião por não ter destinação pública.
- ✅ **Regra**: Súmula 340 STF: NENHUM bem público, inclusive dominical, é passível de usucapião!

### 2. Modalidade de Alienação de Imóveis
- 🚨 **Pegadinha Clássica**: Afirmar que a alienação de imóveis na Lei 14.133/21 exige Concorrência.
- ✅ **Regra**: Na Lei 14.133/21 a alienação de bens é feita exclusivamente por **LEILÃO**!`;

        .replace(/\b(CF\/88|CF|Constituição Federal)\b/g, '<span class="tag tag-lei">📜 $1</span>')
        .replace(/\b(Art\.?\s*\d+[^,()<\n]*)/g, '<span class="tag tag-lei">⚖️ $1</span>')
        .replace(/\b(Lei\s*n?º?\s*\d+[\.\d+]*)/g, '<span class="tag tag-lei">📖 $1</span>')
        // Tribunais Superiores
        .replace(/\b(STF|STJ)\b/g, '<span class="tag tag-tribunal">🏛️ $1</span>')
        // Alertas e Pegadinhas
        .replace(/\b(Radar de Pegadinhas|Pegadinha)\b/g, '<span class="tag tag-alerta">⚠️ $1</span>');
    }

    const processedMarkdown = enrichMarkdownTags(rawMarkdown);

    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(processedMarkdown);
      const { Markmap } = window.markmap;
      
      mmInstance = Markmap.create('#mindmap', {
        duration: 350,
        maxWidth: 700,
        spacingVertical: 32,
        spacingHorizontal: 140,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);

      // Iniciar com os Eixos principais visíveis (Nível 1)
      setTimeout(() => {
        setLevel(1);
      }, 150);
    });

    function fitView() {
      if (mmInstance) mmInstance.fit();
    }

    function setLevel(targetLevel) {
      if (!mmInstance) return;
      function foldByLevel(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= targetLevel ? 1 : 0 };
          node.children.forEach(c => foldByLevel(c, depth + 1));
        }
      }
      foldByLevel(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function handleSearch(val) {
      const query = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clearBtn');
      clearBtn.style.display = query ? 'inline-block' : 'none';

      const nodes = document.querySelectorAll('.markmap-node');
      if (!query) {
        nodes.forEach(n => {
          n.style.opacity = '1';
          n.classList.remove('search-highlight');
        });
        return;
      }

      nodes.forEach(n => {
        const text = n.textContent.toLowerCase();
        if (text.includes(query)) {
          n.style.opacity = '1';
          n.classList.add('search-highlight');
        } else {
          n.style.opacity = '0.22';
          n.classList.remove('search-highlight');
        }
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // Atalhos de Teclado
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey && e.key.toLowerCase() === 'f') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
        e.preventDefault();
        const input = document.getElementById('searchInput');
        input.focus();
        input.select();
      } else if (e.key === 'Escape') {
        clearSearch();
      }
    });
  </script>
</body>
</html>
