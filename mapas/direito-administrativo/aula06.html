# 📚 Direito Administrativo: Aula 06 - Serviços Públicos, Concessões e PPPs
## 🧭 Eixo 1: Ontologia, Conceito e Princípios do Serviço Público
### 1. Elementos Constitutivos (Tríplice Critério)
- **Elemento Material**: Atividade de utilidade ou comodidade pública prestada para satisfazer necessidades coletivas
- **Elemento Subjetivo**: Presença direta do Estado ou de seus delegatários (concessionárias/permissionárias) sob fiscalização estatal
- **Elemento Formal**: Submissão a regime jurídico de direito público derrogatório e exorbitante do direito comum

### 2. O Princípio do Serviço Adequado (Lei nº 8.987/1995, Art. 6º)
- O serviço adequado satisfaz plenamente as condições cumulativas de:
  - **Regularidade**: Prestação habitual sem interrupções injustificadas
  - **Continuidade**: Vedação à suspensão arbitrária (regime ininterrupto de utilidade)
  - **Eficiência**: Rendimento técnico, qualidade e celeridade
  - **Segurança**: Prevenção de acidentes e proteção à integridade dos usuários
  - **Atualidade**: Modernidade das técnicas, equipamentos e instalações, e sua conservação
  - **Generalidade**: Universalidade de acesso sem discriminações ilegítimas
  - **Cortesia**: Urbanidade e respeito no trato com o público consumidor
  - **Modicidade das Tarifas**: Tarifas acessíveis à renda média popular

### 3. Regime de Continuidade e Regras de Corte
- **Exceções Legais à Continuidade (Art. 6º, § 3º)**:
  - *Motivo de Ordem Técnica ou de Segurança*: Situações de emergência e reparo imediato
  - *Inadimplemento do Usuário*: Após formal e inequívoco **aviso prévio**
- **Regras de Ouro da Jurisprudência (STJ e STF)**:
  - **Lei nº 14.015/2020**: **VEDADO** o corte por inadimplemento que se inicie em **sextas-feiras, sábados, domingos, feriados ou vésperas de feriados**!
  - **Dívidas Pretéritas**: O corte de fornecimento de serviço essencial só é legítimo para débitos **atuais** (mês corrente). Débitos pretéritos consolidados devem ser cobrados pelas vias ordinárias judiciais (Súmula do STJ)!
  - **Unidades Públicas Essenciais**: É ilegal o corte em hospitais, prontos-socorros, UTIs, escolas públicas e delegacias

---

## 🏗️ Eixo 2: Formas de Delegação e Matriz Tríplice
### 1. Concessão de Serviço Público (Lei nº 8.987/1995)
- **Natureza Jurídica**: Contrato administrativo bilateral, oneroso e comutativo
- **Destinatários**: Exclusivamente **pessoa jurídica** ou **consórcio de empresas** (vedada a pessoa física)
- **Prazo**: Sempre determinado
- **Modalidade Licitatória**: Obrigatoriamente **Concorrência** ou **Diálogo Competitivo** (Lei 14.133/2021)
- **Responsabilidade Civil**: Objetiva perante terceiros usuários e não usuários (CF, art. 37, § 6º)

### 2. Permissão de Serviço Público
- **Natureza Jurídica**: Contrato de adesão precário e revogável
- **Destinatários**: Pessoa jurídica OU **pessoa física**
- **Licitação**: Exigida prévia licitação em qualquer modalidade legal

### 3. Autorização de Serviço Público
- **Natureza Jurídica**: Ato administrativo unilateral, discricionário e precário
- **Dispensa de Licitação**: Situações transitórias ou emergenciais (ex: táxis, serviços pontuais de transporte)

---

## 💰 Eixo 3: Política Tarifária e Remuneração
### 1. Taxa vs. Tarifa (Preço Público)
- **Taxa**:
  - Tributo cobrado por serviço público específico e divisível (*uti singuli*), de utilização obrigatória ou posto à disposição
  - Regime de direito tributário estrito (princípio da legalidade estrita)
  - Arrecadada diretamente pelo Poder Público
- **Tarifa (Preço Público)**:
  - Contraprestação não tributária cobrada por serviços facultativos delegados a particulares
  - Fixada por contrato e regulada pelo Poder Concedente
  - **Súmula Vinculante 40 (STF)**: O serviço de iluminação pública não pode ser remunerado mediante taxa
  - **Súmula 545 (STF)**: Preços de serviços públicos e taxas não se confundem: taxa exige lei; preço decorre de utilização facultativa contratual

### 2. Receitas Acessórias e o Tema IAC 8 do STJ
- Concessionárias podem explorar receitas alternativas e acessórias (publicidade, projetos associados) para modicidade tarifária
- **Tese Fixada no IAC 8 do STJ**: Concessionária de rodovia federal **NÃO PODE COBRAR** de outra concessionária de serviço público (água, luz, telecomunicações) taxa ou valor pelo uso ou passagem na faixa de domínio da rodovia!

### 3. Manutenção do Equilíbrio Econômico-Financeiro
- A equação econômico-financeira inicial do contrato é garantia constitucional (CF, art. 37, XXI)
- Áleas extraordinárias, fato do príncipe e fato da administração autorizam a imediata revisão tarifária

---

## 🏁 Eixo 4: As 6 Formas de Extinção da Concessão
### 1. Advento do Termo Contratual
- Fim natural do prazo fixado em contrato
- Opera a **reversão automática** dos bens vinculados ao serviço que já foram amortizados

### 2. Encampação (Resgate)
- Retomada do serviço pelo Poder Concedente durante a vigência do contrato por motivo de **INTERESSE PÚBLICO**
- **Requisitos Cumulativos Obrigatórios**:
  - **Lei autorizativa específica**
  - **Indenização prévia em dinheiro** cobrindo os investimentos não amortizados e lucros cessantes

### 3. Caducidade
- Extinção decretada pela Administração por motivo de **INEXECUÇÃO TOTAL OU PARCIAL** culposa da concessionária
- Declarada mediante **DECRETO do Poder Executivo**
- Exige processo administrativo com ampla defesa prévia; não exige indenização prévia (eventuais saldos são acertados a posteriori com dedução de multas e prejuízos)

### 4. Rescisão
- Extinção requerida pela **CONCESSIONÁRIA** em virtude do inadimplemento culposo das obrigações do Poder Concedente
- **Regra Fundamental**: Exige **AÇÃO JUDICIAL transitada em julgado**!
- A concessionária **NÃO PODE interromper unilateralmente o serviço** antes da sentença final transitada em julgado (princípio da continuidade)

### 5. Anulação
- Extinção por motivo de **ILEGALIDADE originária** na licitação ou no contrato
- Efeitos retroativos (*ex tunc*), com direito a indenização pelos investimentos feitos de boa-fé

### 6. Falência ou Extinção da Empresa
- Falência da concessionária ou dissolução societária (e falecimento do titular, na permissão de pessoa física)

---

## 🤝 Eixo 5: Parcerias Público-Privadas (PPPs — Lei nº 11.079/2004)
### 1. As Modalidades de Concessão Especial
- **Concessão Patrocinada**:
  - Envolve a prestação de serviços públicos ou obras públicas com **cobrança de tarifa dos usuários + contraprestação pecuniária do parceiro público**
- **Concessão Administrativa**:
  - Contrato em que a **Administração Pública é a usuária direta ou indireta**, com contraprestação integralmente paga pelo Poder Público (mesmo que envolva execução de obra prévia)
  - Ex: Presídios geridos por PPP, centros administrativos municipais

### 2. Vedações Expressas da Lei de PPPs (Art. 2º, § 4º)
- É terminantemente **VEDADA** a celebração de contrato de PPP cujo:
  - Valor do contrato seja **inferior a R$ 10 milhões**
  - Período de prestação seja **inferior a 5 anos ou superior a 35 anos** (já computada eventual prorrogação)
  - Objeto seja **única e exclusivamente fornecimento de mão de obra** ou execução de obra pública sem prestação de serviço associada

---

## 🎯 Eixo 6: Radar de Pegadinhas Cebraspe & FGV
- **Encampação vs. Caducidade**: Encampação decorre de interesse público (exige lei e indenização prévia); Caducidade decorre de culpa da concessionária (por decreto, sem lei e sem indenização prévia)
- **Rescisão Judicial**: Concessionária não pode invocar exceção do contrato não cumprido para parar o serviço por conta própria; tem de ingressar com ação judicial
- **PPPs**: Concessão comum (Lei 8.987: só tarifa do usuário); Patrocinada (tarifa + dinheiro público); Administrativa (só dinheiro público, Estado é o usuário)
- **Faixa de Domínio (IAC 8 STJ)**: Concessionária de rodovia não cobra de concessionária de água/energia pelo uso da faixa de domínio

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
