    /* CARD NÍVEL 1: EIXOS TEMÁTICOS (OBSIDIAN BOARD CARDS) */
    .markmap-node[data-depth="1"] .markmap-foreign > div {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);

    .markmap-node[data-depth="1"]:hover .markmap-foreign > div {
      border-color: rgba(56, 189, 248, 0.6);
      transform: translateY(-2px);
      box-shadow: 
        0 0 20px rgba(56, 189, 248, 0.28),
        0 10px 25px -4px rgba(0, 0, 0, 0.7);

    let rawMarkdown = `# Mapa (Dir. Adm. Aula 14 - Antigravity)

## ⚖️ Eixo 1: Deveres Funcionais, Proibições e Responsabilidades
### 1. Deveres Funcionais (Art. 116)
- **Dever de Lealdade e Obediência**:
  - Exercer com zelo e dedicação as atribuições do cargo
  - Cumprir as ordens superiores, **EXCETO quando manifestamente ilegais** (ordem ilegal NÃO se cumpre!)
- **Dever de Probidade e Urbanidade**:
  - Guardar sigilo sobre assunto da repartição
  - Tratar com urbanidade as pessoas e representar contra ilegalidade, omissão ou abuso de poder

### 2. Proibições Expressas (Art. 117)
- **Faltas Leves / Médias**: Ausentar-se do serviço sem prévia autorização; retirar documento ou objeto sem anuência; coagir subordinados a filiação partidária
- **Faltas Graves (Apenadas com Demissão)**:
  - Praticar usura sob qualquer de suas formas
  - Valer-se do cargo para lograr proveito pessoal ou de outrem
  - Receber propina, comissão, presente ou vantagem de qualquer espécie
  - Exercer comércio ou participar de sociedade comercial, **EXCETO como acionista, cotista ou comanditário** (proibição de gerência/administração!)

### 3. Independência das Instâncias (Civil, Penal e Administrativa)
- **Regra Geral**: As sanções civis, penais e administrativas são cumulativas e independentes entre si (art. 125)
- **Exceção Constitucional Absoluta**: A absolvição criminal que declara a **INEXISTÊNCIA DO FATO** ou a **NEGATIVA DE AUTORIA** vincula a Administração e **anula sumariamente a punição administrativa**!
- A absolvição criminal por *falta de provas* NÃO impede a demissão disciplinar administrativa!

---

## 🚫 Eixo 2: Penalidades Disciplinares da Lei 8.112/1990
### 1. Rol Taxativo de Penalidades (Art. 127)
- Advertência, Suspensão, Demissão, Cassação de aposentadoria ou disponibilidade, Destituição de cargo em comissão e Destituição de função comissionada (vedada pena não prevista em lei!)

### 2. Advertência e Suspensão
- **Advertência (Art. 129)**: Aplicada por escrito em violação de deveres ou proibições leves; cancelamento do registro após **3 anos** sem nova infração
- **Suspensão (Art. 130)**:
  - Aplicada em caso de reincidência em falta leve ou violação de proibições médias; prazo máximo de **90 dias**
  - Cancelamento do registro após **5 anos**
  - *Conversão em Multa*: A penalidade de suspensão pode ser convertida em multa à base de **50% por dia de remuneração**, com o servidor obrigado a permanecer em serviço (conveniência administrativa)

### 3. Demissão (Infrações Gravíssimas - Art. 132)
- Crime contra a administração pública; Abandono de cargo (ausência intencional por mais de **30 dias consecutivos**); Inassiduidade habitual (falta sem justificativa por **60 dias interpolados** em 12 meses); Improbidade administrativa; Incontinência pública e conduta escandalosa; Insubordinação grave em serviço; Ofensa física em serviço a servidor ou particular (salvo em legítima defesa); Aplicação irregular de dinheiros públicos; Revelação de segredo conhecido em razão do cargo; Corrupção e Lesão aos cofres públicos

### 4. Efeitos Temporais da Demissão
- **Incompatibilidade por 5 Anos**: Demissão por valer-se do cargo para proveito próprio ou praticar comércio/gerência
- **Incompatibilidade Permanente (Inidoneidade)**: Demissão por crime contra a administração, improbidade, corrupção ou lesão ao erário impede novo retorno ao serviço público federal!

---

## ⏳ Eixo 3: Prazos Prescricionais e Competência para Aplicação
### 1. Prazos Prescricionais da Ação Disciplinar (Art. 142)
- **5 (cinco) anos**: Para infrações puníveis com **Demissão**, Cassação de aposentadoria/disponibilidade e Destituição de comissionado
- **2 (dois) anos**: Para infrações puníveis com **Suspensão**
- **180 (cento e oitenta) dias**: Para infrações puníveis com **Advertência**
- *Termo Inicial*: O prazo prescricional começa a correr na **data em que o fato se tornou conhecido pela autoridade competente** (e não na data da prática da infração)!
- *Interrupção da Prescrição*: A instauração regular de Sindicância ou PAD **interrompe a prescrição uma única vez** até a decisão final (ou até 140 dias no PAD)

### 2. Infrações Capitais como Crime
- Se a infração disciplinar também for capitulada como crime, aplicam-se os **prazos de prescrição da lei penal** (art. 142 §2º)

### 3. Competência para Aplicação das Penalidades (Art. 141)
- Demissão e Cassação de aposentadoria: **Presidente da República** (ou Chefes de Poder/PGR)
- Suspensão superior a 30 dias: Autoridades administrativas de hierarquia imediatamente inferior
- Suspensão até 30 dias e Advertência: Chefe da repartição e outras autoridades designadas em regimento

---

## 🔍 Eixo 4: Processo Administrativo Disciplinar (PAD Ordinário) e Sindicância
### 1. Sindicância Administrativa (Art. 145)
- Procedimento preparatório sumário de apuração
- **Resultados Possíveis da Sindicância**:
  - 1. Arquivamento do processo (inexistência de irregularidade)
  - 2. Aplicação direta de penalidade de **Advertência** ou de **Suspensão de até 30 dias**
  - 3. Instauração obrigatória de **PAD** (se a falta exigir suspensão superior a 30 dias, demissão ou cassação)
- Prazo da sindicância: 30 dias, prorrogável por igual período

### 2. PAD Ordinário (Rito Geral - Arts. 148 a 166)
- Obrigatório para apurar faltas que cominem demissão, cassação de aposentadoria ou suspensão superior a 30 dias
- **Comissão Processante**: Composta por **3 (três) servidores estáveis**, designados pela autoridade instauradora (o presidente da comissão deve ocupar cargo de nível igual ou superior ao do indiciado)
- **Fases do PAD**:
  - 1ª Instauração (publicação da portaria constitutiva da comissão)
  - 2ª Inquérito Administrativo (Instrução probatória, Defesa e Relatório Conclusivo da Comissão)
  - 3ª Julgamento (autoridade competente decide acatando ou agravando fundamentadamente o relatório)
- **Prazos do PAD Ordinário**:
  - Prazo de conclusão: **60 dias**, prorrogável por mais 60 dias (total: 120 dias)
  - Prazo para julgamento da autoridade: **20 dias**
  - *Prazo total de garantia*: 140 dias (ao final de 140 dias a prescrição interrompida volta a correr!)

---

## ⚡ Eixo 5: Procedimento Sumário e Revisão do Processo Disciplinar
### 1. O Rito Sumário (Art. 133)
- Rito célere aplicável a apenas três faltas formais graves:
  - 1. **Acumulação ilegal de cargos, empregos ou funções públicas**
  - 2. **Abandono de cargo** (falta por mais de 30 dias consecutivos)
  - 3. **Inassiduidade habitual** (60 dias interpolados no período de 12 meses)
- **Comissão do Rito Sumário**: Composta por apenas **2 (dois) servidores estáveis** (no rito ordinário são 3!)
- **Prazos no Rito Sumário**: Prazo de conclusão de **30 dias**, prorrogável por até 15 dias; prazo de defesa de 5 dias

### 2. A Opção de Boa-Fé na Acumulação Ilegal
- Notificado da acumulação ilegal, o servidor tem prazo de **10 dias para fazer opção** por um dos cargos
- Se fizer a opção tempestiva: Caracteriza-se a boa-fé e o processo é arquivado sem punição!
- Se não optar ou provada má-fé: Aplica-se a pena de demissão em ambos os cargos federais!

### 3. Revisão do Processo Disciplinar (Arts. 174 a 182)
- Cabível a qualquer tempo a pedido do servidor ou herdeiros quando surgirem **fatos novos ou circunstâncias relevantes** suscetíveis de provar a inocência ou inadequação da sanção
- 🚨 **Princípio da Vedação da Reformatio in Pejus**: Da revisão do processo **NUNCA PODERÁ RESULTAR AGRAVAMENTO DA PENALIDADE** já imposta!

## 🏛️ Eixo 6: Compilado de Jurisprudência Vinculante e Temas do STF/STJ
### 1. Súmula Vinculante nº 5 do STF
- > *"A falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição."*
- A presença de advogado no PAD é facultativa; assegura-se ampla defesa pessoal ou por defensor dativo

### 2. Súmula 592 do STJ (Excesso de Prazo no PAD)
- O excesso de prazo para a conclusão do PAD **NÃO gera nulidade automática**, desde que não cause prejuízo comprovado à ampla defesa e ao contraditório

### 3. Súmula 650 do STJ (Provas Emprestadas)
- É legítima a utilização em PAD de prova emprestada de processo penal (inclusive interceptações telefônicas autorizadas judicialmente), assegurado o contraditório administrativo

### 4. Súmula 635 do STJ (Prescrição e Falta como Crime)
- Os prazos de prescrição da lei penal só se aplicam à infração disciplinar se houver expressa apuração e tipificação criminal com ação penal proposta

## 🛡️ Eixo 7: Seguridade Social do Servidor Público Federal (EC 103/2019)
### 1. Regime Próprio de Previdência Social (RPPS - CF art. 40)
- Exclusivo para ocupantes de cargo efetivo da União; caráter contributivo e solidário
- Ocupantes exclusivamente de cargo em comissão, emprego público e temporários vinculam-se ao **Regime Geral de Previdência Social (RGPS / INSS)**!

### 2. Benefícios Previdenciários do Servidor
- Aposentadoria Voluntária, Compulsória (aos **75 anos de idade** com proventos proporcionais) e por Incapacidade Permanente
- Pensão por morte aos dependentes e Auxílio-funeral

### 1. Quantitativo de Membros da Comissão
- 🚨 **Pegadinha Clássica**: Afirmar que a comissão do rito sumário exige 3 servidores estáveis.
- ✅ **Regra**: PAD Ordinário = **3 servidores estáveis**; Rito Sumário (acumulação/abandono) = **2 servidores estáveis**!

### 2. Presença de Advogado no PAD
- 🚨 **Pegadinha Clássica**: Dizer que a ausência de advogado no interrogatório do PAD anula o processo.
- ✅ **Regra**: Súmula Vinculante 5 do STF: Defesa por advogado é FACULTATIVA no processo disciplinar!

### 3. Agravamento de Pena na Revisão

- ✅ **Regra**: A revisão disciplinar JAMAIS pode resultar em agravamento de penalidade (*reformatio in pejus* vedada)!`;

    // Processamento de Tags Visuais Inteligentes
    function enrichMarkdownTags(text) {
      return text
        // Bancas examinadoras
        .replace(/\b(Cebraspe|CESPE)\b/g, '<span class="tag tag-banca">🎯 $1</span>')
        .replace(/\b(FGV|FCC|VUNESP)\b/g, '<span class="tag tag-banca">📋 $1</span>')
        // Legislação e Artigos
        .replace(/\b(CF\/88|CF|Constituição Federal)\b/g, '<span class="tag tag-lei">📜 $1</span>')
        .replace(/\b(Art\.?\s*\d+[^,()<\n]*)/g, '<span class="tag tag-lei">⚖️ $1</span>')
        .replace(/\b(Lei\s*n?º?\s*\d+[\.\d+]*)/g, '<span class="tag tag-lei">📖 $1</span>')
        // Tribunais Superiores
        .replace(/\b(STF|STJ)\b/g, '<span class="tag tag-tribunal">🏛️ $1</span>')
        // Alertas e Pegadinhas
        .replace(/\b(Radar de Pegadinhas|Pegadinha)\b/g, '<span class="tag tag-alerta">⚠️ $1</span>');
    }

    const processedMarkdown = enrichMarkdownTags(rawMarkdown);

    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(processedMarkdown);
      const { Markmap } = window.markmap;
      
      mmInstance = Markmap.create('#mindmap', {
        duration: 350,
        maxWidth: 700,
        spacingVertical: 32,
        spacingHorizontal: 140,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);

      // Iniciar com os Eixos principais visíveis (Nível 1)
      setTimeout(() => {
        setLevel(1);
      }, 150);
    });

    function fitView() {
      if (mmInstance) mmInstance.fit();
    }

    function setLevel(targetLevel) {
      if (!mmInstance) return;
      function foldByLevel(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= targetLevel ? 1 : 0 };
          node.children.forEach(c => foldByLevel(c, depth + 1));
        }
      }
      foldByLevel(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function handleSearch(val) {
      const query = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clearBtn');
      clearBtn.style.display = query ? 'inline-block' : 'none';

      const nodes = document.querySelectorAll('.markmap-node');
      if (!query) {
        nodes.forEach(n => {
          n.style.opacity = '1';
          n.classList.remove('search-highlight');
        });
        return;
      }

      nodes.forEach(n => {
        const text = n.textContent.toLowerCase();
        if (text.includes(query)) {
          n.style.opacity = '1';
          n.classList.add('search-highlight');
        } else {
          n.style.opacity = '0.22';
          n.classList.remove('search-highlight');
        }
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // Atalhos de Teclado
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey && e.key.toLowerCase() === 'f') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
        e.preventDefault();
        const input = document.getElementById('searchInput');
        input.focus();
        input.select();
      } else if (e.key === 'Escape') {
        clearSearch();
      }
    });
  </script>
