# 📚 Direito Administrativo: Aula 01 - Organização Administrativa, Órgãos e Autarquias
## 🏛️ Eixo 1: Fundamentos da Organização do Estado e da Administração
### 1. Tríplice Distinção Ontológica
- **Estado (Pessoa Jurídica Soberana)**
  - Sociedade politicamente organizada (povo, território e soberania)
  - Titular do ordenamento jurídico e da soberania internacional
  - Responde civilmente de forma objetiva por danos (CF, art. 37, § 6º)
- **Governo (Função Política / Diretiva)**
  - Comando político superior do Estado e formulação de diretrizes primárias
  - Atos de governo: ampla discricionariedade, oportunidade e mérito político
  - Responsabilidade eminentemente política (crimes de responsabilidade)
- **Administração Pública (Função Executiva / Técnica)**
  - Aparelho instrumental subordinado que executa as políticas públicas
  - Atos administrativos: estrita submissão à lei formal e ao princípio da juridicidade
  - Responsabilidade funcional, civil e administrativa do agente executor

### 2. Pessoas Políticas vs. Pessoas Administrativas
- **Pessoas Políticas (Entidades Federativas: União, Estados, DF e Municípios)**
  - Nascem diretamente da Constituição Federal (Administração Direta)
  - Possuem capacidade política originária (editam leis primárias)
  - Possuem autogoverno (eleição de governantes) e auto-organização
- **Pessoas Administrativas (Entidades da Administração Indireta)**
  - Autarquias, Fundações Públicas, Empresas Públicas e Sociedades de Economia Mista
  - Criadas ou autorizadas por LEI ESPECÍFICA (não têm capacidade legislativa)
  - Não possuem autogoverno (dirigentes nomeados); possuem mera autoadministração técnica

---

## 🧭 Eixo 2: Matriz de Distribuição de Competências
### 1. O Binômio Organizacional (Quadro 2x2)
- **Centralização vs. Descentralização (Vetor Interentidades)**
  - *Centralização*: O Estado executa suas tarefas diretamente, pelo seu próprio centro (Entidade Federativa)
  - *Descentralização*: O Estado transfere a titularidade ou a mera execução para OUTRA pessoa jurídica
- **Concentração vs. Desconcentração (Vetor Intraentidade)**
  - *Concentração*: A competência é acumulada no topo da hierarquia, sem repartição interna
  - *Desconcentração*: Distribuição interna de competências DENTRO da mesma pessoa jurídica, criando ÓRGÃOS
  - *Mnemônico de Ouro*: Des**CO**ncentração cria órgãos (**CO**rpo); Des**CE**ntralização cria **EN**tidades

### 2. Espécies de Descentralização
- **Por Serviços / Funcional / Técnica / Outorga**
  - Transferência da **TITULARIDADE e da EXECUÇÃO** do serviço público
  - Feita exclusivamente por **LEI formal**
  - Destinatárias típicas: Entidades da Administração Indireta de direito público (ex: Autarquias)
  - Prazo: Indeterminado
- **Por Colaboração / Delegação**
  - Transferência apenas da **MERA EXECUÇÃO** material do serviço (o Estado retém a titularidade)
  - Feita por **CONTRATO administrativo** (Concessão/Permissão) ou **ATO precário** (Autorização)
  - Destinatárias: Empresas privadas particulares concessionárias e permissionárias
  - Prazo: Determinado e fiscalizado pelo Poder Concedente
- **Territorial ou Geográfica**
  - Criação de entidade com capacidade administrativa genérica em circunscrição territorial delimitada
  - Exemplo: Territórios Federais (possuem natureza jurídica de autarquias territoriais da União)

### 3. Vínculo Jurídico: Hierarquia vs. Tutela
- **Hierarquia (Subordinação)**
  - Existe exclusivamente no âmbito INTERNO da mesma pessoa jurídica (entre órgãos e agentes)
  - Envolve poder de comando, fiscalização, delegação, avocação e anulação/revogação de atos
- **Tutela / Supervisão Ministerial / Controle Finalístico (Vinculação)**
  - Ocorre entre a Administração Direta e as Entidades da Administração Indireta
  - **NÃO HÁ SUBORDINAÇÃO HIERÁRQUICA**!
  - Controle estritamente finalístico nos limites expressos da lei (vedada ingerência de mérito)

## 🏢 Eixo 3: Teoria dos Órgãos Públicos
### 1. Natureza Jurídica e Teoria do Órgão
- **Teoria da Imputação Volitiva (Otto Gierke)**
  - O órgão integra a estrutura da pessoa jurídica como parte indissociável
  - A manifestação de vontade do agente público é imputada diretamente à pessoa jurídica estatal
- **Despersonalização Orgânica**
  - Os órgãos públicos **NÃO possuem personalidade jurídica própria**
  - Não possuem patrimônio próprio (os bens pertencem à pessoa jurídica a que integram)
  - Não respondem civilmente por indenizações (a ação é proposta contra o Ente Federativo)

### 2. Capacidade Processual Excepcional (Personalidade Judiciária)
- Regra Geral: Órgãos não têm capacidade postulatória (não podem figurar como autor ou réu em juízo)
- **Exceção Constitucional**:
  - Órgãos de cúpula (Independentes e Autônomos) possuem *personalidade judiciária*
  - Finalidade estrita: Impetrar Mandado de Segurança para defender suas **prerrogativas institucionais** contra outro órgão/Poder
  - Exemplo: Mesa da Câmara Municipal contra o Prefeito que reteve o duodécimo
- **Súmula 525 do STJ**:
  - A Câmara de Vereadores **NÃO** possui personalidade judiciária para pleitear direitos patrimoniais ou tributários (ex: repasse de tributos)

### 3. Classificação dos Órgãos Públicos (Hely Lopes Meirelles)
- **Quanto à Posição Estatal / Hierárquica**:
  - *Independentes*: Previstos na CF, sem subordinação (Presidência, Congresso, STF, Tribunais)
  - *Autônomos*: Cúpula da administração, subordinados aos independentes (Ministérios, Secretarias)
  - *Superiores*: Órgãos de direção, controle e decisão (Departamentos, Coordenadorias, Gabinetes)
  - *Subalternos*: Mero cumprimento de rotinas operacionais (Seções de expediente, portarias)
- **Quanto à Estrutura**:
  - *Simples / Unitários*: Sem ramificação interna (único centro de competência)
  - *Compostos*: Estruturados em múltiplos órgãos menores subordinados
- **Quanto à Atuação Funcional**:
  - *Singulares / Unipessoais*: Decisão concentrada em um único titular (Presidência, Chefia)
  - *Colegiados / Pluripessoais*: Vontade manifestada por deliberação majoritária (Conselhos, Tribunais)

### 4. Criação e Extinção de Órgãos Públicos
- **Princípio da Reserva Legal (CF, Art. 48, XI)**:
  - A criação e a extinção de órgãos públicos exigem obrigatoriamente **LEI FORMAL**
- **Decreto Autônomo Presidencial (CF, Art. 84, VI, 'a')**:
  - Cabe ao Chefe do Executivo dispor mediante decreto sobre organização e funcionamento da administração
  - Condições cumulativas rígidas: **SEM aumento de despesa** E **SEM criação ou extinção de órgãos**!

## 🏛️ Eixo 4: Estrutura da Administração Direta e Indireta
### 1. Composição Estrutural
- **Administração Direta (Centralizada)**
  - União, Estados, Distrito Federal e Municípios (Pessoas Políticas) e seus órgãos desconcentrados
- **Administração Indireta (Descentralizada)**
  - Autarquias, Fundações Públicas, Empresas Públicas e Sociedades de Economia Mista

### 2. Regras Constitucionais Comuns a Toda a Administração Indireta (CF, Art. 37)
- **Princípio da Reserva Legal**:
  - Autarquias: Criadas diretamente por lei específica
  - Fundações, Empresas Públicas e SEM: Criação apenas autorizada por lei específica (exigem registro em cartório / Junta)
- **Concurso Público (Art. 37, II)**:
  - Obrigatório para cargos e empregos públicos de todas as entidades da Administração Indireta
- **Teto Remuneratório (Art. 37, XI e § 9º)**:
  - Aplica-se a Autarquias e Fundações Públicas
  - Para Empresas Públicas e SEM: Aplica-se apenas se receberem recursos da Fazenda para custeio de pessoal/gerais (estatais dependentes)
- **Vedação de Acumulação Remunerada (Art. 37, XVII)**:
  - Estende-se a cargos, empregos e funções em toda a Administração Indireta
- **Licitações (Art. 37, XXI)**:
  - Autarquias e Fundações seguem a Lei 14.133/2021
  - Empresas Públicas e SEM seguem a Lei 13.303/2016 (Estatuto das Estatais)
- **Controle Externo**: Todas prestam contas obrigatoriamente ao Tribunal de Contas respectivo

## 🏛️ Eixo 5: Teoria Geral das Autarquias
### 1. Conceito e Criação Legal
- **Conceito Legal (Art. 5º, I do DL 200/1967)**:
  - Serviço autônomo, criado por lei, com personalidade jurídica de direito público, patrimônio e receita próprios
  - Finalidade: Executar atividades típicas da Administração Pública que requeiram gestão administrativa e financeira descentralizada
- **Modo de Nascimento**:
  - **Criadas DIRETAMENTE por lei específica**
  - Adquirem personalidade jurídica no momento da vigência da lei (não necessitam de registro em cartório!)

### 2. Regime Jurídico Autárquico
- **Natureza dos Bens**:
  - Bens públicos (de uso especial ou dominicais)
  - Prerrogativas: Impenhorabilidade, imprescritibilidade (não sujeitos a usucapião) e inalienabilidade relativa
- **Execução de Dívidas e Débitos**:
  - Submetem-se ao regime constitucional de **Precatórios e Requisições de Pequeno Valor - RPV** (CF, Art. 100)
  - Não sofrem penhora de bens nem bloqueio judicial de contas ordinárias
- **Regime de Pessoal**:
  - Submetem-se ao **Regime Jurídico Único (RJU)** de natureza estatutária (Lei 8.112/90 na esfera federal)
  - Servidores estáveis após 3 anos de estágio probatório e avaliação de desempenho
- **Imunidade Tributária Recíproca (CF, Art. 150, VI, 'a' e § 2º)**:
  - Extensiva às autarquias quanto ao patrimônio, renda e serviços vinculados às suas finalidades essenciais
- **Prerrogativas Processuais em Juízo**:
  - Prazo em dobro para todas as manifestações processuais (CPC, Art. 183)
  - Remessa Necessária / Duplo Grau Obrigatório de Jurisdição (CPC, Art. 496)
  - Isenção de custas judiciais e preparo recursal
  - Prescrição quinquenal de dívidas passivas (Decreto nº 20.910/1932)

## ⚖️ Eixo 6: Autarquias Especiais e Conselhos Profissionais
### 1. Autarquias sob Regime Especial
- Autarquias dotadas de prerrogativas adicionais outorgadas pela lei instituidora para reforçar sua autonomia
- **Universidades Federais (CF, Art. 207)**:
  - Gozam de autonomia didático-científica, administrativa e de gestão financeira e patrimonial
- **Banco Central do Brasil - BACEN (LC nº 179/2021)**:
  - Autonomia técnica, operacional, administrativa e financeira
  - Ausência de vinculação a Ministério (vinculado diretamente ao Conselho Monetário Nacional)
  - Mandatos fixos e não coincidentes de 4 anos para Presidente e Diretores, com início no 3º ano de mandato do Presidente da República

### 2. Conselhos de Fiscalização Profissional vs. OAB
- **Conselhos Profissionais em Geral (CRM, CREA, CRC, CRO, etc.)**:
  - Natureza Jurídica: **Autarquias corporativas federais**
  - Anuidades cobradas possuem natureza jurídica de **TRIBUTO** (contribuições de interesse de categorias profissionais)
  - Sujeição obrigatória à fiscalização do **Tribunal de Contas da União (TCU)**
  - Regime de pessoal: Empregados públicos submetidos à CLT com admissão obrigatória por **Concurso Público** (ADC 36 STF)
- **Ordem dos Advogados do Brasil - OAB (Conselho Federal e Seccionais)**:
  - Natureza Jurídica: **Entidade pública sui generis de índole constitucional** (STF - ADI 3.026)
  - **NÃO INTEGRA A ADMINISTRAÇÃO INDIRETA**
  - Suas anuidades NÃO possuem natureza tributária
  - **NÃO se submete à prestação de contas perante o TCU**
  - **NÃO exige concurso público** para contratação de seus funcionários

---

## ⚡ Eixo 7: Agências Reguladoras e Agências Executivas
### 1. Agências Reguladoras (A Lei Geral nº 13.848/2019)
- **Natureza Jurídica**: Autarquias de regime especial voltadas à regulação técnica e fiscalização setorial (ANATEL, ANEEL, ANVISA, ANP)
- **Garantias Institucionais de Independência**:
  - Direção Colegiada com nomeação pelo Presidente após aprovação prévia em **sabatina pelo Senado Federal**
  - **Mandato fixo de 5 anos**, não coincidente, **vedada expressamente a recondução** (Art. 6º da Lei 13.848/2019)
  - Perda de mandato somente por renúncia, condenação penal transitada em julgado ou processo administrativo disciplinar
  - **Quarentena**: Proibição de exercer atividade no setor regulado por 6 meses após o término do mandato (com remuneração compensatória)

### 2. Agências Executivas (Qualificação Especial)
- **NÃO são uma nova pessoa jurídica ou categoria de entidade!**
- Trata-se de um **STATUS ou QUALIFICAÇÃO JURÍDICA** outorgada pelo Poder Executivo
- Beneficiários: Exclusivamente **Autarquias ou Fundações Públicas** preexistentes
- **Requisitos Cumulativos**:
  - Ter celebrado **Contrato de Gestão** com o Ministério supervisor, com prazo mínimo de vigência de 1 ano
  - Ter plano estratégico institucional de reestruturação e modernização operacional aprovado
- **Prerrogativa Especial**:
  - Dobra dos limites de valor para dispensa de licitação em razão do valor (Lei 14.133/2021, Art. 75, § 2º)

## 🎯 Eixo 8: Radar de Pegadinhas Cebraspe & FGV
### 1. Decodificação de Oposições Binárias Frequentes
- **Desconcentração vs. Descentralização**:
  - Desconcentração = Distribuição INTERNA de competências dentro da mesma pessoa jurídica (cria órgãos, mantém subordinação)
  - Descentralização = Transferência de atribuições para OUTRA pessoa jurídica (cria entidades, relação de tutela/vinculação)
- **Outorga vs. Delegação**:
  - Outorga = Transfere Titularidade + Execução; feita por LEI; por prazo indeterminado (para Autarquias)
  - Delegação = Transfere apenas a Execução; feita por CONTRATO/ATO; por prazo determinado (para Particulares)
- **Criação por Lei vs. Autorização Legal**:
  - Autarquias: Criadas DIRETAMENTE por lei específica (personalidade pública imediata)
  - Estatais e Fundações Privadas: Criação apenas AUTORIZADA por lei (personalidade privada surge com o registro em cartório)
- **Órgão Público vs. Entidade Administrativa**:
  - Órgãos: Centros de competência desprovidos de personalidade jurídica própria e sem patrimônio próprio
  - Entidades: Pessoas jurídicas autônomas, dotadas de patrimônio, orçamento e personalidade próprios
- **OAB vs. Demais Conselhos de Classe**:
  - OAB: Entidade sui generis fora da Adm. Indireta, sem concurso, sem TCU
  - Demais Conselhos: Autarquias federais, com concurso público (CLT) e fiscalização obrigatória do TCU
- **Agência Reguladora vs. Agência Executiva**:
  - Reguladora = Autarquia sob regime especial criada por LEI com dirigentes em mandato fixo de 5 anos
  - Executiva = MERA QUALIFICAÇÃO por Decreto para autarquia/fundação com Contrato de Gestão

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
