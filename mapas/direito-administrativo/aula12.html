  <script id="markdown-source" type="text/markdown">
# 📚 Direito Administrativo: Aula 12 - Servidores Públicos

## 👥 Eixo 1: Ontologia dos Agentes Públicos e Classificação Quíntupla
### 1. A Teoria do Órgão e a Imputação Volitiva
- Teoria de Otto Gierke: A vontade do agente público é imputada diretamente à pessoa jurídica de direito público
- Princípio da Proteção da Confiança: Atos praticados por agente de fato permanecem válidos perante terceiros de boa-fé

### 2. Classificação Quíntupla dos Agentes Públicos
- **1. Agentes Políticos**: Formulam as políticas fundamentais do Estado (Chefes do Executivo, Parlamentares, Magistrados, MP)
- **2. Agentes Administrativos**: Vínculo funcional remunerado (Estatutários, Celetistas de estatais e Contratados Temporários)
- **3. Agentes Honoríficos**: Cidadãos convocados transitoriamente para colaborar com a cidadania (Jurados, Mesários)
- **4. Agentes Delegados**: Particulares que executam serviços públicos em nome próprio e por sua conta e risco (Concessionários, Tabeliães)
- **5. Agentes Credenciados**: Recebem delegação especial para representar o Estado em missão oficial específica

---

## 🏢 Eixo 2: Cargos, Empregos e Funções Públicas (CF art. 37)
### 1. Estrutura Jurídica Tripartite
- **Cargos Públicos**: Regime estatutário (Administração Direta e Autárquica); Efetivos (concurso) ou Em Comissão (livre nomeação e exoneração)
- **Empregos Públicos**: Regime celetista (CLT), típico das empresas estatais; exigem concurso mas **não adquirem estabilidade do art. 41**
- **Funções de Confiança (FC)**: Exclusivas de servidores ocupantes de **cargo efetivo** para direção, chefia e assessoramento

### 2. Criação e Extinção de Cargos
- Criação e aumento de remuneração exigem **LEI EM SENTIDO ESTRITO** de iniciativa privativa do Chefe do Poder
- Extinção de cargos quando **VAGOS** pode ser realizada por **Decreto Autônomo** (CF art. 84, VI, 'b')

---

## 📝 Eixo 3: Concurso Público, Nomeação, Posse e Exercício
### 1. O Concurso Público e o Tema 161 do STF
- Validade: Até **2 anos**, prorrogável uma única vez por igual período
- Candidatos aprovados **DENTRO DO NÚMERO DE VAGAS** do edital possuem **direito subjetivo líquido e certo à nomeação** durante a validade!

### 2. O Ciclo de Ingresso no Cargo
- **Nomeação**: Única forma originária de provimento (ato convocatório unilateral)
- **Posse**: Ato formal de **INVESTIDURA** com a aceitação expressa dos deveres (prazo: 30 dias na Lei 8.112)
- **Exercício**: O efetivo desempenho das atribuições do cargo (prazo: 15 dias da posse)

---

## 🛡️ Eixo 4: Estágio Probatório, Estabilidade e Perda do Cargo Público
### 1. Requisitos para a Estabilidade Constitucional (CF art. 41)
- 1. Aprovação em concurso público para cargo de provimento efetivo
- 2. **3 (três) anos de efetivo exercício** (Súmula 21 STF)
- 3. Aprovação em **Avaliação Especial de Desempenho** por comissão própria

### 2. Hipóteses Constitucionais Taxativas de Perda do Cargo do Estável
- 1. Sentença judicial transitada em julgado
- 2. Processo Administrativo Disciplinar (PAD) com ampla defesa
- 3. Procedimento de avaliação periódica de desempenho (Lei Complementar)
- 4. Excesso de despesas com pessoal (art. 169 §4º da CF)

---

## 🔄 Eixo 5: Formas de Provimento e Formas de Vacância (Lei 8.112/1990)
### 1. Formas de Provimento Derivado
- **Promoção**: Ascensão dentro da mesma carreira para classe superior
- **Readaptação**: Investidura em cargo compatível com a limitação de capacidade física ou mental superveniente
- **Reversão**: Retorno do aposentado ao serviço ativo (de ofício no interesse público ou voluntária)
- **Reintegração**: Retorno do estável demitido ilegalmente, com **ressarcimento integral** de vencimentos!
- **Recondução**: Retorno do servidor estável ao cargo anterior em virtude de inabilitação em estágio ou reintegração do antigo ocupante
- **Aproveitamento**: Retorno do servidor em disponibilidade a cargo compatível
- 🚨 **Súmula Vinculante 43**: É inconstitucional provimento que transfira servidor para carreira diversa (vedação de ascensão)!

### 2. Formas de Vacância
- Exoneração, Demissão (punição disciplinar), Promoção, Readaptação, Aposentadoria, Posse em cargo inacumulável e Falecimento

---

## 💰 Eixo 6: Regime Remuneratório, Teto Constitucional e Acumulação de Cargos
### 1. Teto e Subtetos Remuneratórios (CF art. 37, XI)
- Teto Geral Federal: Subsídio dos Ministros do STF
- Subtetos Estaduais: Governador (Executivo), Deputados Estaduais (Legislativo) e Desembargadores do TJ (Judiciário - limitado a 90,25%)

### 2. Acumulação Lícita de Cargos (CF art. 37, XVI)
- Regra: Vedada acumulação remunerada. Exceções (havendo compatibilidade de horários):
  - 2 cargos de Professor
  - 1 cargo de Professor + 1 cargo Técnico ou Científico
  - 2 cargos ou empregos privativos de Profissionais de Saúde com profissão regulamentada
- **Incidência do Teto (Temas 377 e 384 STF)**: Em acumulações lícitas, o teto do STF incide **ISOLADAMENTE** em cada cargo!

---

## 🚨 Eixo 7: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Demissão vs. Exoneração
- 🚨 **Pegadinha Clássica**: Tratar demissão como termo neutro de encerramento de vínculo.
- ✅ **Regra**: Demissão é penalidade disciplinar punitiva; exoneração não tem caráter punitivo!

### 2. Teto em Vínculos de Saúde
- 🚨 **Pegadinha Clássica**: Somar os dois salários de médico e aplicar o corte do teto sobre o valor total.
- ✅ **Regra**: STF pacificou: O teto constitucional incide isoladamente sobre cada remuneração!
  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
