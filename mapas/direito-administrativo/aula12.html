<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 12 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA POR NÍVEL HIERÁRQUICO (Alto contraste definitivo) */
    .markmap-node text {
      fill: #f8fafc !important;
    }
    .markmap-foreign {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
      color: #f1f5f9 !important;
    }
    .markmap-foreign div,
    .markmap-foreign span,
    .markmap-foreign p {
      color: inherit;
    }
    
    /* Nível 0: Título Raiz */
    .markmap-node[data-depth="0"] .markmap-foreign div {
      font-size: 16px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8) !important;
    }

    /* Nível 1: Eixos Temáticos */
    .markmap-node[data-depth="1"] .markmap-foreign div {
      font-size: 14.5px !important;
      font-weight: 700 !important;
      color: #38bdf8 !important;
      white-space: nowrap !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7) !important;
    }

    /* Nível 2: Subtópicos */
    .markmap-node[data-depth="2"] .markmap-foreign div {
      font-size: 13.5px !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
    }

    /* Nível 3+: Bullets e Detalhes */
    .markmap-node[data-depth="3"] .markmap-foreign div,
    .markmap-node[data-depth="4"] .markmap-foreign div,
    .markmap-node[data-depth="5"] .markmap-foreign div {
      font-size: 12.5px !important;
      font-weight: 400 !important;
      color: #e2e8f0 !important;
      line-height: 1.55 !important;
    }

    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }

    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal !important;
    }

    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 12 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 12 - Antigravity)

## 👥 Eixo 1: Ontologia dos Agentes Públicos e Classificação Quíntupla
### 1. A Teoria do Órgão e a Imputação Volitiva
- Teoria de Otto Gierke: A vontade do agente público é imputada diretamente à pessoa jurídica de direito público
- Princípio da Proteção da Confiança: Atos praticados por agente de fato permanecem válidos perante terceiros de boa-fé

### 2. Classificação Quíntupla dos Agentes Públicos
- **1. Agentes Políticos**: Formulam as políticas fundamentais do Estado (Chefes do Executivo, Parlamentares, Magistrados, MP)
- **2. Agentes Administrativos**: Vínculo funcional remunerado (Estatutários, Celetistas de estatais e Contratados Temporários)
- **3. Agentes Honoríficos**: Cidadãos convocados transitoriamente para colaborar com a cidadania (Jurados, Mesários)
- **4. Agentes Delegados**: Particulares que executam serviços públicos em nome próprio e por sua conta e risco (Concessionários, Tabeliães)
- **5. Agentes Credenciados**: Recebem delegação especial para representar o Estado em missão oficial específica

---

## 🏢 Eixo 2: Cargos, Empregos e Funções Públicas (CF art. 37)
### 1. Estrutura Jurídica Tripartite
- **Cargos Públicos**: Regime estatutário (Administração Direta e Autárquica); Efetivos (concurso) ou Em Comissão (livre nomeação e exoneração)
- **Empregos Públicos**: Regime celetista (CLT), típico das empresas estatais; exigem concurso mas **não adquirem estabilidade do art. 41**
- **Funções de Confiança (FC)**: Exclusivas de servidores ocupantes de **cargo efetivo** para direção, chefia e assessoramento

### 2. Criação e Extinção de Cargos
- Criação e aumento de remuneração exigem **LEI EM SENTIDO ESTRITO** de iniciativa privativa do Chefe do Poder
- Extinção de cargos quando **VAGOS** pode ser realizada por **Decreto Autônomo** (CF art. 84, VI, 'b')

---

## 📝 Eixo 3: Concurso Público, Nomeação, Posse e Exercício
### 1. O Concurso Público e o Tema 161 do STF
- Validade: Até **2 anos**, prorrogável uma única vez por igual período
- Candidatos aprovados **DENTRO DO NÚMERO DE VAGAS** do edital possuem **direito subjetivo líquido e certo à nomeação** durante a validade!

### 2. O Ciclo de Ingresso no Cargo
- **Nomeação**: Única forma originária de provimento (ato convocatório unilateral)
- **Posse**: Ato formal de **INVESTIDURA** com a aceitação expressa dos deveres (prazo: 30 dias na Lei 8.112)
- **Exercício**: O efetivo desempenho das atribuições do cargo (prazo: 15 dias da posse)

---

## 🛡️ Eixo 4: Estágio Probatório, Estabilidade e Perda do Cargo Público
### 1. Requisitos para a Estabilidade Constitucional (CF art. 41)
- 1. Aprovação em concurso público para cargo de provimento efetivo
- 2. **3 (três) anos de efetivo exercício** (Súmula 21 STF)
- 3. Aprovação em **Avaliação Especial de Desempenho** por comissão própria

### 2. Hipóteses Constitucionais Taxativas de Perda do Cargo do Estável
- 1. Sentença judicial transitada em julgado
- 2. Processo Administrativo Disciplinar (PAD) com ampla defesa
- 3. Procedimento de avaliação periódica de desempenho (Lei Complementar)
- 4. Excesso de despesas com pessoal (art. 169 §4º da CF)

---

## 🔄 Eixo 5: Formas de Provimento e Formas de Vacância (Lei 8.112/1990)
### 1. Formas de Provimento Derivado
- **Promoção**: Ascensão dentro da mesma carreira para classe superior
- **Readaptação**: Investidura em cargo compatível com a limitação de capacidade física ou mental superveniente
- **Reversão**: Retorno do aposentado ao serviço ativo (de ofício no interesse público ou voluntária)
- **Reintegração**: Retorno do estável demitido ilegalmente, com **ressarcimento integral** de vencimentos!
- **Recondução**: Retorno do servidor estável ao cargo anterior em virtude de inabilitação em estágio ou reintegração do antigo ocupante
- **Aproveitamento**: Retorno do servidor em disponibilidade a cargo compatível
- 🚨 **Súmula Vinculante 43**: É inconstitucional provimento que transfira servidor para carreira diversa (vedação de ascensão)!

### 2. Formas de Vacância
- Exoneração, Demissão (punição disciplinar), Promoção, Readaptação, Aposentadoria, Posse em cargo inacumulável e Falecimento

---

## 💰 Eixo 6: Regime Remuneratório, Teto Constitucional e Acumulação de Cargos
### 1. Teto e Subtetos Remuneratórios (CF art. 37, XI)
- Teto Geral Federal: Subsídio dos Ministros do STF
- Subtetos Estaduais: Governador (Executivo), Deputados Estaduais (Legislativo) e Desembargadores do TJ (Judiciário - limitado a 90,25%)

### 2. Acumulação Lícita de Cargos (CF art. 37, XVI)
- Regra: Vedada acumulação remunerada. Exceções (havendo compatibilidade de horários):
  - 2 cargos de Professor
  - 1 cargo de Professor + 1 cargo Técnico ou Científico
  - 2 cargos ou empregos privativos de Profissionais de Saúde com profissão regulamentada
- **Incidência do Teto (Temas 377 e 384 STF)**: Em acumulações lícitas, o teto do STF incide **ISOLADAMENTE** em cada cargo!

---

## 🚨 Eixo 7: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Demissão vs. Exoneração
- 🚨 **Pegadinha Clássica**: Tratar demissão como termo neutro de encerramento de vínculo.
- ✅ **Regra**: Demissão é penalidade disciplinar punitiva; exoneração não tem caráter punitivo!

### 2. Teto em Vínculos de Saúde
- 🚨 **Pegadinha Clássica**: Somar os dois salários de médico e aplicar o corte do teto sobre o valor total.
- ✅ **Regra**: STF pacificou: O teto constitucional incide isoladamente sobre cada remuneração!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 650,
        spacingVertical: 20,
        spacingHorizontal: 120,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
