<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 11 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA E ALTO CONTRASTE (Adequação total ao fundo escuro) */
    .markmap-foreign {
      color: #f8fafc !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
    }
    .markmap-foreign div {
      color: #f8fafc !important;
    }
    .markmap-foreign h1 {
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 16px !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      letter-spacing: -0.01em;
    }
    .markmap-foreign h2 {
      color: #38bdf8 !important;
      font-weight: 700 !important;
      font-size: 14.5px !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    }
    .markmap-foreign h3 {
      color: #a5b4fc !important;
      font-weight: 600 !important;
      font-size: 13.5px !important;
    }
    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }
    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal;
    }
    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 11 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 11 - Antigravity)

## ⚖️ Eixo 1: Fundamento Constitucional, Competências e Espécies
### 1. Fundamento Constitucional da Intervenção
- **Direito de Propriedade Relativizado**: Garantido pelo art. 5º, XXII, mas condicionado à sua **Função Social** (art. 5º, XXIII e art. 170, III da CF)
- A propriedade particular possui função social ativa e subordina-se ao bem-estar e interesse público

### 2. A Dicotomia Central: Intervenções Restritivas vs. Supressivas
- **Intervenções Restritivas**: O Estado condiciona ou restringe faculdades de uso e gozo, mas o domínio continua com o particular (Servidão, Requisição, Ocupação, Limitação e Tombamento)
- **Intervenções Supressivas**: O Estado retira coercitivamente a propriedade do particular, transferindo-a para o patrimônio público (**Desapropriação**)

### 3. Repartição de Competências Federativas
- **Competência Legislativa**: Privativa da **UNIÃO** para legislar sobre desapropriação (CF art. 22, II)
- **Competência Executória (Material)**: Concorrente entre União, Estados, DF e Municípios para decretar e executar

---

## 📐 Eixo 2: Matriz Comparativa das Cinco Intervenções Restritivas
### 1. Servidão Administrativa
- **Conceito**: Direito real público sobre coisa alheia instituído em favor de bem público ou serviço público (ex: torres de energia, oleodutos)
- **Indenização**: Prévia, mas **somente se houver prejuízo efetivo** ao prédio serviente
- **Registro**: Exige averbação no Cartório de Registro de Imóveis (RGI)

### 2. Requisição Administrativa (CF art. 5º, XXV)
- **Pressuposto Único**: **IMINENTE PERIGO PÚBLICO** (guerras, catástrofes, epidemias)
- **Objeto**: Bens móveis, imóveis ou serviços privados
- **Indenização**: **ULTERIOR** e apenas se houver dano efetivo

### 3. Ocupação Temporária
- Utilização temporária e transitória de imóvel particular não edificado como apoio operacional à execução de obras públicas vizinhas
- Indenização proporcional ao tempo e aos prejuízos causados

### 4. Limitação Administrativa
- Imposição de obrigações de caráter **GERAL, abstratas e unilaterais** a todos os proprietários de determinada área (poder de polícia)
- Exemplos: Recuo obrigatório de 5m de fachada urbana, limite máximo de altura de edificações
- **Regra**: É **GRATUITA** (não gera direito à indenização pecuniária)

### 5. Tombamento (Decreto-Lei 25/1937)
- Proteção e preservação do patrimônio histórico, artístico, cultural ou paisagístico
- **Efeitos**: O proprietário mantém a propriedade, a posse e pode vender o bem tombado
- O Poder Público detém **Direito de Preferência** na aquisição em caso de venda

---

## 🚜 Eixo 3: Desapropriação Comum (Ordinária - DL 3.365/1941)
### 1. O Tripé Constitucional da Desapropriação Comum (Art. 5º, XXIV)
- **Motivos**: Necessidade Pública, Utilidade Pública ou Interesse Social
- **Indenização**: **PRÉVIA, JUSTA e em DINHEIRO**

### 2. O Procedimento Bifásico
- **1ª Fase - Declaratória**: Decreto do Chefe do Executivo declarando o bem de utilidade ou interesse público
  - *Prazo de Caducidade*: 5 anos na utilidade pública e 2 anos no interesse social
- **2ª Fase - Executória**: Administrativa (acordo consensual) ou Judicial (Ação de Desapropriação)
  - No Judiciário, debate-se apenas o **valor da indenização e vício processual**

### 3. Desapropriação por Zona e Hierarquia de Bens Públicos
- **Desapropriação por Zona**: Abrange área maior que a obra pública para absorver a valorização imobiliária
- **Ordem Federativa Descendente (Art. 2º §2º)**:
  - 🔺 União desapropria bens de Estados, DF e Municípios
  - 🔹 Estados desapropriam bens de seus Municípios (com autorização legal estadual)
  - ❌ **Municípios NUNCA desapropriam bens de Estados ou da União**!

---

## 🚨 Eixo 4: As Três Desapropriações Constitucionais Especiais
### 1. Desapropriação Urbana (Sanção - CF art. 182 §4º)
- Imóvel urbano que descumpre a função social do Plano Diretor
- Rito gradual: Notificação -> IPTU progressivo no tempo -> Desapropriação com **TÍTULOS DA DÍVIDA PÚBLICA MUNICIPAL** (resgate em até **10 anos**)

### 2. Desapropriação Rural (Reforma Agrária - CF art. 184)
- **Competência EXCLUSIVA da União** sobre imóvel rural improdutivo
- Pagamento em **TÍTULOS DA DÍVIDA AGRÁRIA (TDA)** com resgate em até **20 anos**
- Benfeitorias úteis e necessárias pagas em **DINHEIRO** vivo!
- Imunidades: Propriedade produtiva e pequena/média propriedade rural (CF art. 185)

### 3. Desapropriação Confiscatória / Expropriatória (CF art. 243)
- Imóveis rurais ou urbanos onde se verifique cultivo de psicotrópicos ilegais ou exploração de **trabalho escravo**
- Confisco direto **SEM QUALQUER DIREITO À INDENIZAÇÃO**!

---

## 🔄 Eixo 5: Desapropriação Indireta, Tredestinação e Retrocessão
### 1. Desapropriação Indireta (Apossamento Fático Administrativo)
- O Estado se apropria faticamente do imóvel privado sem o devido processo legal regular
- Incorporado o bem, não cabe reintegração de posse; resta a ação indenizatória por perdas e danos

### 2. Tredestinação Lícita vs. Ilícita e Retrocessão (CC art. 519)
- **Tredestinação Lícita**: Mudança de plano que mantém outra destinação pública (é válida!)
- **Tredestinação Ilícita**: Desvio para finalidade puramente privada ou abandono -> gera o **Direito de Retrocessão** (devolver o bem ao proprietário mediante restituição do preço pago)

---

## 🚨 Eixo 6: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Desapropriação de Bens de Outros Entes
- 🚨 **Pegadinha Clássica**: Dizer que município pode desapropriar imóvel estadual se pagar em dinheiro.
- ✅ **Regra**: Hierarquia federativa rígida: Município JAMAIS pode desapropriar bem de Estado ou da União!

### 2. Indenização na Requisição
- 🚨 **Pegadinha Clássica**: Exigir indenização prévia para a requisição administrativa.
- ✅ **Regra**: Requisição administrativa só indeniza ULTERIORMENTE e se houver dano efetivo!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 550,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
