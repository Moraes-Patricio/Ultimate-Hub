# 🏡 Intervenção do Estado na Propriedade (Aula 11)

## ⚖️ 1. Fundamento Constitucional & Competências
### 📜 1.1 Princípios Vetores (CF/88)
- **Direito de Propriedade**: Garantido pelo art. 5º, XXII, mas relativizado pela **Função Social da Propriedade** (art. 5º, XXIII e art. 170, III)
- A propriedade não é mais um direito absoluto: vincula-se ao bem-estar coletivo
### 🔀 1.2 Dicotomia Central: Restritiva vs. Supressiva
- **Intervenção Restritiva**: O Estado impõe restrições, encargos ou condicionamentos ao uso, mantendo o domínio com o particular (Servidão, Requisição, Ocupação, Limitação e Tombamento)
- **Intervenção Supressiva**: O Estado transfere coercitivamente a propriedade do particular para o patrimônio público (**Desapropriação**)
### 🏛️ 1.3 Matriz de Competências
- **Legislativa**: Competência **PRIVATIVA DA UNIÃO** para legislar sobre desapropriação (CF, art. 22, II)
- **Executória (Material)**: Concorrente entre União, Estados, DF e Municípios para decretar e executar as intervenções

## 📐 2. As Cinco Intervenções Restritivas
### ⚡ 2.1 Servidão Administrativa
- **Conceito**: Direito real público sobre coisa alheia instituído em favor de serviço público ou bem público
- **Exemplos**: Passagem de linhas de transmissão elétrica, gasodutos, aquedutos
- **Indenização**: Prévia, mas **apenas se houver prejuízo efetivo** ao imóvel serviente (se não houver prejuízo, nada se indeniza)
- **Registro**: Exige averbação no Cartório de Registro de Imóveis (RGI), salvo se decorrer diretamente de lei
### 🚨 2.2 Requisição Administrativa (CF art. 5º, XXV)
- **Pressuposto Fático Único**: **IMINENTE PERIGO PÚBLICO** (guerra, calamidade pública, epidemias)
- **Objeto**: Bens móveis, imóveis ou serviços de particulares
- **Indenização**: **ULTERIOR (Posterior)** e apenas se houver dano efetivo
- Natureza transitória; independe de prévia autorização judicial
### 🚧 2.3 Ocupação Temporária
- Utilização transitória e remunerada de propriedade privada particular para apoiar a execução de obras e serviços públicos
- Exemplo: Terreno vizinho utilizado como canteiro de obras para construção de hospital ou viaduto
- Indenização devida pelos prejuízos e pelo tempo de ocupação
### 🛑 2.4 Limitação Administrativa
- Imposição de **obrigações de caráter GERAL, abstratas e indeterminadas** a todos os proprietários de uma dada região
- Fundamento: Poder de Polícia geral do Estado
- Exemplos: Recuo obrigatório de 5 metros na fachada urbana, gabarito máximo de altura de prédios
- **Regra da Indenização**: É **GRATUITA** (não gera direito a qualquer indenização, pois afeta a todos igualmente)
### 🏛️ 2.5 Tombamento (Decreto-Lei 25/1937)
- Proteção do patrimônio histórico, artístico, cultural, paisagístico ou arqueológico
- **Objeto**: Bens móveis ou imóveis, materiais ou imateriais, públicos ou privados
- **Efeitos sobre o Proprietário**:
  - Proprietário mantém a titularidade, posse e uso (não perde a propriedade)
  - Pode vender, doar ou hipotecar (alienação válida), mas o Poder Público tem **Direito de Preferência** na venda judicial ou amigável
  - Dever de conservação: Se não tiver recursos, deve comunicar o Poder Público para que faça a obra
  - Veda destruição, mutilação ou alteração sem autorização prévia do IPHAN/órgão competente

## 🚜 3. Desapropriação Comum (Ordinária - DL 3.365/1941)
### 💰 3.1 Tripé Constitucional (CF art. 5º, XXIV)
- **1. Motivos**: *Necessidade Pública*, *Utilidade Pública* ou *Interesse Social*
- **2. Indenização**: **PRÉVIA, JUSTA e em DINHEIRO**
- **3. Procedimento**: Mediante processo administrativo ou judicial
### 🔄 3.2 O Procedimento Bifásico
- **1ª Fase - Declaratória**:
  - Expropriante emite Decreto Expropriatório declarando o bem de utilidade/interesse público
  - Fixa o estado do imóvel e autoriza ingresso das autoridades
  - *Prazo de Caducidade*: **5 anos** para utilidade pública e **2 anos** para interesse social
- **2ª Fase - Executória (Expropriatória)**:
  - Administrativa (acordo amigável sobre o valor) OU Judicial (Ação de Desapropriação)
  - Na ação judicial: O juiz discute **exclusivamente o valor da indenização e vício formal** (vedado debater se a desapropriação é conveniente)
### 📐 3.3 Desapropriação por Zona (DL 3.365/41, art. 4º)
- Desapropriação que abrange área superior à estritamente necessária à obra pública
- Finalidades lícitas:
  - 1. Execução de obras complementares e plano de urbanização
  - 2. Absorção da extraordinária valorização imobiliária gerada pela obra pública para revenda futura!
### 🏛️ 3.4 Desapropriação de Bens Públicos: A Ordem Federativa Descendente (Art. 2º §2º)
- **Regra Absoluta da Hierarquia Federativa**:
  - 🔺 A **UNIÃO** pode desapropriar bens dos Estados, DF e Municípios
  - 🔹 Os **ESTADOS** podem desapropriar bens dos seus Municípios (com autorização legislativa estadual)
  - ❌ Os **MUNICÍPIOS NUNCA** podem desapropriar bens de Estados ou da União!
  - ❌ Os Estados NUNCA podem desapropriar bens da União nem de outros Estados!
  - Exige prévia autorização legislativa do ente expropriante!

## 🚨 4. As Três Desapropriações Especiais / Extraordinárias
### 🏙️ 4.1 Desapropriação Urbana (Sanção - CF art. 182 §4º)
- **Hipótese**: Imóvel urbano que não cumpre a função social (subutilizado, não edificado ou não utilizado) segundo o Plano Diretor
- **Rito Gradual Obrigatório (Escadinha)**:
  - 1º Parcelamento ou edificação compulsórios
  - 2º IPTU progressivo no tempo (por até 5 anos consecutivos, alíquota máxima de 15%)
  - 3º **Desapropriação com pagamento em TÍTULOS DA DÍVIDA PÚBLICA MUNICIPAL** (resgatáveis em até **10 anos**)
### 🌾 4.2 Desapropriação Rural (Reforma Agrária - CF art. 184)
- **Competência**: **EXCLUSIVA DA UNIÃO** (Estados e Municípios não desapropriam para reforma agrária!)
- **Hipótese**: Imóvel rural que não cumpre sua função social (produtividade + meio ambiente + relações de trabalho)
- **Indenização**: **TÍTULOS DA DÍVIDA AGRÁRIA (TDA)** com resgate em até **20 anos**
- **Exceção em Dinheiro**: Benfeitorias úteis e necessárias são pagas em **DINHEIRO vivo**!
- **Imunidades**: Pequena e média propriedade rural e a **propriedade produtiva** são insuscetíveis de desapropriação para reforma agrária (CF art. 185)
### 💥 4.3 Desapropriação Confiscatória / Expropriatória (CF art. 243)
- **Hipótese**: Imóveis urbanos ou rurais utilizados para cultivo de plantas psicotrópicas ilegais ou exploração de **trabalho escravo**
- **Indenização**: **NENHUMA (Confisco total do bem sem qualquer direito a indenização!)**
- Os bens revertem integralmente a fundo especial destinado ao tratamento de usuários e segurança pública

## 🔄 5. Desapropriação Indireta, Tredestinação & Retrocessão
### 🚨 5.1 Desapropriação Indireta (Apossamento Administrativo)
- O Poder Público se apossa fisicamente de imóvel privado para obra pública sem processo expropriatório regular prévio (verdadeiro esbulho possessório estatal)
- Incorporado o bem ao patrimônio público, **não cabe reintegração de posse nem devolução** (art. 35 do DL 3.365/41)
- Resta ao proprietário ajuizar **Ação de Desapropriação Indireta** (indenizatória por perdas e danos)
### 🔀 5.2 Tredestinação Lícita vs. Ilícita
- **Tredestinação Lícita**: O Estado muda a destinação inicialmente declarada do bem, mas o mantém afetado a **OUTRA FINALIDADE PÚBLICA** (ex: ia construir escola e constrói hospital público). É 100% válida!
- **Tredestinação Ilícita**: O Estado desvia o bem para benefício privado, vende a particular ou abandona sem finalidade pública.
### 🔙 5.3 O Direito de Retrocessão (CC art. 519)
- Configurada a tredestinação ilícita, surge o **Direito de Retrocessão**:
  - Direito real de o antigo proprietário exigir o imóvel de volta mediante devolução do preço pago atualizado
  - Se o bem for irrecuperável, resolve-se em perdas e danos

## 🚨 6. Radar de Pegadinhas Frequentes (Cebraspe / FGV)
### ⚠️ 6.1 Desapropriação de Município por Estado
- 🚨 **Pegadinha Clássica**: Dizer que município pode desapropriar bem estadual em caso de utilidade pública local urgente.
- ✅ **Regra**: Ordem descendente rígida: Município JAMAIS desapropria bem de Estado ou da União!
### ⚠️ 6.2 Indenização na Requisição Administrativa
- 🚨 **Pegadinha Clássica**: Afirmar que a requisição de bens exige pagamento prévio de indenização.
- ✅ **Regra**: A requisição só indeniza ULTERIORMENTE e APENAS se houver dano efetivo!
### ⚠️ 6.3 Resgate de Títulos: Urbana x Rural
- 🚨 **Pegadinha Clássica**: Inverter os prazos dos títulos da dívida pública.
- ✅ **Regra**: Desapropriação Urbana = Títulos da Dívida Pública até **10 anos**; Desapropriação Rural = TDA até **20 anos**!
### ⚠️ 6.4 Alienabilidade do Bem Tombado
- 🚨 **Pegadinha Clássica**: Dizer que o tombamento torna o bem inalienável pelo particular.
- ✅ **Regra**: Bem tombado PODE SER VENDIDO livremente, respeitado apenas o direito de preferência do Poder Público!

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
