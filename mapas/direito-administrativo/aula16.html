<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 16 - Antigravity)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b1120; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #mindmap { width: 100%; height: 100%; }
    .markmap-node text { fill: #f1f5f9 !important; font-size: 13px; font-weight: 500; }
    .markmap-link { stroke-width: 2px !important; }
    .controls { position: absolute; bottom: 24px; right: 24px; display: flex; gap: 8px; z-index: 100; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 6px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .btn { background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: rgba(255, 255, 255, 0.15); color: #38bdf8; transform: translateY(-1px); }
    .badge { position: absolute; top: 20px; left: 24px; z-index: 100; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 10px 16px; color: #f8fafc; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 16 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 16 - Antigravity)

## ⚖️ Eixo 1: O Novo Regime Jurídico e o Fim da Culpa (Dolo Específico)
### 1. Extinção da Improbidade Culposa (Reforma da Lei 14.230/2021)
- O sistema de improbidade administrativa brasileiro **ABOLIU INTEGRALMENTE A MODALIDADE CULPOSA**
- Não existe mais ato de improbidade culposo, nem mesmo na modalidade de lesão ao erário (antigo art. 10)
- Exige-se indispensavelmente a comprovação de **DOLO ESPECÍFICO** em TODOS os atos de improbidade (arts. 9º, 10 e 11)

### 2. Definição Legal de Dolo Específico (Art. 1º, §§ 2º e 3º)
- Considera-se dolo a vontade livre e consciente de alcançar o resultado ilícito tipificado nos artigos 9º, 10 e 11, **não bastando a voluntariedade do agente**
- O mero exercício da função ou desempenho de competências sem comprovação de ato doloso com fim ilícito afasta a responsabilidade por improbidade
- Divergência interpretativa da lei, fundada em jurisprudência ou doutrina razoável, **NÃO configura ato de improbidade**!

---

## 👥 Eixo 2: Sujeitos Ativo e Passivo e Regime dos Agentes Políticos
### 1. Sujeito Passivo da Improbidade (Art. 1º)
- Administração direta e indireta de todos os Poderes da União, dos Estados, do DF e dos Municípios
- Entidades privadas que recebam subvenção, benefício fiscal ou creditício de órgãos públicos (sanção patrimonial limitada à contribuição estatal)

### 2. Sujeito Ativo (Agente Público e Terceiro)
- **Agente Público (Art. 2º)**: Todo aquele que exerce, ainda que transitoriamente ou sem remuneração, por eleição, nomeação, posse ou contratação, mandato, cargo, emprego ou função
- **Particular / Terceiro (Art. 3º)**: O particular responde por improbidade se **induzir ou concorrer dolosamente** para a prática do ato
  - *Regra de Ouro da Jurisprudência*: Não é cabível ação de improbidade exclusivamente contra o particular; exige-se sempre a presença de agente público no polo passivo!

### 3. Regime Especial dos Agentes Políticos (STF e STJ)
- **Presidente da República**: Responde por **Crime de Responsabilidade** perante o Senado Federal (Lei 1.079/50), não se submetendo à Lei de Improbidade por atos funcionais típicos
- **Demais Agentes Políticos (Governadores, Prefeitos, Ministros, Magistrados e Parlamentares)**: Submetem-se ao regime da Lei de Improbidade Administrativa em concurso com eventuais normas disciplinares/penais

---

## 🗂️ Eixo 3: Tipologia dos Atos de Improbidade (Arts. 9º, 10 e 11)
### 1. Atos que Importam Enriquecimento Ilícito (Art. 9º)
- Gravidade máxima; rol **EXEMPLIFICATIVO** (*numerus apertus*)
- Hipóteses típicas: Receber propina, comissão ou presente; utilizar bens públicos em proveito pessoal; enriquecer sem causa justificada; incorporar bens públicos ao patrimônio particular

### 2. Atos que Causam Prejuízo ao Erário (Art. 10)
- Exige comprovação de **DANO PATRIMONIAL EFETIVO E REAL** (vedado dano presumido / *in re ipsa*!)
- Rol **EXEMPLIFICATIVO** (*numerus apertus*)
- Hipóteses típicas: Facilitar a incorporação de patrimônio público; doar bens públicos sem observar a lei; frustrar licitação com efetivo sobrepreço ou superfaturamento

### 3. Atos que Atentam contra os Princípios da Administração (Art. 11)
- 🚨 **Mudança Radical da Lei 14.230/2021**: O rol do art. 11 passou a ser **TAXATIVO** (*numerus clausus*)!
- Só é improbidade violadora de princípios o que estiver expressamente listado nos incisos do art. 11
- Hipóteses taxativas atuais:
  - Revelar fato ou segredo de que tem ciência em razão das funções
  - Frustrar o caráter concorrencial de concurso público com dolo de beneficiar a si ou a outrem
  - Praticar **Nepotismo** (nomeação de cônjuge, companheiro ou parente até 3º grau para cargo comissionado - Súmula Vinculante 13)
  - Publicidade governamental com promoção pessoal de agente público

---

## 🏛️ Eixo 4: Quadro-Geral de Penalidades da Lei de Improbidade (Art. 12)
### 1. Tabela Comparativa de Sanções
- **Enriquecimento Ilícito (Art. 9º)**:
  - Perda dos bens ou valores acrescidos ilicitamente
  - Perda da função pública (afeta o cargo em que o ato foi praticado)
  - Suspensão dos direitos políticos: **Até 14 (quatorze) anos**
  - Multa civil: Equivalente ao valor do acréscimo patrimonial
  - Proibição de contratar com o Poder Público: **Até 14 anos**
- **Prejuízo ao Erário (Art. 10)**:
  - Ressarcimento integral do dano patrimonial efetivo
  - Perda da função pública
  - Suspensão dos direitos políticos: **Até 12 (doze) anos**
  - Multa civil: Equivalente ao valor do dano
  - Proibição de contratar com o Poder Público: **Até 12 anos**
- **Violação a Princípios (Art. 11)**:
  - Multa civil: De **até 24 (vinte e quatro) vezes o valor da remuneração** do agente
  - Proibição de contratar com o Poder Público: **Até 4 (quatro) anos**
  - 🚨 *Atenção Absoluta*: Na violação de princípios (art. 11), **NÃO HÁ MAIS perda da função pública nem suspensão de direitos políticos**!

---

## 🔒 Eixo 5: Tutela Cautelar da Indisponibilidade de Bens (Art. 16)
### 1. Requisitos para a Decretação da Indisponibilidade
- A decretação da indisponibilidade de bens exige a presença cumulativa de:
  - 1. *Fumus boni iuris* (probabilidade do direito)
  - 2. *Periculum in mora* (perigo de dano ou risco ao resultado útil)
- 🚨 **Fim do Perigo Presumido**: A nova lei acabou com o *periculum in mora* implícito; exige-se demonstrar **perigo concreto de dissipação do patrimônio**!

### 2. Limites da Indisponibilidade de Bens
- A indisponibilidade recai apenas sobre o montante suficiente para assegurar o integral ressarcimento do erário ou devolução do acréscimo ilícito
- **É VEDADO** incidir sobre valores de multa civil!
- Impenhorabilidade legal da poupança até **40 salários mínimos** e bem de família (salvo se fruto direto da improbidade)

---

## 📜 Eixo 6: Ação de Improbidade, Legitimidade e ANPC
### 1. Legitimidade Ativa (ADIs 7.042 e 7.043 do STF)
- A Lei 14.230/21 tentou tornar a legitimidade ativa exclusiva do Ministério Público
- **Decisão do STF**: O STF declarou inconstitucional a exclusividade do MP!
- A legitimidade para propor a ação de improbidade é **CONCORRENTE e DISJUNTIVA**: Cabe ao **Ministério Público** E à **Pessoa Jurídica lesada** (Fazenda Pública)!

### 2. Acordo de Não Continuidade / Não Persecução Cível (ANPC - Art. 17-B)
- É cabível a celebração de Acordo de Não Persecução Cível (ANPC)
- Requisitos mínimos: Reparação integral do dano comprovado e perda da vantagem patrimonial ilícita
- Celebração pelo Ministério Público ou Pessoa Jurídica lesada com homologação judicial

---

## ⏱️ Eixo 7: Regime Prescricional Unificado e Prescrição Intercorrente
### 1. Prazo Prescricional Geral Unificado (Art. 23)
- O prazo de prescrição é de **8 (oito) anos**, contados a partir da data de ocorrência do fato (ou da cessação da permanência nos atos permanentes)
- Fim da regra antiga que vinculava a prescrição ao término do mandato de agentes políticos

### 2. A Prescrição Intercorrente (Art. 23 §4º e §5º)
- A interrupção da prescrição (pelo ajuizamento da ação ou citação) faz reiniciar a contagem do prazo pela metade: **4 (quatro) anos**!
- Se a ação ficar paralisada por mais de 4 anos entre a citação, publicação de sentença ou acórdão condenatório, opera-se a **Prescrição Intercorrente** extinguindo o processo!

---

## 🚨 Eixo 8: Síntese de Armadilhas, Confrontação FGV / Cebraspe e Jurisprudência
### 1. O Fim da Culpa na Improbidade
- 🚨 **Pegadinha Clássica**: Afirmar que o ato praticado com negligência ou imprudência grave que cause prejuízo aos cofres públicos é ato de improbidade.
- ✅ **Regra**: A Lei 14.230/21 eliminou a improbidade culposa! Mesmo para dano ao erário, exige-se DOLO ESPECÍFICO comprovado.

### 2. Taxatividade do Art. 11
- 🚨 **Pegadinha Clássica**: Considerar como ato de improbidade por violação de princípios conduta não prevista nos incisos do art. 11.
- ✅ **Regra**: O rol do art. 11 é taxativo (*numerus clausus*)! Apenas as hipóteses expressas configuram ato ímprobo.

### 3. Penalidades no Art. 11
- 🚨 **Pegadinha Clássica**: Cobrar perda da função pública ou suspensão de direitos políticos na violação do art. 11.
- ✅ **Regra**: No art. 11 NÃO há mais suspensão de direitos políticos nem perda da função pública (somente multa civil e proibição de contratar)!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 380,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
