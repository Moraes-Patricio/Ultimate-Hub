<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 13 - Antigravity)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b1120; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #mindmap { width: 100%; height: 100%; }
    .markmap-node text { fill: #f1f5f9 !important; font-size: 13px; font-weight: 500; }
    .markmap-link { stroke-width: 2px !important; }
    .controls { position: absolute; bottom: 24px; right: 24px; display: flex; gap: 8px; z-index: 100; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 6px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .btn { background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: rgba(255, 255, 255, 0.15); color: #38bdf8; transform: translateY(-1px); }
    .badge { position: absolute; top: 20px; left: 24px; z-index: 100; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 10px 16px; color: #f8fafc; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 13 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 13 - Antigravity)

## 💰 Eixo 1: Sistema Remuneratório, Descontos, Consignações e Reposição ao Erário
### 1. Vencimento vs. Remuneração
- **Vencimento**: Retribuição pecuniária base pelo exercício do cargo público fixada em lei formal
- **Remuneração**: Vencimento básico acrescido das vantagens pecuniárias de caráter permanente

### 2. Reposições ao Erário e a Boa-fé (Tema 531 STF / Súmula 34 TCU)
- Reposições ao erário são descontadas em parcelas mensais de no mínimo **10% da remuneração**
- Valores recebidos indevidamente de **BOA-FÉ** em razão de interpretação errônea da Administração **NÃO DEVEM SER DEVOLVIDOS**!

---

## 🎁 Eixo 2: Vantagens Pecuniárias - A Tríade: Indenizações, Gratificações e Adicionais
### 1. Indenizações (NÃO se incorporam ao vencimento e NÃO sofrem tributação)
- **Ajuda de Custo**: Despesas de mudança permanente de domicílio em caráter permanente (limite de 3 remunerações)
- **Diárias**: Afastamento eventual da sede a serviço (restituição em 5 dias se não viajar)
- **Transporte**: Despesa com veículo próprio para serviços externos
- **Auxílio-Moradia**: Ressarcimento de moradia alugada para cargo em comissão em outra comarca

### 2. Gratificações e Adicionais
- **Gratificação Natalina (13º salário)** e **GECC** (encargo de curso ou concurso)
- **Adicional de Insalubridade vs. Periculosidade**: **VEDADA A CUMULAÇÃO** (servidor deve optar obrigatoriamente por um deles!)
- **Adicional Noturno**: Trabalho entre **22h e 5h** com acréscimo de **25%** e hora reduzida de **52min30s**!
- **Adicional por Serviço Extraordinário**: Mínimo de **50%**, limitado a **2 horas diárias**

---

## 🏖️ Eixo 3: Regime de Férias dos Servidores Públicos (Arts. 77 a 80)
### 1. Regras Operacionais das Férias
- 30 dias por ano de exercício; primeiro período aquisitivo exige **12 meses de efetivo exercício**
- Parcelamento autorizado em até **3 etapas** a pedido do servidor
- **Tema 1008 STF**: Férias adquiridas e não gozadas por necessidade do serviço convertem-se em pecúnia indenizatória na aposentadoria ou exoneração

---

## 📋 Eixo 4: As Sete Licenças da Lei 8.112/1990
### 1. Anatomia Comparativa Definitiva
- **1. Motivo de Doença em Pessoa da Família**: Até 60 dias remunerados + até 90 dias sem remuneração
- **2. Afastamento do Cônjuge/Companheiro**: Sem remuneração, por **prazo indeterminado**
- **3. Serviço Militar**: Conforme legislação específica
- **4. Atividade Política**: Com remuneração por até 3 meses entre o registro e o 10º dia após a eleição
- **5. Capacitação**: A cada **5 anos de exercício**, até **3 meses COM remuneração integral** (não acumulável)
- **6. Tratar de Interesses Particulares**: Até **3 anos consecutivos SEM remuneração** (exige servidor estável)
- **7. Mandato Classista**: Sem remuneração pelo órgão de origem

---

## 🏛️ Eixo 5: Afastamentos Legais e Mandato Eletivo (CF art. 38)
### 1. Regras Constitucionais do Mandato Eletivo
- **Federal, Estadual ou Distrital**: Afasta-se obrigatoriamente do cargo
- **Prefeito**: Afasta-se obrigatoriamente do cargo, mas tem **DIREITO DE OPÇÃO remuneratória**!
- **Vereador**: Havendo compatibilidade de horários, **PERCEBE AS DUAS REMUNERAÇÕES**!

---

## ⏱️ Eixo 6: Concessões Legais, Tempo de Serviço e Direito de Petição
### 1. Ausências Justificadas em Lei (Art. 97)
- 1 dia (doação de sangue); 2 dias (alistamento eleitoral); 8 dias consecutivos (casamento ou falecimento de pais, cônjuge, filhos, irmãos)

### 2. Prescrição do Direito de Petição
- 5 anos para atos de demissão, cassação de aposentadoria ou direitos salariais; 120 dias para os demais casos

---

## 🚨 Eixo 7: Radar de Armadilhas Frequentes Cebraspe / FGV
### 1. Remuneração do Vereador
- 🚨 **Pegadinha Clássica**: Dizer que servidor eleito vereador é obrigado a afastar-se do cargo público.
- ✅ **Regra**: Havendo compatibilidade de horários, ele acumula os dois cargos e recebe as duas remunerações!

### 2. Cumulação de Adicionais
- 🚨 **Pegadinha Clássica**: Afirmar que é permitida a cumulação de adicional de insalubridade com periculosidade.
- ✅ **Regra**: A lei veda expressamente cumulação: o servidor deve optar por um deles!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 380,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
