# 📜 Lei 8.112/90: Direitos e Vantagens (Aula 13)

## 💰 1. Sistema Remuneratório, Descontos & Reposição
### 💵 1.1 Vencimento vs. Remuneração
- **Vencimento**: Retribuição pecuniária básica pelo exercício do cargo público, com valor fixado em lei
- **Remuneração**: Vencimento do cargo efetivo acrescido das vantagens pecuniárias permanentes estabelecidas em lei
- **Irredutibilidade**: Vencimento é irredutível, ressalvado o teto constitucional e impostos
### 📉 1.2 Descontos & Consignações em Folha
- Desconto obrigatório: Por imposição legal ou mandado judicial (IRRF, PSS, pensão alimentícia)
- Desconto facultativo (Consignação): Mediante autorização do servidor, respeitada a margem consignável legal
### 🔄 1.3 Reposição e Indenização ao Erário
- Reposições e indenizações ao erário são descontadas em parcelas mensais não inferiores a **10% da remuneração**
- **Tema 531 STF / Súmula 34 TCU**: Valores recebidos indevidamente pelo servidor em virtude de erro escusável de interpretação da lei pela Administração Pública, estando de **BOA-FÉ**, **NÃO ESTÃO SUJEITOS À DEVOLUÇÃO**!

## 🎁 2. Vantagens Pecuniárias: Indenizações, Gratificações & Adicionais
### 🛡️ 2.1 Indenizações (NÃO se incorporam ao vencimento e NÃO sofrem tributação)
- **1. Ajuda de Custo**:
  - Destinada a compensar despesas de instalação do servidor que passar a ter exercício em nova sede com mudança de domicílio em **caráter permanente**
  - Fixada pela chefia, não podendo exceder 3 meses de remuneração
- **2. Diárias**:
  - Concedidas ao servidor que se afastar da sede em **caráter transitório/eventual** para outro ponto do território ou exterior
  - Cobre pousada, alimentação e locomoção urbana
  - Se não houver afastamento ou se retornar antes, restitui as diárias no prazo de **5 dias**
- **3. Indenização de Transporte**:
  - Devida ao servidor que realizar despesas com a utilização de meio próprio de locomoção para execução de serviços externos
- **4. Auxílio-Moradia**:
  - Ressarcimento de despesas de aluguel quando o servidor for deslocado para exercer cargo comissionado em localidade onde não haja imóvel funcional
### 🎖️ 2.2 Gratificações
- **Gratificação Natalina (13º salário)**: Devida a cada ano, proporcional aos meses de exercício (fração igual ou superior a 15 dias conta como mês integral)
- **Gratificação por Encargo de Curso ou Concurso (GECC)**: Devida ao servidor que atuar como instrutor em curso de formação, banca examinadora ou fiscal de concurso
### ⚡ 2.3 Adicionais
- **Adicional de Insalubridade ou Periculosidade**:
  - Insalubridade: Trabalho com agentes nocivos à saúde acima dos limites de tolerância
  - Periculosidade: Trabalho em contato permanente com substâncias inflamáveis, explosivas ou energia elétrica
  - 🚨 **Regra da Não-Cumulação**: O servidor deve **OPTAR** por um deles (é vedado receber insalubridade e periculosidade cumulativamente!)
- **Adicional Noturno**:
  - Trabalho prestado entre **22h de um dia e 5h do dia seguinte**
  - Acréscimo de **25%** sobre a hora diurna
  - Hora ficta noturna: Computada como de **52 minutos e 30 segundos**!
- **Adicional por Serviço Extraordinário (Hora Extra)**:
  - Acréscimo de no mínimo **50%** em relação à hora normal
  - Limite máximo legal: **2 horas diárias**
- **Adicional de Férias**: Acréscimo de 1/3 constitucional sobre a remuneração normal

## 🏖️ 3. Regime de Férias dos Servidores (Arts. 77 a 80)
### 📅 3.1 Regras Centrais
- **Duração**: 30 dias de férias por exercício anual (operadores de Raio X têm direito a 20 dias consecutivos a cada 6 meses, sem parcelamento)
- **Primeiro Período Aquisitivo**: Exige **12 meses de efetivo exercício** (os períodos subsequentes contam-se a cada ano civil)
- **Parcelamento**: Permitido em até **3 etapas**, desde que assim requerido pelo servidor e no interesse da administração
- **Acumulação**: Máximo de 2 períodos em caso de necessidade de serviço comprovada
- **Indenização de Férias não Gozadas (Tema 1008 STF)**:
  - É assegurada ao servidor público a conversão de férias não gozadas em indenização pecuniária na aposentadoria ou exoneração, sob pena de enriquecimento ilícito do Estado

## 📋 4. As Sete Licenças da Lei 8.112/1990
### 🧬 4.1 Anatomia Comparativa Definitiva
- **1. Por Motivo de Doença em Pessoa da Família**:
  - Parentes: Cônjuge/companheiro, pais, filhos, padrasto/madrasta, enteado ou dependente econômico
  - Remuneração: Até 60 dias COM remuneração; até mais 90 dias SEM remuneração (total máx: 150 dias em 12 meses)
- **2. Por Motivo de Afastamento do Cônjuge**:
  - Quando o cônjuge/companheiro for deslocado para outro ponto do país ou exterior
  - **SEM remuneração** e por **prazo indeterminado**
- **3. Para Serviço Militar**:
  - Convocação para forças armadas; concluído o serviço, tem até 30 dias sem remuneração para reassumir
- **4. Para Atividade Política**:
  - Da convenção partidária até véspera do registro: SEM remuneração
  - Do registro da candidatura até 10º dia após a eleição: **COM remuneração por até 3 meses** (se exercer cargo de arrecadação/fiscalização, afasta-se obrigatoriamente)
- **5. Para Capacitação**:
  - A cada **5 anos de efetivo exercício (quinquênio)**
  - Duração de até **3 meses COM remuneração** para curso de capacitação profissional
  - Períodos não são acumuláveis!
- **6. Para Tratar de Interesses Particulares**:
  - Critério discricionário da Administração
  - Exige cumprimento do estágio probatório (servidor estável)
  - Duração de até **3 anos consecutivos SEM remuneração**
- **7. Para Desempenho de Mandato Classista**:
  - Eleição para diretoria de confederação, federação ou sindicato representativo da categoria
  - **SEM remuneração** pelo órgão de origem; tempo conta para aposentadoria

## 🏛️ 5. Mandato Eletivo & Afastamentos Legais (CF art. 38)
### 🗳️ 5.1 Regras Constitucionais do Mandato Eletivo
- **1. Mandato Federal, Estadual ou Distrital (Deputado, Senador, Governador)**:
  - **Afastamento obrigatório** do cargo, emprego ou função
- **2. Mandato de Prefeito**:
  - **Afastamento obrigatório** do cargo, mas pode **OPTAR pela remuneração** que preferir!
- **3. Mandato de Vereador**:
  - *Havendo compatibilidade de horários*: **PERCEBE AS DUAS REMUNERAÇÕES** (acumulação remunerada legítima)!
  - *Sem compatibilidade de horários*: Afasta-se do cargo e pode OPTAR pela remuneração
- **Contagem de Tempo**: Conta para todos os efeitos legais, **EXCETO para promoção por merecimento**

## ⏱️ 6. Concessões, Tempo de Serviço & Direito de Petição
### 🗓️ 6.1 Concessões Legais de Ausência sem Perda de Remuneração (Art. 97)
- **1 dia**: Para doação de sangue
- **2 dias**: Para se alistar como eleitor
- **8 dias consecutivos**: Casamento (licença gala)
- **8 dias consecutivos**: Falecimento de cônjuge, companheiro, pais, madrasta/padrasto, filhos, enteados, menor sob guarda e irmãos (licença nojo)
### ⏳ 6.2 Prescrição do Direito de Petição (Art. 142)
- **Prazo de 5 anos**: Atos de demissão, cassação de aposentadoria/disponibilidade ou que afetem interesse patrimonial/financeiro
- **Prazo de 120 dias**: Demais hipóteses e requerimentos

## 🚨 7. Radar de Pegadinhas Frequentes (Cebraspe / FGV)
### ⚠️ 7.1 Acumulação de Adicionais
- 🚨 **Pegadinha Clássica**: Dizer que servidor que trabalha em hospital em contato com raio X e radiação recebe insalubridade e periculosidade juntos.
- ✅ **Regra**: A lei proíbe expressamente cumulação: o servidor deve optar por um dos adicionais!
### ⚠️ 7.2 Remuneração do Vereador
- 🚨 **Pegadinha Clássica**: Afirmar que o servidor eleito vereador é obrigado a se afastar do cargo de origem.
- ✅ **Regra**: Se houver compatibilidade de horários, ele acumula o exercício e recebe as duas remunerações!
### ⚠️ 7.3 Licença para Capacitação
- 🚨 **Pegadinha Clássica**: Dizer que a licença capacitação é concedida sem remuneração.
- ✅ **Regra**: A licença capacitação de até 3 meses é **COM REMUNERAÇÃO INTEGRAL**!
### ⚠️ 7.4 Incorporação de Diárias
- 🚨 **Pegadinha Clássica**: Afirmar que diárias recebidas habitualmente se incorporam ao vencimento básico.
- ✅ **Regra**: Indenizações (diárias, ajuda de custo, transporte) JAMAIS se incorporam à remuneração!

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
