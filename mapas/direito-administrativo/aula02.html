# 📚 Direito Administrativo: Aula 02 - Fundações Públicas, Empresas Públicas e SEM
## 🏛️ Eixo 1: Fundamentos da Intervenção Estatal na Ordem Econômica (CF, Art. 173)
### 1. Princípio da Subsidiariedade e Atuação Excepcional
- **Regra Geral**: Livre iniciativa e livre concorrência (CF, art. 170). O Estado atua primordialmente como agente normativo e regulador (CF, art. 174)
- **Exceções Constitucionais para Atuação Direta (Art. 173, caput)**:
  - Imperativos da **Segurança Nacional**
  - **Relevante Interesse Coletivo**, conforme definidos em lei expressa
- Vedada a intervenção direta estatal por mero capricho do governante

### 2. Bipolaridade Funcional das Empresas Estatais
- **Prestadoras de Serviços Públicos (Regime Híbrido com Influxo de Direito Público)**
  - Atividades essenciais prestadas diretamente à sociedade (ex: ECT/Correios, Infraero, Caerdes)
  - Responsabilidade Civil Objetiva (CF, art. 37, § 6º)
  - Bens diretamente afetados ao serviço são impenhoráveis
  - Imunidade Tributária Recíproca para serviços monopolísticos (CF, art. 150, VI, 'a' e Tema 508 STF)
  - Execução de dívidas mediante regime de Precatórios se atuarem em regime de monopólio postal/serviço
- **Exploradoras de Atividade Econômica de Produção e Comercialização**
  - Atuação no mercado concorrencial em busca de rentabilidade (ex: Petrobras, Banco do Brasil, Caixa Econômica Federal)
  - Submissão ao regime jurídico próprio das empresas privadas (CF, art. 173, § 1º, II)
  - VEDAÇÃO de privilégios fiscais não extensivos ao setor privado (CF, art. 173, § 2º)
  - Responsabilidade Civil Subjetiva (regras do Código Civil/2002)
  - Sujeição à penhora de bens e cobrança ordinária em juízo

---

## 🏢 Eixo 2: Empresas Públicas (EP) vs. Sociedades de Economia Mista (SEM)
### 1. As Quatro Diferenças Canônicas
- **1. Capital Social**:
  - *Empresa Pública*: 100% PÚBLICO (União, Estados, DF, Municípios ou outras entidades da Administração Indireta)
  - *Sociedade de Economia Mista*: MISTO (maioria absoluta das ações com direito a voto DEVE pertencer ao Poder Público; admite sócios particulares minoritários)
- **2. Forma Societária**:
  - *Empresa Pública*: QUALQUER FORMA admitida em direito (S.A., LTDA, EIRELI/SLU, etc.)
  - *Sociedade de Economia Mista*: OBRIGATORIAMENTE Sociedade Anônima (S.A.)
- **3. Foro Processual (Competência da Justiça na Esfera Federal)**:
  - *Empresa Pública Federal*: JUSTIÇA FEDERAL (CF, art. 109, I - ex: Caixa Econômica Federal)
  - *Sociedade de Economia Mista Federal*: JUSTIÇA ESTADUAL COMUM (Súmulas 517 e 556 do STF e Súmula 42 do STJ - ex: Banco do Brasil, Petrobras)
  - *Ressalva*: SEM vai para a JF se a União intervir formalmente como assistente ou opoente
  - *Estaduais e Municipais*: Ambas respondem sempre perante a Justiça Estadual Comum
- **4. Acionistas e Mercado de Capitais**:
  - *Empresa Pública*: Não possui ações negociadas em bolsa voltadas a investidores privados
  - *Sociedade de Economia Mista*: Pode abrir capital e negociar ações ordinárias/preferenciais na Bolsa de Valores (B3)

### 2. Traços Comuns a Todas as Estatais (EP e SEM)
- Personalidade jurídica de direito privado
- Criação AUTORIZADA por lei específica (a personalidade jurídica nasce com o registro na Junta Comercial)
- Empregados públicos regidos pela Consolidação das Leis do Trabalho (CLT)
- Admissão obrigatória por **Concurso Público** de provas ou de provas e títulos (CF, art. 37, II)
- Vedação absoluta de acumulação remunerada de empregos públicos (CF, art. 37, XVII)
- Fiscalização financeira e contábil obrigatória perante o Tribunal de Contas (TCU / TCEs)
- Impossibilidade legal de falência (Lei nº 11.101/2005, art. 2º, I)

## 📜 Eixo 3: Estatuto das Estatais (Lei nº 13.303/2016) & Regime de Pessoal
### 1. Regime de Pessoal e Motivação da Demissão (Tema 1022 do STF)
- Empregados de empresas estatais NÃO possuem a estabilidade constitucional do Art. 41 da CF (Súmula 390, II do TST)
- **Fixação pelo STF no Tema 1022 (RE 688.267)**:
  - A dispensa de empregados de estatais admitidos por concurso público **EXIGE MOTIVAÇÃO formal e justificada**
  - Não se exige processo administrativo disciplinar (PAD) complexo, mas deve haver fundamento fático legítimo (técnico, econômico, disciplinar ou operacional)
  - Vedada a dispensa arbitrária ou imotivada!

### 2. Teto Remuneratório Constitucional (CF, Art. 37, XI e § 9º)
- **Estatais Dependentes**: Empresas que recebem recursos da Fazenda Pública para pagamento de despesas de pessoal ou de custeio geral (ex: CONAB, EBC, CPRM) -> **SUBMETEM-SE RIGOROSAMENTE AO TETO CONSTITUCIONAL**
- **Estatais Não Dependentes**: Empresas autossuficientes financeiramente que vivem de receitas próprias de mercado (ex: Petrobras, Banco do Brasil, Caixa) -> **NÃO SE SUBMETEM AO TETO**

### 3. Governança e Nomeação de Dirigentes (Art. 17 da Lei 13.303/2016)
- Exigência de idoneidade moral, reputação ilibada e experiência profissional mínima de 10 anos no setor
- Quarentena e vedações a pessoas com atuação decisória em partidos políticos ou titulares de mandatos legislativos/ministros (com as balizas da medida cautelar do STF na ADI 7.331)

### 4. Licitações e Contratos nas Estatais
- As estatais seguem o regime licitatório especial da **Lei nº 13.303/2016** (NÃO utilizam a Lei 14.133/2021!)
- Dispensa de licitação permitida para comercialização, prestação de serviços afins à atividade-fim e oportunidades comerciais de mercado

---

## 🏛️ Eixo 4: Teoria das Fundações Públicas
### 1. Conceito e Finalidade
- Patrimônio personalizado afetado a uma finalidade social pública não lucrativa
- Áreas típicas de atuação: Educação, saúde, assistência social, cultura, patrimônio histórico e pesquisa científica

### 2. Dicotomia Canônica das Fundações Públicas
- **Fundações Públicas de Direito Público (Fundações Autárquicas / Autarquias Fundacionais)**:
  - Criadas DIRETAMENTE por lei específica
  - Regime 100% de direito público
  - Bens públicos (impenhoráveis e imprescritíveis)
  - Dívidas executadas por Precatórios (CF, art. 100)
  - Regime de pessoal estatutário (RJU)
  - Imunidade Tributária Recíproca plena
  - Exemplos: FUNAI, IBGE, IPEA
- **Fundações Públicas de Direito Privado (Fundações Governamentais)**:
  - Criação AUTORIZADA por lei específica (personalidade nasce com o registro civil)
  - Regime híbrido (influxo de normas de direito público com base de direito privado)
  - Empregados públicos celetistas admitidos por concurso público
  - Bens privados, mas com impenhorabilidade mitigada se afetados a serviços públicos

### 3. Reserva de Lei Complementar (CF, Art. 37, XIX)
- Cabe à LEI COMPLEMENTAR definir as áreas de atuação das fundações públicas (norma de eficácia limitada)

---

## ⚖️ Eixo 5: Jurisprudência Vinculante e Temática (STF & STJ)
### 1. Imunidade Tributária Recíproca das Estatais (Tema 508 do STF)
- A imunidade recíproca (IPTU, IPVA, IR) aplica-se às empresas públicas e sociedades de economia mista que prestem **serviços públicos essenciais em regime de monopólio ou não concorrencial** (ex: ECT/Correios, Infraero, Caerdes)
- **VEDADA** a imunidade para estatais que exploram atividade econômica em ambiente de livre concorrência ou que distribuem lucros a acionistas privados!

### 2. Súmulas Essenciais
- **Súmula Vinculante 39 (STF)**: A contratação de servidores por fundação pública instituída pelo Estado exige prévia aprovação em concurso público
- **Súmula 517 (STF)**: As sociedades de economia mista só têm foro na Justiça Federal se a União intervir como assistente ou opoente
- **Súmula 556 (STF)**: É competente a Justiça Comum para desapropriação promovida por sociedade de economia mista
- **Súmula 42 (STJ)**: Compete à Justiça Estadual processar e julgar causas e crimes envolvendo sociedade de economia mista

---

## 🎯 Eixo 6: Radar de Pegadinhas Cebraspe & FGV
### 1. Distinções Binárias Críticas
- **EP vs. SEM no Foro Federal**:
  - Caixa Econômica Federal (EP) -> Justiça Federal
  - Banco do Brasil e Petrobras (SEM) -> Justiça Estadual!
- **Estabilidade vs. Motivação**:
  - Empregado de estatal NÃO tem estabilidade (art. 41 CF)
  - Mas a sua dispensa NÃO PODE ser imotivada: exige justificativa explícita (Tema 1022 STF)
- **Criação de Fundações**:
  - Fundação de Direito Público: Criada por lei
  - Fundação de Direito Privado: Autorizada por lei + Registro
- **Falência de Estatais**:
  - Nem EP nem SEM podem falir (vedação expressa da Lei 11.101/05, art. 2º, I)
- **Teto Salarial**:
  - Dependente de repasse para custeio = Sujeita ao teto
  - Sobrevive de faturamento próprio de mercado = Fora do teto

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
