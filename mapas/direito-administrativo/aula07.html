# 📚 Direito Administrativo: Aula 07 - Consórcios Públicos (Lei 11.107/2005)
## 🤝 Eixo 1: Fundamento Constitucional e Regras Federativas
### 1. O Artigo 241 da Constituição Federal (EC nº 19/1998)
- A União, os Estados, o Distrito Federal e os Municípios disciplinarão por meio de lei os **consórcios públicos** e os **convênios de cooperação** para gestão associada de serviços públicos
- Regulamentação infraconstitucional: **Lei Federal nº 11.107/2005** e **Decreto nº 6.017/2007**

### 2. Regras Rígidas de Participação Federativa (Quem Pode Consorciar?)
- **Regra Fundamental**: A **União só pode participar** de consórcios públicos em que também participem **todos os Estados** em cujos territórios estejam situados os Municípios consorciados
- **Vedação Absoluta**: É inconstitucional e nulo consórcio formado exclusivamente entre a União e Municípios sem a presença do respectivo Estado federado!
- Municípios podem consorciar-se entre si (mesmo de Estados diferentes) e com seus respectivos Estados sem a presença da União

### 3. Consórcio Público vs. Convênio de Cooperação
- **Consórcio Público**: Dá origem a uma **NOVA PESSOA JURÍDICA AUTÔNOMA** (com patrimônio, quadro de pessoal e capacidade processual próprios)
- **Convênio de Cooperação**: Mero acordo de vontades sem criação de nova entidade personalizada

---

## 📜 Eixo 2: Procedimento Trifásico de Criação do Consórcio
### 1. Fase 1: Subscrição do Protocolo de Intenções
- Negociação e assinatura pelos Chefes do Poder Executivo dos entes consorciados (Prefeitos, Governadores, Presidente)
- Deve ser obrigatoriamente publicado na imprensa oficial de todos os entes partícipes

### 2. Fase 2: Ratificação Legislativa
- O Protocolo de Intenções deve ser aprovado e ratificado mediante **LEI FORMAL** aprovada pelas Câmaras Municipais / Assembleias Legislativas de cada ente consorciado
- A ratificação parcial ou com reservas equivale à recusa da ratificação

### 3. Fase 3: Celebração do Contrato de Consórcio Público
- A ratificação converte automaticamente o Protocolo de Intenções em Contrato de Consórcio Público (na pessoa jurídica de direito público) ou serve de base para o registro civil (na pessoa de direito privado)

---

## 🏛️ Eixo 3: Natureza Jurídica: Associação Pública vs. Direito Privado
### 1. Consórcio Público de Direito Público (Associação Pública)
- Denominada expressamente por lei como **ASSOCIAÇÃO PÚBLICA**
- **Natureza Jurídica**: Espécie de **AUTARQUIA INTERFEDERATIVA** (Código Civil, art. 41, IV)
- **Pertencimento**: Integra a **ADMINISTRAÇÃO PÚBLICA INDIRETA de TODOS os entes consorciados simultaneamente**!
- Prerrogativas: Bens públicos (impenhoráveis e imprescritíveis), execução de dívidas pelo regime de Precatórios (CF, art. 100), imunidade tributária recíproca e prazo em dobro processual

### 2. Consórcio Público de Direito Privado
- Pessoa jurídica de direito privado sem fins lucrativos
- Aquisição de personalidade: Com a inscrição do estatuto e atos constitutivos no **Registro Civil de Pessoas Jurídicas**
- Sujeição: Segue regime híbrido, submetendo-se a concurso público, licitação e prestação de contas ao Tribunal de Contas

---

## 👥 Eixo 4: Regime de Pessoal e Prerrogativas Licitatórias
### 1. Regime de Pessoal (Lei nº 13.822/2019)
- O pessoal admitido pelos consórcios públicos (sejam de direito público ou de direito privado) é regido pela **Consolidação das Leis do Trabalho (CLT)**
- **Concurso Público Obrigatório**: A admissão exige prévia aprovação em concurso público de provas ou de provas e títulos (CF, art. 37, II)
- Cessão de Servidores: Servidores dos entes consorciados podem ser cedidos ao consórcio, mantendo o regime jurídico de origem

### 2. Prerrogativas Licitatórias (Nova Lei de Licitações — Lei nº 14.133/2021)
- **Limites de Dispensa de Licitação por Valor**: Os consórcios públicos dispõem de limites em **DOBRO** para contratação direta em razão do valor (Lei 14.133/2021, art. 75, § 2º)
- **Comissão de Contratação Integrada**: Pode ser formada por servidores pertencentes a quaisquer dos órgãos e entidades dos entes consorciados

---

## 💸 Eixo 5: Execução Financeira e o Contrato de Rateio
### 1. O Contrato de Rateio (Lei nº 11.107/2005, Art. 8º)
- Instrumento formal anual obrigatório pelo qual os entes consorciados entregam recursos financeiros ao consórcio público
- **Obrigatoriedade de Dotação Orçamentária**: Os entes devem consignar dotação específica em suas respectivas Leis Orçamentárias Anuais (LOA)
- Vedada expressamente a aplicação de recursos do consórcio em despesas não previstas no contrato de rateio

### 2. Inadimplência e Conexão com Improbidade
- O ente que não efetuar o repasse fica inadimplente e pode ser suspenso de usufruir dos serviços do consórcio
- O ato de repassar recursos sem prévio contrato de rateio ou sem amparo orçamentário configura ilícito financeiro e **ato de improbidade administrativa**

---

## 📑 Eixo 6: Gestão Associada e o Contrato de Programa
### 1. O Contrato de Programa (Art. 13 da Lei)
- Instrumento pelo qual os entes consorciados transferem ou contratam entre si ou com o consórcio a **prestação de serviços públicos ou a realização de obras associadas**
- Cláusulas obrigatórias: Critérios de remuneração, metas de desempenho, fiscalização e penalidades
- **Sobrevivência do Contrato de Programa**: A desfiliação ou retirada de um ente consorciado **NÃO EXTINGUE** as obrigações pactuadas no contrato de programa até o fim do seu prazo original

---

## 🎯 Eixo 7: Radar de Pegadinhas Cebraspe & FGV
- **Associação Pública = Autarquia**: Sim, consórcio público de direito público é autarquia interfederativa integrante da Administração Indireta de todos os entes partícipes
- **União e Município sem Estado**: NULO! A União não pode consorciar com Municípios sem a presença do Estado onde estão sediados
- **Regime de Pessoal**: Empregados de consórcios públicos são SEMPRE celetistas (CLT), com concurso público obrigatório
- **Dispensa de Licitação**: Consórcios públicos têm limites dobrados de dispensa de licitação por valor (Lei 14.133/21)
- **Contrato de Rateio vs. Contrato de Programa**: Rateio repassa dinheiro público para custeio do consórcio; Programa transfere a prestação de serviços ou obras públicas associadas

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
