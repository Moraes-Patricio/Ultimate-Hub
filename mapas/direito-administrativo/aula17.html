<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 17 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA POR NÍVEL HIERÁRQUICO (Alto contraste definitivo) */
    .markmap-node text {
      fill: #f8fafc !important;
    }
    .markmap-foreign {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
      color: #f1f5f9 !important;
    }
    .markmap-foreign div,
    .markmap-foreign span,
    .markmap-foreign p {
      color: inherit;
    }
    
    /* Nível 0: Título Raiz */
    .markmap-node[data-depth="0"] .markmap-foreign div {
      font-size: 16px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8) !important;
    }

    /* Nível 1: Eixos Temáticos */
    .markmap-node[data-depth="1"] .markmap-foreign div {
      font-size: 14.5px !important;
      font-weight: 700 !important;
      color: #38bdf8 !important;
      white-space: nowrap !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7) !important;
    }

    /* Nível 2: Subtópicos */
    .markmap-node[data-depth="2"] .markmap-foreign div {
      font-size: 13.5px !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
    }

    /* Nível 3+: Bullets e Detalhes */
    .markmap-node[data-depth="3"] .markmap-foreign div,
    .markmap-node[data-depth="4"] .markmap-foreign div,
    .markmap-node[data-depth="5"] .markmap-foreign div {
      font-size: 12.5px !important;
      font-weight: 400 !important;
      color: #e2e8f0 !important;
      line-height: 1.55 !important;
    }

    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }

    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal !important;
    }

    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 17 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 17 - Antigravity)

## 🏛️ Eixo 1: Âmbito de Aplicação, Regime Federativo e Princípio da Subsidiariedade
### 1. Abrangência Subjetiva da Lei 14.133/2021 (Art. 1º)
- **Aplica-se Obrigatoriamente**:
  - Administração direta, autárquica e fundacional de **TODOS os entes federativos** (União, Estados, DF e Municípios)
  - Fundos especiais e demais entidades controladas diretamente pelo poder público
  - Poderes Legislativo e Judiciário quando no desempenho de atividade administrativa atípica
- **NÃO se Aplica**:
  - Empresas Públicas e Sociedades de Economia Mista e suas subsidiárias (regidas pela **Lei 13.303/2016 - Lei das Estatais**), ressalvado o regime penal e regras de crimes em licitações!
  - Operações de crédito interno/externo e gestão da dívida pública

### 2. Normas Gerais vs. Normas Específicas
- A União legisla privativamente sobre **normas gerais** de licitação e contratação (CF art. 22, XX)
- Estados, DF e Municípios podem legislar sobre especificidades procedimentais, vedado contrariar as normas gerais

---

## ⚖️ Eixo 2: Os Princípios Expressos, Governança e os Quatro Objetivos
### 1. Princípios Expressos Fundamentais (Art. 5º)
- Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência, Interesse Público, Probidade Administrativa, Igualdade, Planejamento, Transparência, Eficácia, Segregação de Funções, Motivação, Vinculação ao Edital, Julgamento Objetivo, Segurança Jurídica, Razoabilidade, Proporcionalidade, Celeridade, Economicidade e Desenvolvimento Nacional Sustentável
- *Princípio da Segregação de Funções*: Veda a concentração de atribuições críticas (planejamento, execução, atesto e pagamento) em um único agente público para evitar fraudes

### 2. Os Quatro Objetivos Centrais do Processo Licitatório (Art. 11)
- 1. Assegurar a seleção da proposta mais vantajosa (considerando o ciclo de vida do objeto)
- 2. Assegurar tratamento isonômico entre os licitantes e a justa competição
- 3. Evitar contratações com sobrepreço ou preços manifestamente inexequíveis e superfaturamento
- 4. Incentivar a inovação e o desenvolvimento nacional sustentável

---

## 👥 Eixo 3: Agentes Públicos da Licitação, Equipe de Apoio e Governança
### 1. Agente de Contratação (Art. 8º)
- Pessoa designada pela autoridade competente para conduzir a licitação e tomar decisões
- Deve ser, preferencialmente, **servidor efetivo ou empregado público dos quadros permanentes**
- Responde individualmente pelos atos praticados, salvo se induzido a erro pela equipe de apoio

### 2. Comissão de Contratação
- Substitui o agente de contratação nos seguintes casos:
  - Bens e serviços especiais (facultativo)
  - **Modalidade Diálogo Competitivo (OBRIGATÓRIO comissão de no mínimo 3 servidores efetivos!)**
- Decisões tomadas por maioria; responsabilidade solidária dos membros, ressalvada divergência registrada em ata

### 3. O Pregoeiro
- Agente responsável pela condução do **Pregão**; segue as mesmas regras do Agente de Contratação

---

## 🗂️ Eixo 4: As Cinco Modalidades Licitatórias da Nova Lei
### 1. O Rol Taxativo das Modalidades (Art. 28)
- 🚨 **Fim Definitivo de Convite e Tomada de Preços**: A Lei 14.133/21 extinguiu o Convite e a Tomada de Preços!
- Rol das 5 modalidades atuais:
  - 1. **Pregão**
  - 2. **Concorrência**
  - 3. **Concurso**
  - 4. **Leilão**
  - 5. **Diálogo Competitivo** (Nova modalidade criada pela Lei 14.133!)

### 2. Pregão vs. Concorrência
- **Pregão (Art. 29)**: Modalidade obrigatória para aquisição de **bens e serviços comuns** (cujos padrões de desempenho podem ser objetivamente definidos pelo edital). Critérios: Menor Preço ou Maior Desconto. *Vedado para obras e serviços especiais de engenharia*!
- **Concorrência (Art. 30)**: Modalidade para contratação de **bens e serviços especiais e de obras e serviços comuns e especiais de engenharia**. Admite todos os critérios de julgamento (exceto maior lance)!

### 3. Concurso e Leilão
- **Concurso (Art. 30 §1º)**: Escolha de trabalho técnico, científico ou artístico; prêmio ou remuneração ao vencedor; antecedência mínima de 35 dias
- **Leilão (Art. 31)**: Alienação de quaisquer bens públicos (móveis ou imóveis); critério único de **Maior Lance**; conduzido por Leiloeiro Oficial ou servidor designado

### 4. O Diálogo Competitivo (Nova Modalidade - Art. 32)
- Utilizada para contratações que envolvam:
  - Inovação tecnológica ou técnica
  - Impossibilidade de a Administração ter sua necessidade satisfeita sem adaptação de soluções disponíveis
  - Impossibilidade de definir com precisão suficiente as especificações técnicas
- Conduzido por **comissão composta por pelo menos 3 servidores efetivos**
- Fases: Diálogo com licitantes pré-selecionados para desenvolver soluções -> Proposta final competitiva

---

## 🎯 Eixo 5: Os Seis Critérios de Julgamento das Propostas (Art. 33)
### 1. Rol dos Critérios
- **1. Menor Preço**: Proposta mais econômica que atenda aos padrões mínimos exigidos
- **2. Maior Desconto**: Aplica-se sobre tabela de preços referenciais oficial (utilizado em pregão e concorrência)
- **3. Melhor Técnica ou Conteúdo Artístico**: Considera exclusivamente fatores técnicos/artísticos (fixa remuneração no edital)
- **4. Técnica e Preço**: Ponderação de notas de técnica e proposta de preço (máximo de 70% para técnica)
- **5. Maior Lance**: Exclusivo da modalidade **Leilão**
- **6. Maior Retorno Econômico**: Usado em **Contratos de Eficiência** (remuneração do contratado proporcional à economia gerada)

---

## 🔄 Eixo 6: Modos de Disputa e Regras Gerais da Sessão Pública (Art. 56)
### 1. Modos de Disputa
- **Modo Aberto**: Licitantes apresentam lances públicos e sucessivos, crescentes ou decrescentes
- **Modo Fechado**: Propostas sigilosas até a abertura simultânea
- **Modo Aberto e Fechado (Combinado)**: Etapa aberta de lances seguida por lances finais fechados (ou inverso)
- *Vedação*: É proibida a utilização isolada do modo fechado quando adotados menor preço ou maior desconto!

### 2. Forma Preferencial: Eletrônica!
- As licitações serão realizadas **preferencialmente sob a forma eletrônica** (art. 17 §2º)
- A forma presencial é excepcional e exige **motivação circunstanciada com gravação em áudio e vídeo** da sessão!

---

## 🚨 Eixo 7: Síntese de Prazos Mínimos de Publicação e Armadilhas FGV / Cebraspe
### 1. Prazos Mínimos de Publicação do Edital (Art. 55)
- **Pregão**:
  - Bens e serviços comuns: **8 (oito) dias úteis**
- **Concorrência**:
  - Menor preço / Maior desconto: **15 (quinze) dias úteis** (serviços comuns) ou **25 (vinte e cinco) dias úteis** (obras/serviços especiais)
  - Técnica e Preço / Melhor Técnica: **35 (trinta e cinco) dias úteis**
  - Maior Retorno Econômico: **35 dias úteis** (comum) ou **60 dias úteis** (obras)
- **Concurso**: **35 (trinta e cinco) dias úteis**
- **Leilão**: **15 (quinze) dias úteis**
- **Diálogo Competitivo**: **25 (vinte e cinco) dias úteis** para manifestação de interesse e **60 (sessenta) dias úteis** para propostas finais!

### 2. Principais Pegadinhas de Prova
- 🚨 **Pegadinha Clássica**: Afirmar que a Lei 14.133/21 ainda admite a modalidade Convite para valores baixos.
- ✅ **Regra**: Convite e Tomada de Preços foram EXTINTOS! Valores baixos agora são contratados por DISPENSA DE LICITAÇÃO.
- 🚨 **Pegadinha Clássica**: Dizer que o Diálogo Competitivo pode ser conduzido por agente de contratação individual.
- ✅ **Regra**: Diálogo Competitivo exige OBRIGATORIAMENTE comissão de no mínimo 3 servidores efetivos!`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 650,
        spacingVertical: 20,
        spacingHorizontal: 120,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
