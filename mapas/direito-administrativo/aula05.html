# 📚 Direito Administrativo: Aula 05 - Atos Administrativos
## 🏛️ Eixo 1: Conceito, Fatos Jurídicos e o Silêncio Administrativo
### 1. A Cadeia Genealógica do Ato
- **Fato da Administração**: Todo acontecimento material no âmbito estatal que não produz efeitos de direito administrativo (ex: circulação rotineira de viaturas, limpeza de repartição)
- **Fato Administrativo**: Fato natural ou humano que produz efeitos jurídicos na esfera administrativa independentemente de vontade (ex: morte de servidor estável que gera vacância de cargo; desabamento de ponte por temporal)
- **Ato da Administração**: Toda manifestação de agentes públicos (abrange atos de direito privado, atos de governo, atos materiais e atos administrativos)
- **Ato Administrativo (Conceito Estrito)**: Manifestação unilateral de vontade da Administração Pública que, sob o regime de direito público, tem por finalidade imediata adquirir, resguardar, transferir, modificar, extinguir ou declarar direitos, ou impor obrigações aos administrados ou a si própria

### 2. O Silêncio Administrativo
- O silêncio da Administração é um **FATO ADMINISTRATIVO** (não é ato administrativo!)
- **Regra Geral**: O silêncio não produz efeito jurídico tácito algum
- **Exceção**: Só produz efeito de deferimento ou indeferimento quando houver **expressa previsão em lei**
- **Omissão Ilícita**: Cabe impetrar Mandado de Segurança ou Ação de Obrigação de Fazer para que o juiz assine prazo para a autoridade decidir (o Judiciário não substitui a vontade do Executivo, mas compele à decisão)

---

## 🧩 Eixo 2: Os Cinco Elementos do Ato Administrativo (CO-FI-FO-MO-OB)
### 1. Quadro Geral dos Elementos Estruturais (Lei nº 4.717/1965)
- **1. Competência (Sujeito)**:
  - Poder atribuído pela lei ao agente para a prática do ato
  - Elemento **SEMPRE VINCULADO**
  - *Vício*: Excesso de poder, usurpação de função ou incompetência
  - *Sanabilidade*: Vício sanável (convalidável) se a competência NÃO for exclusiva!
- **2. Finalidade**:
  - Bem jurídico mediato objetivado pelo ato (Interesse público geral + Fim específico definido em lei)
  - Elemento **SEMPRE VINCULADO**
  - *Vício*: Desvio de finalidade / Desvio de poder
  - *Sanabilidade*: **INSANÁVEL** (vício de finalidade nunca se convalida)
- **3. Forma**:
  - Modo exterior de manifestação da vontade (regra: forma escrita e solene)
  - Elemento **SEMPRE VINCULADO**
  - *Vício*: Ausência de forma ou inobservância de solenidade
  - *Sanabilidade*: Vício sanável se a forma não for essencial para a validade do ato!
- **4. Motivo**:
  - Situação fática de fato e os fundamentos de direito que justificam a prática do ato
  - Pode ser **VINCULADO ou DISCRICIONÁRIO**
  - *Vício*: Motivo inexistente, falso ou juridicamente inadequado
  - *Sanabilidade*: **INSANÁVEL** (não se pode alterar o motivo pretérito)
- **5. Objeto (Conteúdo)**:
  - O efeito jurídico imediato que o ato produz (o que o ato declara, concede, interdita, pune)
  - Pode ser **VINCULADO ou DISCRICIONÁRIO**
  - *Vício*: Objeto ilícito, impossível, indeterminado ou imoral
  - *Sanabilidade*: **INSANÁVEL**

### 2. Motivo vs. Motivação e Teoria dos Motivos Determinantes
- **Motivo**: É o pressuposto fático e legal objetivo (o evento do mundo real)
- **Motivação**: É a exteriorização formal e escrita das razões fáticas e jurídicas
- **Teoria dos Motivos Determinantes**:
  - A validade do ato vincula-se indissociavelmente aos motivos expostos pela autoridade
  - Se os motivos invocados forem falsos ou inexistentes, o ato é **NULO DE PLENO DIREITO**, mesmo que a motivação fosse facultativa (ex: exoneração de cargo em comissão motivada por falta injustificada inexistente)
- **Motivação Aliunde (Per Relationem)**: É válida a motivação por remissão formal a pareceres, informações ou decisões anteriores constantes do processo

---

## 🛡️ Eixo 3: Os Atributos do Ato Administrativo (Mnemônico: PATI)
### 1. Presunção de Legitimidade e Veracidade
- *Presunção de Legitimidade*: Conformidade do ato com o ordenamento jurídico
- *Presunção de Veracidade*: Conformidade dos fatos declarados com a verdade real
- **Presente em TODOS os atos administrativos**
- Natureza: *Juris tantum* (relativa), inverte o ônus da prova para quem contesta

### 2. Autoexecutoriedade
- Prerrogativa de executar diretamente suas determinações sem prévia autorização judicial
- *Exigibilidade*: A obrigação é formalmente exigível de plano (decisão unilateral)
- *Executoriedade*: Emprego direto da força e coação material (demolição, apreensão de remédio)
- **Exceção Capital**: A cobrança forçada de crédito decorrente de **MULTA NÃO é autoexecutória** (exige execução fiscal na Justiça!)

### 3. Tipicidade
- O ato administrativo deve corresponder a figuras e modelos previamente desenhados pela lei
- Impede a prática de atos arbitrários ou inominados não previstos no direito positivo

### 4. Imperatividade (Poder Extroverso)
- Capacidade de impor obrigações coercitivas a terceiros independentemente de sua concordância
- **NÃO ESTÁ PRESENTE EM TODOS OS ATOS**: Ausente em atos negociais (licença, autorização) e enunciativos (certidões, atestados)

---

## 📊 Eixo 4: Classificação dos Atos Administrativos
### 1. Quanto à Formação da Vontade (Foco Máximo Cebraspe/FGV)
- **Ato Simples**:
  - Manifestação de vontade de um **ÚNICO ÓRGÃO** (seja ele singular/unipessoal ou colegiado/pluripessoal)
  - Ex: Portaria ministerial; acórdão unânime de um Tribunal administrativo
- **Ato Complexo**:
  - Fusão e conjugação de vontades de **DOIS OU MAIS ÓRGÃOS INDEPENDENTES** que se unem para formar um **ÚNICO ATO**
  - A vontade de um órgão é incompleta sem a do outro
  - *Exemplo Canônico*: Aposentadoria de servidor público (órgão de origem + registro do TCU - Súmula Vinculante nº 3)
  - *Exemplo Constitucional*: Nomeação de Ministro do STF (Presidente indica + Senado aprova + Presidente nomeia)
- **Ato Composto**:
  - Envolve **DOIS ATOS DISTINTOS**: Um ato principal (que já está perfeito) e um ato acessório que o homologa, aprova ou ratifica
  - Praticado por um órgão e ratificado por outro
  - Ex: Visto de autoridade superior; aprovação de orçamento por comitê gestor

---

## 📜 Eixo 5: Espécies de Atos Administrativos (Mnemônico: PONEI)
### 1. As Cinco Espécies
- **Punitivos**: Aplicação de sanções administrativas e funcionais (multas, demissão, interdição de fábrica)
- **Ordinatórios**: Disciplinam o funcionamento interno da administração e a conduta de servidores (circulares, portarias internas, memorandos, ordens de serviço)
- **Negociais**: Manifestação de vontade convergente com o particular
- **Enunciativos**: Atestam ou certificam uma situação fática prévia sem manifestar vontade estatal autônoma (certidões, atestados, pareceres consultivos)
- **Normativos**: Comandos gerais e abstratos para a fiel execução das leis (decretos, regulamentos, regimentos)

### 2. O Duelo Clássico: Licença vs. Autorização
- **Licença**:
  - Ato **VINCULADO e DEFINITIVO**
  - Preenchidos os requisitos da lei, o administrado tem **direito subjetivo** à obtenção
  - Gera direito adquirido; não pode ser revogada discricionariamente
  - Exemplos: Licença para dirigir (CNH), licença para construir, licença para exercício profissional
- **Autorização**:
  - Ato **DISCRICIONÁRIO e PRECÁRIO**
  - Juízo de conveniência e oportunidade do Estado
  - Pode ser **REVOGADA A QUALQUER TEMPO** pela Administração sem direito a indenização
  - Exemplos: Autorização para uso de praça para evento, porte de arma para defesa pessoal

---

## ❌ Eixo 6: Extinção dos Atos Administrativos
### 1. Anulação vs. Revogação
- **Anulação (Invalidação)**:
  - *Motivo*: **Ilegalidade / Ilegitimidade** do ato (vício insanável)
  - *Competência*: Pela **Administração Pública** (Autotutela - Súmula 473 STF) OU pelo **Poder Judiciário**
  - *Efeitos Temporais*: **EX TUNC** (retroage às origens, destruindo todos os efeitos)
  - *Decadência*: Prazo de **5 anos** para a Administração anular atos favoráveis a destinatários de boa-fé (Lei 9.784/99, art. 54)
- **Revogação**:
  - *Motivo*: **Inconveniência ou Inoportunidade** superveniente de ato originalmente válido
  - *Competência*: **PRIVATIVA da Administração Pública** (O Judiciário **JAMAIS** revoga atos do Executivo!)
  - *Efeitos Temporais*: **EX NUNC** (prospectivo, não retroage, respeita efeitos pretéritos)
  - *Atos Irrevogáveis*: Atos vinculados, atos consumados, atos que geraram direito adquirido, atos integrantes de processo findo

### 2. Outras Formas de Extinção
- **Cassação**: Extinção sancionatória porque o beneficiário do ato descumpriu condições legais essenciais supervenientes (ex: hotel que descumpre alvará e passa a funcionar como prostíbulo)
- **Caducidade**: Extinção pela superveniência de lei nova que torna a atividade concedida juridicamente ilícita ou incompatível
- **Contraposição / Derrubada**: Emissão de novo ato, emitido com base em competência diversa, cujos efeitos extinguem o ato anterior (ex: nomeação extinta por exoneração)
- **Renúncia**: O próprio beneficiário abre mão voluntariamente dos efeitos do ato

---

## 🩹 Eixo 7: Convalidação (Sanatória) dos Atos Administrativos
### 1. Conceito e a Regra de Ouro do 'FO-CO'
- Correção de vício sanável do ato administrativo, com efeitos retroativos (**EX TUNC**)
- **Requisitos Cumulativos Obrigatórios**:
  - Não acarretar lesão ao interesse público
  - Não causar prejuízos a terceiros
  - Apresentar defeitos passíveis de convalidação
- **A Regra do FO-CO**: Apenas a **FORMA** (não essencial) e a **COMPETÊNCIA** (não exclusiva) admitem convalidação!
- Vícios em **Finalidade, Motivo e Objeto são ABSOLUTAMENTE INSANÁVEIS**

---

## ⚖️ Eixo 8: Súmulas Vinculantes e Radar Cebraspe / FGV
- **Súmulas 346 e 473 do STF**: Princípio da Autotutela (A Administração pode anular seus próprios atos ilegais e revogar os inoportunos)
- **Súmula Vinculante nº 3**: O TCU só exige contraditório e ampla defesa em processo de aposentadoria se transcorridos mais de 5 anos da chegada do processo ao Tribunal
- **Judiciário Revoga?**: NUNCA! O Judiciário anula atos ilegais de qualquer Poder, mas nunca revoga atos discricionários de outro Poder
- **Multa e Autoexecutoriedade**: A aplicação da penalidade é autoexecutória; a cobrança pecuniária coercitiva depende de processo judicial de execução fiscal

  </script>

  <script>
    let mm = null;
    let rootNode = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const markdown = document.getElementById('markdown-source').textContent;
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdown);
      rootNode = root;

      const svg = document.getElementById('mindmap');
      const { Markmap } = window.markmap;
      mm = Markmap.create(svg, {
        color: (node) => {
          const depthColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24'];
          return depthColors[node.depth % depthColors.length];
        },
        duration: 300,
        nodeMinHeight: 20,
        spacingHorizontal: 110,
        spacingVertical: 12,
        paddingX: 16,
        autoFit: true,
        initialExpandLevel: 2
      }, root);

      window.addEventListener('resize', () => { mm.fit(); });
    });

    function resetZoom() { if (mm) mm.fit(); }

    function setFold(node, fold) {
      if (node.children && node.children.length > 0) {
        node.payload = node.payload || {};
        node.payload.fold = fold;
        node.children.forEach(child => setFold(child, fold));
      }
    }

    function expandAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 0);
      mm.renderData(rootNode);
      mm.fit();
    }

    function collapseAll() {
      if (!mm || !rootNode) return;
      setFold(rootNode, 1);
      if (rootNode.children) {
        rootNode.children.forEach(child => {
          if (child.payload) child.payload.fold = 1;
        });
      }
      mm.renderData(rootNode);
      mm.fit();
    }
  </script>
