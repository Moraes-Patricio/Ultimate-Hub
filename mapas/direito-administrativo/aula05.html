<body>

  <svg id="mindmap"></svg>
  <script>
    const markdown = "# ⚖️ Direito Administrativo: Aula 05\n## 🏛️ Eixo 0: Conceito, Fatos Jurídicos e o Silêncio Administrativo\n### 1. A Cadeia Genealógica do Ato\n- **Fato da Administração**: Todo acontecimento material no âmbito estatal que não produz efeitos de direito administrativo (ex: circulação rotineira de viaturas, limpeza de repartição)\n- **Fato Administrativo**: Fato natural ou humano que produz efeitos jurídicos na esfera administrativa independentemente de vontade (ex: morte de servidor estável que gera vacância de cargo; desabamento de ponte por temporal)\n- **Ato da Administração**: Toda manifestação de agentes públicos (abrange atos de direito privado, atos de governo, atos materiais e atos administrativos)\n- **Ato Administrativo (Conceito Estrito)**: Manifestação unilateral de vontade da Administração Pública que, sob o regime de direito público, tem por finalidade imediata adquirir, resguardar, transferir, modificar, extinguir ou declarar direitos, ou impor obrigações aos administrados ou a si própria\n\n### 2. O Silêncio Administrativo\n- O silêncio da Administração é um **FATO ADMINISTRATIVO** (não é ato administrativo!)\n- **Regra Geral**: O silêncio não produz efeito jurídico tácito algum\n- **Exceção**: Só produz efeito de deferimento ou indeferimento quando houver **expressa previsão em lei**\n- **Omissão Ilícita**: Cabe impetrar Mandado de Segurança ou Ação de Obrigação de Fazer para que o juiz assine prazo para a autoridade decidir (o Judiciário não substitui a vontade do Executivo, mas compele à decisão)\n\n---\n\n## 🧩 Eixo 1: Os Cinco Elementos do Ato Administrativo (CO-FI-FO-MO-OB)\n### 1. Quadro Geral dos Elementos Estruturais (Lei nº 4.717/1965)\n- **1. Competência (Sujeito)**:\n  - Poder atribuído pela lei ao agente para a prática do ato\n  - Elemento **SEMPRE VINCULADO**\n  - *Vício*: Excesso de poder, usurpação de função ou incompetência\n  - *Sanabilidade*: Vício sanável (convalidável) se a competência NÃO for exclusiva!\n- **2. Finalidade**:\n  - Bem jurídico mediato objetivado pelo ato (Interesse público geral + Fim específico definido em lei)\n  - Elemento **SEMPRE VINCULADO**\n  - *Vício*: Desvio de finalidade / Desvio de poder\n  - *Sanabilidade*: **INSANÁVEL** (vício de finalidade nunca se convalida)\n- **3. Forma**:\n  - Modo exterior de manifestação da vontade (regra: forma escrita e solene)\n  - Elemento **SEMPRE VINCULADO**\n  - *Vício*: Ausência de forma ou inobservância de solenidade\n  - *Sanabilidade*: Vício sanável se a forma não for essencial para a validade do ato!\n- **4. Motivo**:\n  - Situação fática de fato e os fundamentos de direito que justificam a prática do ato\n  - Pode ser **VINCULADO ou DISCRICIONÁRIO**\n  - *Vício*: Motivo inexistente, falso ou juridicamente inadequado\n  - *Sanabilidade*: **INSANÁVEL** (não se pode alterar o motivo pretérito)\n- **5. Objeto (Conteúdo)**:\n  - O efeito jurídico imediato que o ato produz (o que o ato declara, concede, interdita, pune)\n  - Pode ser **VINCULADO ou DISCRICIONÁRIO**\n  - *Vício*: Objeto ilícito, impossível, indeterminado ou imoral\n  - *Sanabilidade*: **INSANÁVEL**\n\n### 2. Motivo vs. Motivação e Teoria dos Motivos Determinantes\n- **Motivo**: É o pressuposto fático e legal objetivo (o evento do mundo real)\n- **Motivação**: É a exteriorização formal e escrita das razões fáticas e jurídicas\n- **Teoria dos Motivos Determinantes**:\n  - A validade do ato vincula-se indissociavelmente aos motivos expostos pela autoridade\n  - Se os motivos invocados forem falsos ou inexistentes, o ato é **NULO DE PLENO DIREITO**, mesmo que a motivação fosse facultativa (ex: exoneração de cargo em comissão motivada por falta injustificada inexistente)\n- **Motivação Aliunde (Per Relationem)**: É válida a motivação por remissão formal a pareceres, informações ou decisões anteriores constantes do processo\n\n---\n\n## 🛡️ Eixo 2: Os Atributos do Ato Administrativo (Mnemônico: PATI)\n### 1. Presunção de Legitimidade e Veracidade\n- *Presunção de Legitimidade*: Conformidade do ato com o ordenamento jurídico\n- *Presunção de Veracidade*: Conformidade dos fatos declarados com a verdade real\n- **Presente em TODOS os atos administrativos**\n- Natureza: *Juris tantum* (relativa), inverte o ônus da prova para quem contesta\n\n### 2. Autoexecutoriedade\n- Prerrogativa de executar diretamente suas determinações sem prévia autorização judicial\n- *Exigibilidade*: A obrigação é formalmente exigível de plano (decisão unilateral)\n- *Executoriedade*: Emprego direto da força e coação material (demolição, apreensão de remédio)\n- **Exceção Capital**: A cobrança forçada de crédito decorrente de **MULTA NÃO é autoexecutória** (exige execução fiscal na Justiça!)\n\n### 3. Tipicidade\n- O ato administrativo deve corresponder a figuras e modelos previamente desenhados pela lei\n- Impede a prática de atos arbitrários ou inominados não previstos no direito positivo\n\n### 4. Imperatividade (Poder Extroverso)\n- Capacidade de impor obrigações coercitivas a terceiros independentemente de sua concordância\n- **NÃO ESTÁ PRESENTE EM TODOS OS ATOS**: Ausente em atos negociais (licença, autorização) e enunciativos (certidões, atestados)\n\n---\n\n## 📊 Eixo 3: Classificação dos Atos Administrativos\n### 1. Quanto à Formação da Vontade (Foco Máximo Cebraspe/FGV)\n- **Ato Simples**:\n  - Manifestação de vontade de um **ÚNICO ÓRGÃO** (seja ele singular/unipessoal ou colegiado/pluripessoal)\n  - Ex: Portaria ministerial; acórdão unânime de um Tribunal administrativo\n- **Ato Complexo**:\n  - Fusão e conjugação de vontades de **DOIS OU MAIS ÓRGÃOS INDEPENDENTES** que se unem para formar um **ÚNICO ATO**\n  - A vontade de um órgão é incompleta sem a do outro\n  - *Exemplo Canônico*: Aposentadoria de servidor público (órgão de origem + registro do TCU - Súmula Vinculante nº 3)\n  - *Exemplo Constitucional*: Nomeação de Ministro do STF (Presidente indica + Senado aprova + Presidente nomeia)\n- **Ato Composto**:\n  - Envolve **DOIS ATOS DISTINTOS**: Um ato principal (que já está perfeito) e um ato acessório que o homologa, aprova ou ratifica\n  - Praticado por um órgão e ratificado por outro\n  - Ex: Visto de autoridade superior; aprovação de orçamento por comitê gestor\n\n---\n\n## 📜 Eixo 4: Espécies de Atos Administrativos (Mnemônico: PONEI)\n### 1. As Cinco Espécies\n- **Punitivos**: Aplicação de sanções administrativas e funcionais (multas, demissão, interdição de fábrica)\n- **Ordinatórios**: Disciplinam o funcionamento interno da administração e a conduta de servidores (circulares, portarias internas, memorandos, ordens de serviço)\n- **Negociais**: Manifestação de vontade convergente com o particular\n- **Enunciativos**: Atestam ou certificam uma situação fática prévia sem manifestar vontade estatal autônoma (certidões, atestados, pareceres consultivos)\n- **Normativos**: Comandos gerais e abstratos para a fiel execução das leis (decretos, regulamentos, regimentos)\n\n### 2. O Duelo Clássico: Licença vs. Autorização\n- **Licença**:\n  - Ato **VINCULADO e DEFINITIVO**\n  - Preenchidos os requisitos da lei, o administrado tem **direito subjetivo** à obtenção\n  - Gera direito adquirido; não pode ser revogada discricionariamente\n  - Exemplos: Licença para dirigir (CNH), licença para construir, licença para exercício profissional\n- **Autorização**:\n  - Ato **DISCRICIONÁRIO e PRECÁRIO**\n  - Juízo de conveniência e oportunidade do Estado\n  - Pode ser **REVOGADA A QUALQUER TEMPO** pela Administração sem direito a indenização\n  - Exemplos: Autorização para uso de praça para evento, porte de arma para defesa pessoal\n\n---\n\n## ❌ Eixo 5: Extinção dos Atos Administrativos\n### 1. Anulação vs. Revogação\n- **Anulação (Invalidação)**:\n  - *Motivo*: **Ilegalidade / Ilegitimidade** do ato (vício insanável)\n  - *Competência*: Pela **Administração Pública** (Autotutela - Súmula 473 STF) OU pelo **Poder Judiciário**\n  - *Efeitos Temporais*: **EX TUNC** (retroage às origens, destruindo todos os efeitos)\n  - *Decadência*: Prazo de **5 anos** para a Administração anular atos favoráveis a destinatários de boa-fé (Lei 9.784/99, art. 54)\n- **Revogação**:\n  - *Motivo*: **Inconveniência ou Inoportunidade** superveniente de ato originalmente válido\n  - *Competência*: **PRIVATIVA da Administração Pública** (O Judiciário **JAMAIS** revoga atos do Executivo!)\n  - *Efeitos Temporais*: **EX NUNC** (prospectivo, não retroage, respeita efeitos pretéritos)\n  - *Atos Irrevogáveis*: Atos vinculados, atos consumados, atos que geraram direito adquirido, atos integrantes de processo findo\n\n### 2. Outras Formas de Extinção\n- **Cassação**: Extinção sancionatória porque o beneficiário do ato descumpriu condições legais essenciais supervenientes (ex: hotel que descumpre alvará e passa a funcionar como prostíbulo)\n- **Caducidade**: Extinção pela superveniência de lei nova que torna a atividade concedida juridicamente ilícita ou incompatível\n- **Contraposição / Derrubada**: Emissão de novo ato, emitido com base em competência diversa, cujos efeitos extinguem o ato anterior (ex: nomeação extinta por exoneração)\n- **Renúncia**: O próprio beneficiário abre mão voluntariamente dos efeitos do ato\n\n---\n\n## 🩹 Eixo 6: Convalidação (Sanatória) dos Atos Administrativos\n### 1. Conceito e a Regra de Ouro do 'FO-CO'\n- Correção de vício sanável do ato administrativo, com efeitos retroativos (**EX TUNC**)\n- **Requisitos Cumulativos Obrigatórios**:\n  - Não acarretar lesão ao interesse público\n  - Não causar prejuízos a terceiros\n  - Apresentar defeitos passíveis de convalidação\n- **A Regra do FO-CO**: Apenas a **FORMA** (não essencial) e a **COMPETÊNCIA** (não exclusiva) admitem convalidação!\n- Vícios em **Finalidade, Motivo e Objeto são ABSOLUTAMENTE INSANÁVEIS**\n\n---\n\n## ⚖️ Eixo 7: Súmulas Vinculantes e Radar Cebraspe / FGV\n- **Súmulas 346 e 473 do STF**: Princípio da Autotutela (A Administração pode anular seus próprios atos ilegais e revogar os inoportunos)\n- **Súmula Vinculante nº 3**: O TCU só exige contraditório e ampla defesa em processo de aposentadoria se transcorridos mais de 5 anos da chegada do processo ao Tribunal\n- **Judiciário Revoga?**: NUNCA! O Judiciário anula atos ilegais de qualquer Poder, mas nunca revoga atos discricionários de outro Poder\n- **Multa e Autoexecutoriedade**: A aplicação da penalidade é autoexecutória; a cobrança pecuniária coercitiva depende de processo judicial de execução fiscal\n";
    window.onload = () => {
      const { Markmap, loadCSS, loadJS } = window.markmap;
      const transformer = new window.markmap.Transformer();
      const { root, features } = transformer.transform(markdown);
      const { styles, scripts } = transformer.getUsedAssets(features);
      if (styles) loadCSS(styles);
      if (scripts) loadJS(scripts);
      Markmap.create('#mindmap', {
        duration: 300, nodeMinHeight: 20, spacingVertical: 8,
        spacingHorizontal: 80, paddingX: 16, autoFit: true
      }, root);
    };
  </script>
