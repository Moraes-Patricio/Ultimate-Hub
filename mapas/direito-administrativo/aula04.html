<body>

  <svg id="mindmap"></svg>
  <script>
    const markdown = "# ⚖️ Direito Administrativo: Aula 04\n## 🏛️ Eixo 0: Deveres e Poderes Administrativos\n### 1. O Poder-Dever de Agir\n- Os poderes administrativos são instrumentais e irrenunciáveis (são prerrogativas de autoridade vinculadas a um dever de agir em prol do interesse público)\n- **Vedação à Inércia**: A omissão injustificada do agente público configura ilícito funcional e responsabilidade civil do Estado por falta do serviço (faute du service)\n\n### 2. Os Três Deveres Fundamentais do Administrador\n- **Dever de Eficiência**: Atuação célere, com rendimento funcional e economicidade (EC nº 19/1998)\n- **Dever de Probidade**: Atuação honesta, leal e de boa-fé subjetiva e objetiva\n- **Dever de Prestar Contas**: Princípio republicano basilar (CF, art. 70, parágrafo único); abrange qualquer pessoa que gerencie recursos públicos\n\n---\n\n## ⚖️ Eixo 1: Poder Vinculado e Poder Discricionário\n### 1. Poder Vinculado (Regrado)\n- A lei define previamente e de modo taxativo o único comportamento possível diante da situação fática\n- Ausência total de margem de escolha ou subjetivismo do agente público\n- Exemplo: Concessão de aposentadoria a servidor que cumpriu todos os requisitos legais; emissão de licença para construir\n\n### 2. Poder Discricionário (Mérito Administrativo)\n- A lei confere expressa ou implicitamente uma margem legítima de liberdade de escolha para o administrador\n- **Núcleo do Mérito Administrativo**: Juízo de **Conveniência e Oportunidade** dentro dos limites legais\n- Exemplos: Autorização para uso privativo de bem público; escolha do local para instalação de uma praça pública\n- **Controle Judicial do Ato Discricionário**:\n  - O Poder Judiciário **NÃO PODE** substituir o mérito administrativo da decisão discricionária\n  - O Judiciário **PODE E DEVE** anular atos discricionários que desbordem os limites da lei, violem a moralidade ou infrinjam a razoabilidade e a proporcionalidade\n\n---\n\n## 🏢 Eixo 2: Poder Hierárquico\n### 1. Conceito e Prerrogativas Decorrentes\n- Vínculo interno e vertical de subordinação existente entre órgãos e agentes de uma mesma pessoa jurídica\n- **Prerrogativas Canônicas**: Dar ordens (comando), fiscalizar a atuação, avocar competências, delegar atribuições e anular/revogar atos de subordinados\n\n### 2. Vedações Absolutas à Delegação (Lei 9.784/1999, Art. 13 — Mnemônico CE-NO-RA)\n- **CE**: Edição de atos de competência exclusiva\n- **NO**: Edição de atos de caráter normativo\n- **RA**: Decisão de recursos administrativos\n\n### 3. Onde NÃO Existe Poder Hierárquico (Pegadinhas Frequentes)\n- **Entre a Administração Direta e a Indireta**: Há apenas tutela / supervisão ministerial (vinculação finalística)\n- **Entre os Três Poderes da República**: Há independência e harmonia constitucional\n- **Nas Funções Típicas Jurisdicionais e Legislativas**: Magistrados e parlamentares não sofrem subordinação funcional\n- **Sobre Particulares Comuns**: A relação é de polícia administrativa, sem qualquer hierarquia\n\n---\n\n## 🔨 Eixo 3: Poder Disciplinar\n### 1. Conceito e Âmbito de Incidência\n- Prerrogativa do Estado de apurar infrações funcionais e aplicar sanções disciplinares a quem possui **VÍNCULO JURÍDICO ESPECÍFICO** com o Poder Público\n- **Destinatários Exclusivos**:\n  - Servidores e agentes públicos civis e militares\n  - Particulares com vínculo jurídico negocial ou institucional específico (ex: empresas concessionárias, contratados pela Lei 14.133, estudantes de escolas públicas)\n\n### 2. Poder Disciplinar vs. Poder de Polícia\n- **Poder Disciplinar**: Sanção baseada em vínculo jurídico **ESPECÍFICO** (ex: demissão de servidor; multa a concessionária de transporte)\n- **Poder de Polícia**: Sanção baseada em vínculo de sujeição **GERAL** a toda a coletividade (ex: multa de trânsito a motorista; interdição de restaurante pela vigilância sanitária)\n\n---\n\n## 📜 Eixo 4: Poder Regulamentar ou Normativo\n### 1. Poder Normativo (Gênero) vs. Regulamentar (Espécie)\n- **Poder Normativo**: Atribuição geral da Administração de editar atos com efeitos gerais e abstratos (resoluções, portarias, instruções normativas)\n- **Poder Regulamentar**: Prerrogativa **privativa do Chefe do Poder Executivo** (Presidente, Governador, Prefeito) de editar decretos e regulamentos para a fiel execução da lei (CF, art. 84, IV)\n\n### 2. Decretos Autônomos (CF, Art. 84, VI — EC nº 32/2001)\n- Atos primários do Chefe do Executivo que inovam na ordem jurídica sem lei prévia, estritamente limitados a duas hipóteses:\n  - **Alínea 'a'**: Organização e funcionamento da administração federal, quando **não implicar aumento de despesa** nem **criação ou extinção de órgãos públicos**\n  - **Alínea 'b'**: Extinção de funções ou cargos públicos, **quando vagos**\n\n### 3. Controle do Poder Regulamentar\n- **Controle pelo Congresso Nacional (CF, art. 49, V)**: Competência exclusiva do Legislativo para sustar os atos normativos do Executivo que exorbitem do poder regulamentar\n- **Controle Judicial**: Controle concentrado de constitucionalidade perante o STF (ADI) se o decreto autônomo violar a CF, ou anulação por vício de legalidade em decreto regulamentar\n\n---\n\n## 🚔 Eixo 5: Teoria Geral do Poder de Polícia\n### 1. Conceito Legal (CTN, Art. 78)\n- Atividade da administração pública que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato em razão de interesse público\n- **Polícia Administrativa vs. Polícia Judiciária**:\n  - *Polícia Administrativa*: Natureza eminentemente **preventiva**, incide sobre **bens, direitos e atividades**, exercida por órgãos administrativos variados\n  - *Polícia Judiciária*: Natureza predominantemente **repressiva**, incide sobre **pessoas** (infratores penais), exercida privativamente por corporações policiais (Polícia Civil e Federal)\n\n### 2. Atributos do Poder de Polícia (Mnemônico DAC)\n- **Discricionariedade**: Margem de escolha quanto à oportunidade e conveniência (ressalvada a emissão de licença vinculada)\n- **Autoexecutoriedade**: Capacidade de executar diretamente suas decisões sem prévia intervenção judicial\n  - *Exigibilidade*: A obrigação é exigível imediatamente (ex: imposição de multa)\n  - *Executoriedade*: O Estado pratica diretamente o ato material coercitivo (ex: apreensão de mercadoria estragada, interdição de fábrica)\n  - *Atenção*: A cobrança forçada de multa de trânsito **NÃO é autoexecutória** (exige execução fiscal na Justiça!)\n- **Coercibilidade**: Uso legítimo da força pública para compelir o particular ao cumprimento da determinação\n\n### 3. As Quatro Fases do Ciclo de Polícia\n- **1. Ordem / Legislação de Polícia**: Norma abstrata que estabelece as restrições e condicionamentos\n- **2. Consentimento de Polícia**: Anuência formal estatal prévia (Licença vinculada ou Autorização discricionária)\n- **3. Fiscalização de Polícia**: Vistoria, inspeção e verificação material do cumprimento das normas\n- **4. Sanção de Polícia**: Aplicação da penalidade decorrente da infração (multa, interdição, apreensão)\n\n---\n\n## ⚖️ Eixo 6: Delegação do Poder de Polícia (Tema 532 do STF)\n### 1. A Tese do STF no RE 633.782 (Caso BHTrans / 2020)\n- É **CONSTITUCIONAL** a delegação das fases de **consentimento, fiscalização E SANÇÃO de trânsito** a empresas públicas e sociedades de economia mista da Administração Indireta!\n- **Requisitos Cumulativos Obrigatórios**:\n  - A entidade estatal deve prestar serviço público em regime **NÃO CONCORRENCIAL** (monopólio público)\n  - Deve ser pessoa jurídica de direito privado com capital social majoritariamente público\n  - A delegação deve ser outorgada por lei específica formal\n- **A única fase JAMAIS delegável**: A fase de **Ordem/Legislação de Polícia** (privativa de entes federativos)\n\n---\n\n## ⚠️ Eixo 7: O Uso e Abuso de Poder\n### 1. Espécies de Abuso de Poder\n- **Abuso de Poder (Gênero)**: Prática de ato em desconformidade com o ordenamento jurídico\n- **Excesso de Poder (Vício de Competência)**:\n  - O agente público vai além das suas atribuições legais\n  - Atua onde a lei não lhe conferiu poderes (ex: autoridade sem poder de demitir aplica demissão a servidor)\n- **Desvio de Finalidade / Desvio de Poder (Vício de Finalidade)**:\n  - O agente público é competente, mas pratica o ato visando fim diverso daquele fixado pela lei ou fim privado\n  - Exemplo clássico: Remoção punitiva de servidor para localidade distante por desavença pessoal\n\n---\n\n## ⚖️ Eixo 8: Síntese Jurisprudencial (STF & STJ)\n- **Súmula Vinculante 5 (STF)**: A falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição\n- **Súmula Vinculante 13 (STF)**: Nepotismo configura desvio de finalidade e violação direta da impessoalidade e moralidade\n- **Súmula 19 (STF)**: A exoneração de servidor em estágio probatório exige processo administrativo com ampla defesa\n- **Súmula 650 (STJ)**: A autoridade julgadora não está vinculada às conclusões da comissão processante do PAD, podendo divergir mediante motivação explícita fundamentada nos autos\n\n---\n\n## 🎯 Eixo 9: Radar de Pegadinhas Cebraspe & FGV\n- **Excesso de Poder vs. Desvio de Finalidade**: Vício de competência vs. Vício de finalidade\n- **Decreto Autônomo**: Só pode extinguir cargos vagos; se ocupados, exige LEI\n- **Autoexecutoriedade da Multa**: A aplicação da multa é autoexecutória; a cobrança financeira forçada exige ação de execução fiscal judicial!\n- **Hierarquia vs. Tutela**: Entre Ministério e Autarquia NÃO HÁ hierarquia, apenas tutela finalística\n- **Delegação a Particulares Puros**: O poder sancionatório de polícia NUNCA pode ser delegado a empresas privadas comuns\n";
    window.onload = () => {
      const { Markmap, loadCSS, loadJS } = window.markmap;
      const transformer = new window.markmap.Transformer();
      const { root, features } = transformer.transform(markdown);
      const { styles, scripts } = transformer.getUsedAssets(features);
      if (styles) loadCSS(styles);
      if (scripts) loadJS(scripts);
      Markmap.create('#mindmap', {
        duration: 300, nodeMinHeight: 20, spacingVertical: 8,
        spacingHorizontal: 80, paddingX: 16, autoFit: true
      }, root);
    };
  </script>
