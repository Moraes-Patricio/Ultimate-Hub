  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>

  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 04 - Antigravity)
## 🏛️ Eixo 1: Deveres e Poderes Administrativos
### 1. O Poder-Dever de Agir
- Os poderes administrativos são instrumentais e irrenunciáveis (são prerrogativas de autoridade vinculadas a um dever de agir em prol do interesse público)
- **Vedação à Inércia**: A omissão injustificada do agente público configura ilícito funcional e responsabilidade civil do Estado por falta do serviço (faute du service)

### 2. Os Três Deveres Fundamentais do Administrador
- **Dever de Eficiência**: Atuação célere, com rendimento funcional e economicidade (EC nº 19/1998)
- **Dever de Probidade**: Atuação honesta, leal e de boa-fé subjetiva e objetiva
- **Dever de Prestar Contas**: Princípio republicano basilar (CF, art. 70, parágrafo único); abrange qualquer pessoa que gerencie recursos públicos

---

## ⚖️ Eixo 2: Poder Vinculado e Poder Discricionário
### 1. Poder Vinculado (Regrado)
- A lei define previamente e de modo taxativo o único comportamento possível diante da situação fática
- Ausência total de margem de escolha ou subjetivismo do agente público
- Exemplo: Concessão de aposentadoria a servidor que cumpriu todos os requisitos legais; emissão de licença para construir

### 2. Poder Discricionário (Mérito Administrativo)
- A lei confere expressa ou implicitamente uma margem legítima de liberdade de escolha para o administrador
- **Núcleo do Mérito Administrativo**: Juízo de **Conveniência e Oportunidade** dentro dos limites legais
- Exemplos: Autorização para uso privativo de bem público; escolha do local para instalação de uma praça pública
- **Controle Judicial do Ato Discricionário**:
  - O Poder Judiciário **NÃO PODE** substituir o mérito administrativo da decisão discricionária
  - O Judiciário **PODE E DEVE** anular atos discricionários que desbordem os limites da lei, violem a moralidade ou infrinjam a razoabilidade e a proporcionalidade

---

## 🏢 Eixo 3: Poder Hierárquico
### 1. Conceito e Prerrogativas Decorrentes
- Vínculo interno e vertical de subordinação existente entre órgãos e agentes de uma mesma pessoa jurídica
- **Prerrogativas Canônicas**: Dar ordens (comando), fiscalizar a atuação, avocar competências, delegar atribuições e anular/revogar atos de subordinados

### 2. Vedações Absolutas à Delegação (Lei 9.784/1999, Art. 13 — Mnemônico CE-NO-RA)
- **CE**: Edição de atos de competência exclusiva
- **NO**: Edição de atos de caráter normativo
- **RA**: Decisão de recursos administrativos

### 3. Onde NÃO Existe Poder Hierárquico (Pegadinhas Frequentes)
- **Entre a Administração Direta e a Indireta**: Há apenas tutela / supervisão ministerial (vinculação finalística)
- **Entre os Três Poderes da República**: Há independência e harmonia constitucional
- **Nas Funções Típicas Jurisdicionais e Legislativas**: Magistrados e parlamentares não sofrem subordinação funcional
- **Sobre Particulares Comuns**: A relação é de polícia administrativa, sem qualquer hierarquia

---

## 🔨 Eixo 4: Poder Disciplinar
### 1. Conceito e Âmbito de Incidência
- Prerrogativa do Estado de apurar infrações funcionais e aplicar sanções disciplinares a quem possui **VÍNCULO JURÍDICO ESPECÍFICO** com o Poder Público
- **Destinatários Exclusivos**:
  - Servidores e agentes públicos civis e militares
  - Particulares com vínculo jurídico negocial ou institucional específico (ex: empresas concessionárias, contratados pela Lei 14.133, estudantes de escolas públicas)

### 2. Poder Disciplinar vs. Poder de Polícia
- **Poder Disciplinar**: Sanção baseada em vínculo jurídico **ESPECÍFICO** (ex: demissão de servidor; multa a concessionária de transporte)
- **Poder de Polícia**: Sanção baseada em vínculo de sujeição **GERAL** a toda a coletividade (ex: multa de trânsito a motorista; interdição de restaurante pela vigilância sanitária)

---

## 📜 Eixo 5: Poder Regulamentar ou Normativo
### 1. Poder Normativo (Gênero) vs. Regulamentar (Espécie)
- **Poder Normativo**: Atribuição geral da Administração de editar atos com efeitos gerais e abstratos (resoluções, portarias, instruções normativas)
- **Poder Regulamentar**: Prerrogativa **privativa do Chefe do Poder Executivo** (Presidente, Governador, Prefeito) de editar decretos e regulamentos para a fiel execução da lei (CF, art. 84, IV)

### 2. Decretos Autônomos (CF, Art. 84, VI — EC nº 32/2001)
- Atos primários do Chefe do Executivo que inovam na ordem jurídica sem lei prévia, estritamente limitados a duas hipóteses:
  - **Alínea 'a'**: Organização e funcionamento da administração federal, quando **não implicar aumento de despesa** nem **criação ou extinção de órgãos públicos**
  - **Alínea 'b'**: Extinção de funções ou cargos públicos, **quando vagos**

### 3. Controle do Poder Regulamentar
- **Controle pelo Congresso Nacional (CF, art. 49, V)**: Competência exclusiva do Legislativo para sustar os atos normativos do Executivo que exorbitem do poder regulamentar
- **Controle Judicial**: Controle concentrado de constitucionalidade perante o STF (ADI) se o decreto autônomo violar a CF, ou anulação por vício de legalidade em decreto regulamentar

---

## 🚔 Eixo 6: Teoria Geral do Poder de Polícia
### 1. Conceito Legal (CTN, Art. 78)
- Atividade da administração pública que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato em razão de interesse público
- **Polícia Administrativa vs. Polícia Judiciária**:
  - *Polícia Administrativa*: Natureza eminentemente **preventiva**, incide sobre **bens, direitos e atividades**, exercida por órgãos administrativos variados
  - *Polícia Judiciária*: Natureza predominantemente **repressiva**, incide sobre **pessoas** (infratores penais), exercida privativamente por corporações policiais (Polícia Civil e Federal)

### 2. Atributos do Poder de Polícia (Mnemônico DAC)
- **Discricionariedade**: Margem de escolha quanto à oportunidade e conveniência (ressalvada a emissão de licença vinculada)
- **Autoexecutoriedade**: Capacidade de executar diretamente suas decisões sem prévia intervenção judicial
  - *Exigibilidade*: A obrigação é exigível imediatamente (ex: imposição de multa)
  - *Executoriedade*: O Estado pratica diretamente o ato material coercitivo (ex: apreensão de mercadoria estragada, interdição de fábrica)
  - *Atenção*: A cobrança forçada de multa de trânsito **NÃO é autoexecutória** (exige execução fiscal na Justiça!)
- **Coercibilidade**: Uso legítimo da força pública para compelir o particular ao cumprimento da determinação

### 3. As Quatro Fases do Ciclo de Polícia
- **1. Ordem / Legislação de Polícia**: Norma abstrata que estabelece as restrições e condicionamentos
- **2. Consentimento de Polícia**: Anuência formal estatal prévia (Licença vinculada ou Autorização discricionária)
- **3. Fiscalização de Polícia**: Vistoria, inspeção e verificação material do cumprimento das normas
- **4. Sanção de Polícia**: Aplicação da penalidade decorrente da infração (multa, interdição, apreensão)

---

## ⚖️ Eixo 7: Delegação do Poder de Polícia (Tema 532 do STF)
### 1. A Tese do STF no RE 633.782 (Caso BHTrans / 2020)
- É **CONSTITUCIONAL** a delegação das fases de **consentimento, fiscalização E SANÇÃO de trânsito** a empresas públicas e sociedades de economia mista da Administração Indireta!
- **Requisitos Cumulativos Obrigatórios**:
  - A entidade estatal deve prestar serviço público em regime **NÃO CONCORRENCIAL** (monopólio público)
  - Deve ser pessoa jurídica de direito privado com capital social majoritariamente público
  - A delegação deve ser outorgada por lei específica formal
- **A única fase JAMAIS delegável**: A fase de **Ordem/Legislação de Polícia** (privativa de entes federativos)

---

## ⚠️ Eixo 8: O Uso e Abuso de Poder
### 1. Espécies de Abuso de Poder
- **Abuso de Poder (Gênero)**: Prática de ato em desconformidade com o ordenamento jurídico
- **Excesso de Poder (Vício de Competência)**:
  - O agente público vai além das suas atribuições legais
  - Atua onde a lei não lhe conferiu poderes (ex: autoridade sem poder de demitir aplica demissão a servidor)
- **Desvio de Finalidade / Desvio de Poder (Vício de Finalidade)**:
  - O agente público é competente, mas pratica o ato visando fim diverso daquele fixado pela lei ou fim privado
  - Exemplo clássico: Remoção punitiva de servidor para localidade distante por desavença pessoal

---

## ⚖️ Eixo 9: Síntese Jurisprudencial (STF & STJ)
- **Súmula Vinculante 5 (STF)**: A falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição
- **Súmula Vinculante 13 (STF)**: Nepotismo configura desvio de finalidade e violação direta da impessoalidade e moralidade
- **Súmula 19 (STF)**: A exoneração de servidor em estágio probatório exige processo administrativo com ampla defesa
- **Súmula 650 (STJ)**: A autoridade julgadora não está vinculada às conclusões da comissão processante do PAD, podendo divergir mediante motivação explícita fundamentada nos autos

---

## 🎯 Eixo 10: Radar de Pegadinhas Cebraspe & FGV
- **Excesso de Poder vs. Desvio de Finalidade**: Vício de competência vs. Vício de finalidade
- **Decreto Autônomo**: Só pode extinguir cargos vagos; se ocupados, exige LEI
- **Autoexecutoriedade da Multa**: A aplicação da multa é autoexecutória; a cobrança financeira forçada exige ação de execução fiscal judicial!
- **Hierarquia vs. Tutela**: Entre Ministério e Autarquia NÃO HÁ hierarquia, apenas tutela finalística
- **Delegação a Particulares Puros**: O poder sancionatório de polícia NUNCA pode ser delegado a empresas privadas comuns
`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 380,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
