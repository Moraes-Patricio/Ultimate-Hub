    let rawMarkdown = `# Mapa (Dir. Adm. Aula 18 - Antigravity)

## 🚪 Eixo 1: Contratação Direta: Inexigibilidade vs. Dispensa de Licitação
### 1. Dicotomia Ontológica Fundamental
- **Inexigibilidade de Licitação (Art. 74)**:
  - **Inviabilidade de competição** (impossível estabelecer julgamento objetivo)
  - Rol **EXEMPLIFICATIVO** (*numerus apertus*)
- **Dispensa de Licitação (Art. 75)**:
  - A competição é viável e possível, mas a lei autoriza ou determina a não realização da licitação por razões de interesse público
  - Rol **TAXATIVO** (*numerus clausus*)

### 2. As Cinco Hipóteses Exemplificativas de Inexigibilidade (Art. 74)
- **I - Fornecedor Exclusivo**: Aquisição de material, equipamento ou gênero que só possa ser fornecido por produtor, empresa ou representante comercial exclusivo (comprovado por atestado de exclusividade)
- **II - Profissional Artístico Consagrado**: Contratação de profissional do setor artístico diretamente ou por empresário exclusivo, desde que consagrado pela crítica especializada ou pela opinião pública
- **III - Serviços Técnicos Especializados de Natureza Predominantemente Intelectual**:
  - Prestados por profissionais ou empresas de **notória especialização**
  - Hipóteses: Pareceres, perícias, projetos de engenharia, defesa judicial, auditorias e treinamento de pessoal
  - 🚨 **Revolução da Lei 14.133/21**: **NÃO SE EXIGE MAIS A SINGULARIDADE DO SERVIÇO** (basta natureza intelectual e notória especialização)! *Vedada inexigibilidade para serviços de publicidade e divulgação*!
- **IV - Credenciamento**: Contratação mediante processo prévio de credenciamento
- **V - Aquisição ou Locação de Imóvel**: Imóvel cujas características de instalação e localização tornem sua escolha necessária

### 3. As Principais Hipóteses de Dispensa de Licitação (Art. 75)
- **Dispensa em Razão do Valor (Pequeno Valor - Incisos I e II)**:
  - *Inciso I*: Obras e serviços de engenharia ou manutenção de veículos até **R\$ 100.000,00** (valores atualizados por decreto anual)
  - *Inciso II*: Outros serviços e compras até **R\$ 50.000,00** (valores atualizados anualmente)
  - *Limite em Dobro*: Valores duplicados para consórcios públicos e agências executivas!
- **Dispensa em Razão de Situação Emergencial (Inciso VIII)**:
  - Casos de emergência ou calamidade pública
  - Contratação restrita aos bens necessários para atendimento imediato da emergência
  - Prazo máximo improrrogável do contrato emergencial: **1 (um) ano** (na Lei 8.666 eram 180 dias)!
  - Vedada a prorrogação de contrato emergencial e a recontratação da mesma empresa pelo mesmo motivo!
- **Licitação Deserta vs. Fracassada (Inciso III)**:
  - *Deserta*: Nenhum interessado acode à licitação -> Pode dispensar se mantidas as condições do edital e houver prejuízo na repetição
  - *Fracassada*: Todos os licitantes são desclassificados ou inabilitados -> Concede prazo de 8 dias para saneamento ou dispensa fundamentada

---

## 🏷️ Eixo 2: Alienação de Bens Públicos: Regras para Imóveis e Móveis (Arts. 76 e 77)
### 1. Alienação de Imóveis (Art. 76, I)
- Requisitos: Interesse público justificado + Avaliação prévia + **Autorização legislativa** + Licitação na modalidade **LEILÃO**
- *Casos de Licitação Dispensada*: Dação em pagamento, Doação a outro órgão público, Permuta, Investidura, Regularização fundiária de interesse social (REURB-S)

### 2. Alienação de Móveis (Art. 76, II)
- Requisitos: Interesse público + Avaliação prévia + Licitação por **LEILÃO** (dispensada autorização legislativa)

---

## 🔄 Eixo 3: As Fases do Processo Licitatório e a Inversão de Fases
### 1. Sequência Legal Ordinária das Fases (Art. 17)
- 1ª Fase: **Preparatória (Planejamento)** - Estudo Técnico Preliminar (ETP), Termo de Referência (TR), Edital e Minuta do Contrato
- 2ª Fase: **Divulgação do Edital de Licitação**
- 3ª Fase: **Apresentação de Propostas e Lances**
- 4ª Fase: **Julgamento das Propostas**
- 5ª Fase: **Habilitação** (Apenas do licitante vencedor classificado em 1º lugar!)
- 6ª Fase: **Recursal (Fase Única)**
- 7ª Fase: **Homologação** pela autoridade superior

### 2. A Regra Geral da Inversão de Fases
- Na Lei 14.133/2021, o julgamento das propostas **ANTECEDE** a fase de habilitação (Regra da Inversão de Fases universalizada)!
- Somente se analisa a documentação de habilitação do licitante que venceu a etapa de julgamento (economia processual)
- *Exceção*: A habilitação poderá anteceder o julgamento desde que expressamente previsto no edital e motivado

---

## 📑 Eixo 4: Habilitação dos Licitantes: Documentação e Requisitos (Arts. 62 a 70)
### 1. Documentação Exigível Exclusiva
- **Habilitação Jurídica**: Existência legal da pessoa jurídica (registro comercial, ato constitutivo, estatuto)
- **Qualificação Técnico-Profissional e Técnico-Operacional**:
  - Técnico-Profissional: Existência de profissional com anotação de responsabilidade técnica (ART/RRT)
  - Técnico-Operacional: Atestado em nome da própria empresa licitante (vedado exigir atestado com quantitativo superior a 50% da parcela de maior relevância!)
- **Habilitação Fiscal, Social e Trabalhista**: Regularidade perante a Receita Federal, Fazendas Estadual e Municipal, FGTS, CNDT (Certidão Negativa de Débitos Trabalhistas) e cumprimento do art. 7º, XXXIII da CF (proibição de trabalho noturno/perigoso a menores de 18 e qualquer trabalho a menores de 16, salvo aprendiz aos 14)
- **Qualificação Econômico-Financeira**: Balanço patrimonial, índices de liquidez usuais e certidão negativa de falência

---

## 🛠️ Eixo 5: Os Cinco Procedimentos Auxiliares das Licitações (Arts. 78 a 88)
### 1. Rol dos Procedimentos Auxiliares (Art. 78)
- 1. **Credenciamento**
- 2. **Pré-qualificação**
- 3. **Procedimento de Manifestação de Interesse (PMI)**
- 4. **Sistema de Registro de Preços (SRP)**
- 5. **Registro Cadastral**

### 2. Credenciamento (Art. 79)
- Processo de chamamento público no qual a Administração convoca todos os interessados que preencham os requisitos para prestar serviços tabelados
- Hipóteses: Contratação paralela e simultânea (ex: credenciamento de médicos do SUS, clínicas de trânsito)

### 3. Sistema de Registro de Preços - SRP (Arts. 82 a 86)
- Procedimento para registro formal de preços relativos a prestação de serviços e aquisição de bens para contratações futuras
- Realizado mediante **Pregão** ou **Concorrência**
- Validade da Ata de Registro de Preços: **1 (um) ano**, prorrogável por igual período até o máximo de **2 anos**
- **Regras de Carona (Órgão Não Participante)**:
  - Adesão de órgão não participante limitada a **50%** dos quantitativos da ata original por órgão carona
  - O somatório de todas as adesões de caronas não pode exceder o **dobro (2x)** do quantitativo original registrado!

    // Processamento de Tags Visuais Inteligentes
    function enrichMarkdownTags(text) {
      return text
        // Bancas examinadoras
        .replace(/\b(Cebraspe|CESPE)\b/g, '<span class="tag tag-banca">🎯 $1</span>')
        .replace(/\b(FGV|FCC|VUNESP)\b/g, '<span class="tag tag-banca">📋 $1</span>')
        // Legislação e Artigos
        .replace(/\b(CF\/88|CF|Constituição Federal)\b/g, '<span class="tag tag-lei">📜 $1</span>')
        .replace(/\b(Art\.?\s*\d+[^,()<\n]*)/g, '<span class="tag tag-lei">⚖️ $1</span>')
        .replace(/\b(Lei\s*n?º?\s*\d+[\.\d+]*)/g, '<span class="tag tag-lei">📖 $1</span>')
        // Tribunais Superiores
        .replace(/\b(STF|STJ)\b/g, '<span class="tag tag-tribunal">🏛️ $1</span>')
        // Alertas e Pegadinhas
        .replace(/\b(Radar de Pegadinhas|Pegadinha)\b/g, '<span class="tag tag-alerta">⚠️ $1</span>');
    }

    const processedMarkdown = enrichMarkdownTags(rawMarkdown);

    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(processedMarkdown);
      const { Markmap } = window.markmap;
      
      mmInstance = Markmap.create('#mindmap', {
        duration: 350,
        maxWidth: 700,
        spacingVertical: 32,
        spacingHorizontal: 140,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);

      // Iniciar com os Eixos principais visíveis (Nível 1)
      setTimeout(() => {
        setLevel(1);
      }, 150);
    });

    function fitView() {
      if (mmInstance) mmInstance.fit();
    }

    function setLevel(targetLevel) {
      if (!mmInstance) return;
      function foldByLevel(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= targetLevel ? 1 : 0 };
          node.children.forEach(c => foldByLevel(c, depth + 1));
        }
      }
      foldByLevel(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }

    function handleSearch(val) {
      const query = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clearBtn');
      clearBtn.style.display = query ? 'inline-block' : 'none';

      const nodes = document.querySelectorAll('.markmap-node');
      if (!query) {
        nodes.forEach(n => {
          n.style.opacity = '1';
          n.classList.remove('search-highlight');
        });
        return;
      }

      nodes.forEach(n => {
        const text = n.textContent.toLowerCase();
        if (text.includes(query)) {
          n.style.opacity = '1';
          n.classList.add('search-highlight');
        } else {
          n.style.opacity = '0.22';
          n.classList.remove('search-highlight');
        }
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // Atalhos de Teclado
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey && e.key.toLowerCase() === 'f') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
        e.preventDefault();
        const input = document.getElementById('searchInput');
        input.focus();
        input.select();
      } else if (e.key === 'Escape') {
        clearSearch();
      }
    });
  </script>
