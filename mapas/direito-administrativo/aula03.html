<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa (Dir. Adm. Aula 03 - Antigravity)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.3) 0%, transparent 50%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #mindmap { width: 100%; height: 100%; }

    /* 1. TIPOGRAFIA POR NÍVEL HIERÁRQUICO (Alto contraste definitivo) */
    .markmap-node text {
      fill: #f8fafc !important;
    }
    .markmap-foreign {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      line-height: 1.5 !important;
      overflow: visible !important;
      color: #f1f5f9 !important;
    }
    .markmap-foreign div,
    .markmap-foreign span,
    .markmap-foreign p {
      color: inherit;
    }
    
    /* Nível 0: Título Raiz */
    .markmap-node[data-depth="0"] .markmap-foreign div {
      font-size: 16px !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8) !important;
    }

    /* Nível 1: Eixos Temáticos */
    .markmap-node[data-depth="1"] .markmap-foreign div {
      font-size: 14.5px !important;
      font-weight: 700 !important;
      color: #38bdf8 !important;
      white-space: nowrap !important;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7) !important;
    }

    /* Nível 2: Subtópicos */
    .markmap-node[data-depth="2"] .markmap-foreign div {
      font-size: 13.5px !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
    }

    /* Nível 3+: Bullets e Detalhes */
    .markmap-node[data-depth="3"] .markmap-foreign div,
    .markmap-node[data-depth="4"] .markmap-foreign div,
    .markmap-node[data-depth="5"] .markmap-foreign div {
      font-size: 12.5px !important;
      font-weight: 400 !important;
      color: #e2e8f0 !important;
      line-height: 1.55 !important;
    }

    .markmap-foreign strong, .markmap-foreign b {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }

    .markmap-foreign em, .markmap-foreign i {
      color: #fbbf24 !important;
      font-style: normal !important;
    }

    .markmap-foreign code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f43f5e !important;
      font-size: 12px;
    }

    /* Linhas conectoras do mapa */
    .markmap-link {
      stroke-width: 2.2px !important;
      stroke-opacity: 0.85 !important;
    }
    .markmap-node line {
      stroke-width: 2px !important;
    }

    /* 2. BOTÃO DE ABRIR NÓ ELEGANTE, NEON E PERFEITAMENTE ALINHADO */
    .markmap-node circle {
      cursor: pointer !important;
      r: 6px !important;
      transform: translateY(-4px); /* Centralização vertical precisa na altura da linha do texto */
      stroke-width: 2.2px !important;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Nó aberto (expandido): anel sutil com centro escuro */
    .markmap-node circle[fill="#fff"],
    .markmap-node circle[fill="rgb(255, 255, 255)"],
    .markmap-node circle[fill="white"] {
      fill: #070b14 !important;
      stroke: #64748b !important;
    }

    /* Nó fechado (recolhido com filhos): pílula de luz neon elegante */
    .markmap-node circle:not([fill="#fff"]):not([fill="rgb(255, 255, 255)"]):not([fill="white"]) {
      fill: #38bdf8 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #38bdf8) !important;
    }

    /* Efeito ao passar o cursor no botão */
    .markmap-node circle:hover {
      r: 8px !important;
      fill: #0ea5e9 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 10px #38bdf8) !important;
    }

    /* 3. CONTROLES E BADGE MODERNOS EM GLASSMORPHISM */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .badge {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Mapa (Dir. Adm. Aula 03 - Antigravity)</span>
  </div>
  <svg id="mindmap"></svg>
  <div class="controls">
    <button class="btn" onclick="fitView()">🎯 Centralizar</button>
    <button class="btn" onclick="expandAll()">📂 Expandir</button>
    <button class="btn" onclick="collapseAll()">📁 Recolher</button>
  </div>
  <script>
    let mmInstance;
    const mdContent = `# Mapa (Dir. Adm. Aula 03 - Antigravity)
## 🏛️ Eixo 1: Fundamentos do Terceiro Setor e Conceito de Paraestatais
### 1. A Divisão Tripartite dos Setores da Sociedade
- **Primeiro Setor (O Estado)**:
  - Administração Pública Direta e Indireta (Poder Público, imperium e serviços estatais)
- **Segundo Setor (O Mercado)**:
  - Iniciativa privada com fins lucrativos (empresas privadas regidas pela livre concorrência)
- **Terceiro Setor (A Sociedade Civil Organizada)**:
  - Pessoas jurídicas de direito privado, sem fins lucrativos, que atuam em atividades de interesse público e social em regime de cooperação e fomento com o Estado

### 2. Conceito Dogmático de Entidades Paraestatais
- **Atuação 'Ao Lado do Estado' (Para-estatais)**:
  - **NÃO INTEGRAM A ADMINISTRAÇÃO PÚBLICA** (nem a Direta, nem a Indireta!)
  - Não exercem atividades exclusivas de Estado (não exercem poder de polícia repressivo sancionador, nem atividades legislativas/jurisdicionais)
- **Reforma Gerencial de 1995 (Plano Diretor da Reforma do Aparelho do Estado - MARE)**:
  - *Núcleo Estratégico*: Estado puro (Poderes, Forças Armadas, Polícia, Tributação)
  - *Serviços Não Exclusivos*: Atividades sociais (saúde, educação, cultura, pesquisa, assistência) -> Idealmente executadas pelo Terceiro Setor mediante parcerias de fomento estatal

---

## 🏢 Eixo 2: Serviços Sociais Autônomos (O 'Sistema S')
### 1. Natureza Jurídica e Criação
- **Natureza Jurídica**: Pessoas jurídicas de direito privado, sem fins lucrativos, criadas por autorização de LEI e instituídas por confederações patronais e sindicais de grau superior
- **Exemplos Canônicos**: SESI, SENAI (Indústria); SESC, SENAC (Comércio); SEST, SENAT (Transporte); SENAR (Rural); SESCOOP (Cooperativismo); SEBRAE, APEX-Brasil e ABDI
- **Atividade Principal**: Fomento e qualificação profissional, aprendizagem, assistência social e recreação para trabalhadores de categorias específicas

### 2. Regime Jurídico Próprio
- **Financiamento por Recursos Parafiscais**:
  - Arrecadação compulsória de contribuições sociais gerais sobre a folha de salários (CF, art. 240)
  - Recursos possuem natureza pública de destinação vinculada
- **Regime Licitatório**:
  - **NÃO UTILIZAM a Lei nº 14.133/2021** (Nova Lei de Licitações)!
  - Possuem Regulamentos Próprios de Licitações e Contratos, devendo respeitar apenas os princípios constitucionais gerais do art. 37, caput (jurisprudência consolidada do TCU e STF)
- **Regime de Pessoal**:
  - Empregados celetistas comuns (CLT). **NÃO HÁ exigência de concurso público rígido**
  - Exige-se apenas processo seletivo público com critérios impessoais e objetivos
- **Controle Externo**:
  - **Submetem-se obrigatoriamente à prestação de contas perante o Tribunal de Contas da União (TCU)** (STF - RE 789.874)

---

## 📜 Eixo 3: Organizações Sociais (OS — Lei nº 9.637/1998)
### 1. Conceito e Qualificação Jurídica
- **O que são**: Pessoas jurídicas de direito privado, sem fins lucrativos, que recebem a outorga de um TÍTULO/QUALIFICAÇÃO concedida pelo Poder Executivo
- **Áreas Taxativas de Atuação**:
  - Ensino, pesquisa científica, desenvolvimento tecnológico, proteção e preservação do meio ambiente, cultura e saúde
- **Ato de Qualificação**:
  - Ato **DISCRICIONÁRIO** do Ministro de Estado ou Secretário competente
  - A entidade privada não tem direito subjetivo à qualificação, dependendo da conveniência e oportunidade estatal

### 2. Vínculo Formal e Governança
- **Vínculo**: Celebrado exclusivamente mediante **CONTRATO DE GESTÃO**
- **Conselho de Administração Obrigatório**:
  - Deve contar com participação obrigatória de representantes do Poder Público (20% a 40%) e da sociedade civil organizada

### 3. Decisões Históricas da ADI 1.923/DF (STF)
- **Constitucionalidade Plena**: A transferência de serviços sociais não exclusivos a OS é plenamente compatível com a CF/88
- **Cessão Especial de Servidores Públicos**: É lícita a cessão de servidores públicos civis com ônus para o órgão de origem
- **Dispensa de Licitação Válida**:
  - Dispensa de licitação permitida para celebração de contrato de gestão com a OS (Lei 14.133/2021, art. 75, XV)
  - Dispensa permitida para cessão e permissão de uso de bens públicos móveis/imóveis e repasse de verbas orçamentárias
- **Seleção Pública Prévia Obrigatória**: O Poder Público deve realizar processo seletivo público impessoal e objetivo para escolher a OS parceira
- **Regulamento Próprio de Compras**: A OS não segue a Lei 14.133/21 para suas contratações; edita regulamento próprio simplificado
- **Contratação de Pessoal**: Empregados celetistas sem concurso público (regras de direito privado)
- **Fiscalização**: Controle rigoroso e prestação de contas ao Tribunal de Contas

---

## ⚖️ Eixo 4: Organizações da Sociedade Civil de Interesse Público (OSCIP — Lei nº 9.790/1999)
### 1. Conceito e Ato de Qualificação
- **O que são**: Pessoas jurídicas de direito privado, sem fins lucrativos, que obtêm qualificação jurídica perante o Ministério da Justiça
- **Ato de Qualificação**:
  - Ato **VINCULADO** do Ministério da Justiça!
  - Preenchidos os requisitos documentais e estatutários exigidos por lei, o Poder Público é **obrigado** a conceder o título de OSCIP
- **Vínculo Formal**: Celebrado mediante **TERMO DE PARCERIA**
- **Remuneração de Dirigentes**:
  - A Lei 9.790/99 expressamente autoriza a remuneração dos dirigentes da OSCIP que atuem efetivamente na gestão executiva (desde que compatível com valores de mercado)

### 2. Proibições Legais de Qualificação (Quem NÃO Pode Ser OSCIP)
- Sindicatos, associações de classe ou de representação de categoria profissional
- Partidos políticos e suas fundações
- Entidades religiosas ou filosóficas
- Instituições privadas de ensino e hospitais privados que prestem serviços exclusivamente cobrados / comercializados
- Cooperativas (salvo cooperativas sociais de vulneráveis)
- Entidades de previdência complementar e instituições financeiras

---

## 🤝 Eixo 5: O Marco Regulatório das OSC (MROSC — Lei nº 13.019/2014)
### 1. Abrangência e Conceito Geral de OSC
- Lei de abrangência nacional (aplica-se a todos os entes: União, Estados, DF e Municípios)
- **Conceito de Organização da Sociedade Civil (OSC)**: Entidades privadas sem fins lucrativos, cooperativas sociais ou organizações religiosas com projetos sociais

### 2. Os Três Instrumentos Canônicos de Parceria
- **1. Termo de Colaboração**:
  - Proposto pela **Administração Pública**
  - **COM** repasse de recursos financeiros
- **2. Termo de Fomento**:
  - Proposto pela própria **Organização da Sociedade Civil (OSC)**
  - **COM** repasse de recursos financeiros
- **3. Acordo de Cooperação**:
  - Pode ser proposto pela Administração ou pela OSC
  - **SEM REPASSE DE RECURSOS FINANCEIROS** (envolve cessão de uso, compartilhamento de infraestrutura ou cooperação mútua)

### 3. Chamamento Público e Manifestação de Interesse Social
- **Regra Geral**: Seleção das OSC mediante **Chamamento Público** competitivo e impessoal
- **Procedimento de Manifestação de Interesse Social (PMIS)**:
  - Cidadãos e organizações podem formalmente provocar o Estado para abertura de editais de parceria em áreas desassistidas

---

## 🏥 Eixo 6: Entidades de Apoio
### 1. Natureza e Funcionamento
- Pessoas jurídicas de direito privado (fundações, associações ou cooperativas) criadas por servidores e docentes de universidades federais e hospitais de ensino
- Vínculo com o Estado: Celebrado mediante **CONVÊNIO** administrativo
- Objetivo: Proporcionar apoio operacional, logístico e financeiro na execução de projetos de pesquisa, ensino, extensão e inovação científica

---

## 🎯 Eixo 7: Radar de Pegadinhas Cebraspe & FGV
### 1. Decodificação de Oposições Binárias Frequentes
- **OS vs. OSCIP**:
  - OS = Ato DISCRICIONÁRIO + Contrato de Gestão + Conselho com Poder Público
  - OSCIP = Ato VINCULADO + Termo de Parceria + Remuneração de dirigentes
- **Termo de Colaboração vs. Termo de Fomento vs. Acordo de Cooperação**:
  - Colaboração = Iniciativa do Estado + COM repasse de dinheiro
  - Fomento = Iniciativa da OSC + COM repasse de dinheiro
  - Acordo de Cooperação = SEM repasse de dinheiro
- **Pertencimento à Administração Indireta**:
  - NENHUMA entidade do Terceiro Setor pertence à Administração Pública Direta ou Indireta!
- **Licitações**:
  - Entidades do Terceiro Setor NÃO aplicam a Lei nº 14.133/2021 para suas compras privadas; adotam regulamentos próprios com base nos princípios do art. 37
- **Concurso Público**:
  - Terceiro Setor contrata por processo seletivo simplificado via CLT (sem concurso público rígido de cargos públicos)
`;
    window.addEventListener('DOMContentLoaded', () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(mdContent);
      const { Markmap } = window.markmap;
      mmInstance = Markmap.create('#mindmap', {
        duration: 300,
        maxWidth: 650,
        spacingVertical: 20,
        spacingHorizontal: 120,
        paddingX: 18,
        color: (node) => {
          const colors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
          return colors[node.state.depth % colors.length];
        }
      }, root);
      setTimeout(() => mmInstance.fit(), 300);
    });
    function fitView() { if (mmInstance) mmInstance.fit(); }
    function expandAll() {
      if (!mmInstance) return;
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
    function collapseAll() {
      if (!mmInstance) return;
      function collapse(node, depth = 0) {
        if (node.children) {
          node.payload = { ...node.payload, fold: depth >= 1 ? 1 : 0 };
          node.children.forEach(c => collapse(c, depth + 1));
        }
      }
      collapse(mmInstance.state.data);
      mmInstance.renderData();
      mmInstance.fit();
    }
  </script>
</body>
</html>
